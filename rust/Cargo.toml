[package]
name = "chtypes"
version = "0.5.2"
edition = "2024"
# 1.87, not 1.85: ruzstd (the v1 zstd decoder) declares rust-version = "1.87"
# in every current release (0.8.3 and 0.9.0). v1 is a breaking 1.0 release, so
# this floor moves with it; rustls-platform-verifier 0.7.1 (also new in this
# release, for fetch-v1) declares 1.85, which is within the new floor.
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/wave-rf/chtypes"
homepage = "https://github.com/wave-rf/chtypes"
documentation = "https://docs.rs/chtypes"
keywords = ["clickhouse", "types", "schema", "validation", "ffi"]
categories = ["database", "api-bindings"]
description = "ClickHouse's own type system, schema validation, DEFAULT/TTL semantics and coercion, per ClickHouse version, over the frozen chs_* C ABI"

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
# serde_json is the stock JSON parser every result document, `build_info` and the
# settings object goes through. `arbitrary_precision` is not enabled: documents
# carry integers beyond 2^53 as strings, so no number is ever routed through a
# float.
serde_json = "1"
thiserror = "2"
# sha2 hashes the v0 fetch module's downloads and the fetch layer's digests.
sha2 = { version = "0.11", default-features = false }

# --- the v1 fetch layer (`src/ocifetch`, docs/guides/fetch-v1.md) is part of the
# public API now (the registry opens every library through it), so its crates
# are ordinary dependencies and the `fetch-v1` feature below is only the name
# CI and the conformance suite already use.
#
# ed25519-dalek verifies the signed statements; verification only, so the
# precomputed tables and zeroize are off.
ed25519-dalek = { version = "3", default-features = false }
# ureq fetches over HTTPS (rustls + webpki roots, no OpenSSL), with the system
# certificate store as a root-cert source on top. Its gzip feature is OFF on
# purpose: a transparently un-gzipped body would hash differently from the
# bytes a digest names.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
base64 = "0.23"
# tar unpacks the artifact layer; xattr support is not wanted.
tar = { version = "0.4", default-features = false }
# ruzstd is the zstd *decoder* (pure Rust, no system dependency): v1 artifacts
# are zstd-compressed.
ruzstd = { version = "0.9.0", default-features = false, features = ["std"] }

# --- the v0 `fetch` module's own dependency: gzip for the v0 tarball. Removed
# with the module by the switch lane.
flate2 = { version = "1", optional = true }

[features]
default = ["fetch"]
# The v0 `chtypes::fetch` module and the `chtypes` binary, kept until the
# switch lane deletes them (the v1 fetch plan's §2.4). Nothing in the v1 public
# API uses it.
fetch = ["dep:flate2"]
# Retained names, no longer gating anything: the v1 fetch layer and the ABI v1
# layer are unconditional. CI commands and `[[test]] required-features` below
# still spell them.
fetch-v1 = []
abi-v1 = []

[[bin]]
name = "chtypes"
path = "src/main.rs"
required-features = ["fetch"]

# The v1 conformance suite (docs/guides/fetch-v1.md §10, plan §3.3). It reads
# CHTYPES_V1_CONFORMANCE and skips loudly, rather than failing, when unset.
[[test]]
name = "ocifetch_conformance"
path = "tests/ocifetch_conformance.rs"
required-features = ["fetch-v1"]

# The ABI v1 conformance suite re-declares src/abi1's module tree with
# #[path] (rust/src/abi1/mod.rs explains why) and needs the abi-v1 feature's
# generated layer and loader to exist at all.
[[test]]
name = "abi1_conformance"
required-features = ["abi-v1"]

[dev-dependencies]
# The integration tests read the stub conformance report and the fetch fixtures'
# case files with the same parser the crate uses.
serde_json = "1"

[[example]]
name = "demo"
path = "examples/demo.rs"

# CI already runs `cargo clippy --all-targets -- -D warnings`, which enforces
# clippy's default lint set (the `correctness`/`suspicious`/`style`/
# `complexity`/`perf` groups); this table only ADDS to that, and every entry
# below is already clean on this tree.
#
# `clippy::pedantic` (317 hits) and `clippy::nursery` are not enabled: at
# that volume it stops being "stricter" and starts being a source-wide
# rewrite outside a lint-tooling change's scope. `clippy::cargo` is enabled
# except `multiple_crate_versions`, which fires once (two `syn` majors pulled
# in transitively by different dependencies) and can only be cleared by a
# dependency bump, not a lint config. `unwrap_used`/`expect_used`/`panic`/
# `print_stdout` were tried and dropped for the same reason (68-290 existing,
# legitimate hits in tests and the CLI binary); `dbg_macro`/`todo`/
# `unimplemented` were already zero-hit and are free debug-leftover guards.
[lints.clippy]
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
