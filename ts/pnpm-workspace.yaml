# pnpm >=11 reads build-script policy from here, not from package.json.
#
# esbuild (vitest's bundler) needs its postinstall to place the platform binary.
# ffi-rs needs no build step at all: it ships prebuilt N-API binaries per platform
# (@yuuang/ffi-rs-<platform>) — darwin arm64/x64 and linux arm64/x64 for both gnu
# and musl, which covers the shipping linux-arm64 target.
allowBuilds:
  esbuild: true

# source-map-js <1.2.2 (GHSA-68fv-2mgg-jv7q) reaches the tree only through
# postcss under vite/vitest: a dev and build dependency, not part of the
# published package (whose one runtime dependency is ffi-rs). Pinned past it so
# the dependency audit stays clean.
overrides:
  source-map-js: ">=1.2.2"
