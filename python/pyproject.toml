[project]
name = "chtypes"
version = "2.0.0.dev3"
description = "Python binding for the chtypes artifacts: ClickHouse's own type system, per version, behind the frozen chs_* C ABI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["clickhouse", "types", "schema", "validation", "ffi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
# Zero runtime dependencies was the rule through v0: the binding is stdlib
# `ctypes` over the artifact's C ABI, so installing it needs no compiler, no
# cffi build step and no wheel per Python version. v1's artifacts are zstd
# (docs/guides/fetch-v1.md "Bytes"), and CPython's own `compression.zstd`
# only exists from 3.14 (PEP 784); this binding's floor is 3.11, so 3.11-3.13
# need a backport of the same stdlib-shaped API. 3.14+ needs nothing extra —
# the marker below excludes it, so a 3.14 install still carries zero
# dependencies. See README "Why ctypes".
dependencies = ["backports.zstd>=1.7; python_version < '3.14'"]

[project.urls]
Homepage = "https://github.com/wave-rf/chtypes"
Repository = "https://github.com/wave-rf/chtypes"
Documentation = "https://github.com/wave-rf/chtypes/blob/main/python/README.md"
Changelog = "https://github.com/wave-rf/chtypes/releases"

[project.scripts]
chtypes = "chtypes.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chtypes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# A deliberately small, high-signal rule set rather than "everything": these are
# the classes that have actually cost time here — unused imports and names (F),
# style errors that hide real ones (E), import order drift across 20 files (I),
# syntax this project's floor already allows (UP), and the mutable-default /
# loop-variable-capture family (B). `just lint` and the core repository's
# static checks both run this, so a finding is a gate failure, not advice.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
