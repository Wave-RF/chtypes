# release-ts — publish ts/ to npm on a `ts/v*` tag, with provenance.
# Auth: OIDC trusted publishing — no NPM_TOKEN anywhere. npm allows ONE trusted
# publisher (repo + workflow file) per package, configured on npmjs.com under the
# package's settings → Wave-RF/chtypes, release-ts.yml. That page exists only
# once the package does, so the FIRST publish is by hand from a logged-in
# laptop (RELEASING.md); every one after that is this workflow.
name: release-ts
on:
  push:
    tags: ["ts/v*"]
  # A dry run: every step up to the publish (tag-name and package version agree, install, build,
  # typecheck, `pnpm publish --dry-run`), and neither the publish nor the post-publish check.
  workflow_dispatch:
    inputs:
      tag:
        description: "the tag NAME to rehearse, e.g. ts/v1.0.0 (nothing is pushed or published)"
        required: true
        type: string
      dry_run:
        description: "rehearse only: skip the publish and the post-publish check"
        required: true
        type: boolean
        default: true
permissions:
  contents: read
# Every run: step uses bash with -eo pipefail. GitHub's default for a step
# with no shell: is `bash -e {0}`, WITHOUT pipefail, so a failing command on
# the left of a pipe was hidden by the exit status of the one on the right.
defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager from
          # ts/package.json, so the pin lives in exactly one place (it was pinned to
          # 11 here while packageManager said 12, and the two had drifted).
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The engines floor in ts/package.json (>=22.21), not an older 22.
          node-version: "22.21"
          registry-url: "https://registry.npmjs.org"
      - name: the Node in use satisfies the package's engines floor
        run: node -e "const [a,b]=process.versions.node.split('.').map(Number); if (a<22||(a===22&&b<21)) { console.error('node '+process.versions.node+' is below the 22.21 floor'); process.exit(1) }"

      - name: the tag and the package agree on the version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          name="${TAG_NAME#ts/v}"; tag="$name"; ver="$(node -p "require('./ts/package.json').version")"
          [ "$tag" = "$ver" ] || { echo "::error::tag ts/v$tag but package.json says $ver"; exit 1; }
      - run: cd ts && pnpm install --frozen-lockfile && pnpm build && pnpm typecheck
      - name: publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cd ts && pnpm publish --dry-run --access public --no-git-checks
      - name: publish
        if: github.event_name == 'push' || !inputs.dry_run
        run: cd ts && pnpm publish --provenance --access public --no-git-checks
  # A publish step exiting 0 does not mean anyone can install the package.
  # Measured on ts/v0.1.1 (issue #10): the job went green ~7 minutes before
  # npm served the tarball, and for ~2 of those minutes `latest` resolved to
  # a version that 404'd. This installs the real thing from the public
  # registry, with no credentials, in a clean directory, and then makes it
  # speak v1: its ABI fingerprint constant must equal the one in
  # include/chtypes.h, its CLI must fetch one line from the production
  # registry, and the public API must load what it fetched. It never reads
  # CHS_ABI_REVISION: the v1 header has none.
  #
  # Its own job, so "Re-run failed jobs" on a timeout re-runs ONLY this:
  # `pnpm publish` cannot be retried, npm refuses to publish over a version
  # that already landed. Measured on ts/v0.4.0 (2026-09-30): the publish step
  # went green at 13:47:36Z, but npm did not serve the version for ~26
  # minutes with no human action anywhere in that window, so the registry-lag
  # loop below keeps its one-hour bound. No `environment` and no `id-token:
  # write` here: this job only reads public registries anonymously.
  verify:
    needs: publish
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.21" }
      - name: it installs from the public registry, anonymously, and its ABI fingerprint is the header's
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#ts/v}"
          want="$(sed -n 's/^#define CHS_ABI_FINGERPRINT "\(.*\)"$/\1/p' include/chtypes.h)"
          [ -n "$want" ] || { echo "::error::could not read CHS_ABI_FINGERPRINT from include/chtypes.h"; exit 1; }
          clean="$RUNNER_TEMP/clean"
          mkdir -p "$clean"
          cd "$clean"
          : > .npmrc   # no token: exactly what a stranger gets
          echo '{"name":"verify","private":true}' > package.json
          deadline=$((SECONDS + 3600))
          until npm install --no-audit --no-fund --userconfig ./.npmrc "@wavehouse/chtypes@$version" >install.log 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat install.log
              echo "::error::@wavehouse/chtypes@$version did not become installable from the public registry within an hour"
              exit 1
            fi
            echo "not installable yet ($((deadline - SECONDS))s left); retrying in 30s"
            sleep 30
          done
          # The constant lives in the package's generated layer, which the public entry point does not re-export:
          # import it by file URL, which the package's `exports` map does not govern.
          got="$(node --input-type=module -e "
            import { pathToFileURL } from 'node:url';
            import path from 'node:path';
            const m = await import(pathToFileURL(path.resolve('node_modules/@wavehouse/chtypes/dist/abi1/decls.gen.js')).href);
            process.stdout.write(m.ABI_FINGERPRINT);
          ")"
          echo "published binding fingerprint: $got"
          echo "include/chtypes.h fingerprint: $want"
          [ "$got" = "$want" ] || { echo "::error::the published binding speaks $got, the header says $want"; exit 1; }
      - name: its CLI fetches one line from the production registry, and the public API loads it
        run: |
          set -euo pipefail
          clean="$RUNNER_TEMP/clean"
          cd "$clean"
          export CHTYPES_CACHE="$RUNNER_TEMP/artifact-cache"
          # The registry's own tag list names what is published; the newest two-part tag is a line.
          line="$(node_modules/.bin/chtypes list | awk '/^published/ {p=1; next} p && $1 ~ /^[0-9]+\.[0-9]+$/ {l=$1} END {print l}')"
          [ -n "$line" ] || { echo "::error::the production registry lists no line"; exit 1; }
          echo "fetching $line with the published CLI"
          dir="$(node_modules/.bin/chtypes fetch "$line")"
          [ -d "$dir" ] || { echo "::error::chtypes fetch printed $dir, which is not a directory"; exit 1; }
          node_modules/.bin/chtypes verify
          LINE="$line" node --input-type=module -e "
            import { Registry } from '@wavehouse/chtypes';
            const registry = await Registry.open();
            const lib = await registry.for(process.env.LINE);
            const type = lib.validateType('UInt8').toString();
            if (type !== 'UInt8') throw new Error('validateType(UInt8) answered ' + JSON.stringify(type));
            console.log('loaded ' + lib.version + ' (' + lib.buildInfo.abiFingerprint + ') from ' + lib.path);
          "
