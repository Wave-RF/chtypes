# release-ts — publish ts/ to npm on a `ts/v*` tag, with provenance.
# Auth: OIDC trusted publishing — no NPM_TOKEN anywhere. npm allows ONE trusted
# publisher (repo + workflow file) per package, configured on npmjs.com under the
# package's settings → Wave-RF/chtypes, release-ts.yml. That page exists only
# once the package does, so the FIRST publish is by hand from a logged-in
# laptop (RELEASING.md); every one after that is this workflow.
name: release-ts
on:
  push:
    tags: ["ts/v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 11 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - name: the tag and the package agree on the version
        run: |
          tag="${GITHUB_REF_NAME#ts/v}"; ver="$(node -p "require('./ts/package.json').version")"
          [ "$tag" = "$ver" ] || { echo "::error::tag ts/v$tag but package.json says $ver"; exit 1; }
      - run: cd ts && pnpm install --frozen-lockfile && pnpm build && pnpm typecheck
      - name: publish
        run: cd ts && pnpm publish --provenance --access public --no-git-checks
      # A green publish is not an installable package, and on npm the two can be
      # minutes apart. Measured on ts/v0.1.1 (issue #10): pnpm printed
      # "Published" at ~12:17Z, the packument did not list the version until
      # 12:21Z, and the TARBALL did not serve until ~12:24Z — about seven
      # minutes, and NOT atomic: for roughly two of those minutes the metadata
      # advertised a tarball that 404'd, so `latest` resolved to a version
      # nobody could install. `pnpm publish` sees a 2xx and reports success
      # through all of it.
      #
      # So poll the TARBALL, not the metadata: the tarball is what `npm install`
      # fetches and it is the half that lags. Anonymously, because a maintainer
      # token can see a version the public cannot. 15 minutes, because 5 would
      # have failed spuriously on the one real sample we have.
      - name: the registry actually serves an installable package
        run: |
          ver="${GITHUB_REF_NAME#ts/v}"
          tgz="https://registry.npmjs.org/@wavehouse/chtypes/-/chtypes-$ver.tgz"
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --no-netrc -H 'Authorization:' "$tgz" || true)"
            if [ "$code" = "200" ]; then
              echo "npm serves the @wavehouse/chtypes@$ver tarball after ~$((i*15))s"
              exit 0
            fi
            echo "  attempt $i: tarball HTTP $code"
            sleep 15
          done
          echo "::error::npm accepted the publish but has not served the @wavehouse/chtypes@$ver tarball in 15 minutes, so \`npm install\` fails. If \`latest\` already points at $ver, installs are BROKEN: repoint it with \`npm dist-tag add @wavehouse/chtypes@<last-good> latest\`. The version may also be staged awaiting 2FA approval — \`npm stage list @wavehouse/chtypes\` then \`npm stage approve <stage-id>\` (npm >= 11). See issue #10."
          exit 1
