# release-ts — publish ts/ to npm on a `ts/v*` tag, with provenance.
# Auth: OIDC trusted publishing — no NPM_TOKEN anywhere. npm allows ONE trusted
# publisher (repo + workflow file) per package, configured on npmjs.com under the
# package's settings → Wave-RF/chtypes, release-ts.yml. That page exists only
# once the package does, so the FIRST publish is by hand from a logged-in
# laptop (RELEASING.md); every one after that is this workflow.
#
# On this branch the tag selects one of two release modes, and nothing else
# does (scripts/release-channel.sh, THE MODES; #511, #597):
#   - dev, ts/v2.0.0-dev.N: published under npm's `dev` dist-tag, so a plain
#     `npm install @wavehouse/chtypes` keeps resolving `latest`, the 1.x;
#   - stable, ts/v2.N.N: published under `latest`, so a plain install resolves
#     it. Its publish needs the maintainer's CHTYPES_V2_LOCKED_FP to name this
#     package's fingerprint (THE GATE); without it, it can only dry-run.
# The `never-default` job asserts the mode's answer against npm itself after
# the publish, and its twin does in a dry run.
name: release-ts
on:
  push:
    tags: ["ts/v*"]
  # A dry run: every step up to the publish (tag-name and package version agree, install, build,
  # typecheck, `pnpm publish --dry-run`), and neither the publish nor the post-publish check.
  workflow_dispatch:
    inputs:
      tag:
        description: "the tag NAME to rehearse, e.g. ts/v1.0.0 (nothing is pushed or published)"
        required: true
        type: string
      dry_run:
        description: "rehearse only: skip the publish and the post-publish check"
        required: true
        type: boolean
        default: true
      verify_only:
        description: "Skip the publish job and run only the verify job against the ALREADY-PUBLISHED version the tag names (registry install first, with its retry loop). Wins over dry_run."
        required: false
        type: boolean
        default: false
permissions:
  contents: read
# Every run: step uses bash with -eo pipefail. GitHub's default for a step
# with no shell: is `bash -e {0}`, WITHOUT pipefail, so a failing command on
# the left of a pipe was hidden by the exit status of the one on the right.
defaults:
  run:
    shell: bash

jobs:
  # Every step a dry run needs, in a job with NO `environment:`: a dry run is
  # dispatched from any branch and must never enter the `npm` deployment
  # environment (npm's trusted publisher trusts that environment NAME, so only a
  # real publish, from a tag, may carry it). Same split as main's release-ts.yml.
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      default: ${{ steps.record.outputs.default }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before anything is installed or built: the channel's own selftest, then
      # the tag must be a release of this branch (it selects the mode), and a
      # stable release that is not a dry run must pass THE GATE: the repository
      # variable only the maintainer sets must name the fingerprint this
      # package is built against.
      - name: "the tag selects its mode and is a release of this branch, and a stable release passes the gate (scripts/release-channel.sh; #511, #597)"
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          CHTYPES_V2_LOCKED_FP: ${{ vars.CHTYPES_V2_LOCKED_FP }}
        run: |
          scripts/release-channel.sh --selftest
          echo "release mode: $(scripts/release-channel.sh mode ts "$TAG_NAME")"
          scripts/release-channel.sh tag ts "$TAG_NAME"
          scripts/release-channel.sh gate ts "$TAG_NAME" "$RELEASE_DRY_RUN"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager from
          # ts/package.json, so the pin lives in exactly one place (it was pinned to
          # 11 here while packageManager said 12, and the two had drifted).
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The engines floor in ts/package.json (>=22.21), not an older 22.
          node-version: "22.21"
          registry-url: "https://registry.npmjs.org"
      - name: the Node in use satisfies the package's engines floor
        run: node -e "const [a,b]=process.versions.node.split('.').map(Number); if (a<22||(a===22&&b<21)) { console.error('node '+process.versions.node+' is below the 22.21 floor'); process.exit(1) }"

      - name: the tag and the package agree on the version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          name="${TAG_NAME#ts/v}"; tag="$name"; ver="$(node -p "require('./ts/package.json').version")"
          [ "$tag" = "$ver" ] || { echo "::error::tag ts/v$tag but package.json says $ver"; exit 1; }
      - run: cd ts && pnpm install --frozen-lockfile && pnpm build && pnpm typecheck
      # The User-Agent assertion: pack the package, unpack the TARBALL (what
      # npm would serve) and read the constant from its dist, so it proves the
      # packed `package.json` and `dist` agree. It runs on the tag path too,
      # before anything is published.
      - name: the User-Agent version is the version being tagged
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="${TAG_NAME#ts/v}"
          pack="$RUNNER_TEMP/ua-pack"
          rm -rf "$pack"; mkdir -p "$pack"
          (cd ts && pnpm pack --pack-destination "$pack")
          tar -xzf "$pack"/*.tgz -C "$pack"
          got="$(node --input-type=module -e "
            import { pathToFileURL } from 'node:url';
            import path from 'node:path';
            const m = await import(pathToFileURL(path.resolve(process.argv[1], 'package/dist/ocifetch/http.js')).href);
            console.log(m.USER_AGENT);
          " "$pack")"
          echo "User-Agent: $got"
          [ "$got" = "chtypes-ts/$tag" ] || { echo "::error::the tarball's User-Agent is '$got', the tag says chtypes-ts/$tag"; exit 1; }
      - name: stage the packed tarball for the dry run's verify job
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          mkdir -p "$RUNNER_TEMP/ts-dist"
          cp "$RUNNER_TEMP"/ua-pack/*.tgz "$RUNNER_TEMP/ts-dist/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        with: { name: ts-dist, path: "${{ runner.temp }}/ts-dist/" }
      # The record the never-default job compares against: what npm installs by
      # default right now (dist-tags.latest). In the dev mode it must already be
      # a stable 1.x, or nothing is published over it; in the stable mode it
      # must not already be this version.
      - name: record what npm installs by default before the publish
        id: record
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          default="$(scripts/release-channel.sh default ts "$TAG_NAME")"
          echo "dist-tags.latest before the publish: $default"
          echo "default=$default" >> "$GITHUB_OUTPUT"
      - name: publish (dry run), under the mode's dist-tag
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          dist_tag="$(scripts/release-channel.sh get ts "$TAG_NAME" NPM_DIST_TAG)"
          echo "dist-tag: $dist_tag"
          cd ts && pnpm publish --dry-run --access public --no-git-checks --tag "$dist_tag"
  # The only job with `environment:`. It runs for a real publish alone: a tag
  # push, or a dispatch with dry_run=false (and not verify_only). It repeats the
  # toolchain setup and build because a job cannot share a workspace; every
  # check already passed in `build`.
  publish:
    needs: build
    if: github.event_name == 'push' || (inputs.dry_run == false && !inputs.verify_only)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21"
          registry-url: "https://registry.npmjs.org"
      - run: cd ts && pnpm install --frozen-lockfile && pnpm build
      - name: publish, under the mode's dist-tag (dev for a 2.0.0-dev.N, latest for a stable 2.N.N)
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          dist_tag="$(scripts/release-channel.sh get ts "$TAG_NAME" NPM_DIST_TAG)"
          echo "dist-tag: $dist_tag"
          cd ts && pnpm publish --provenance --access public --no-git-checks --tag "$dist_tag"
  # What npm installs by default, asserted against npm itself, never left to a
  # comment. Dev mode, "never installed by default": after a publish,
  # dist-tags.latest is still the 1.x the build job recorded, on every read,
  # and dist-tags.dev becomes this version. Stable mode, the opposite: the
  # version is published AND dist-tags.latest is it. Both poll for npm's lag,
  # up to an hour, as the verify job does. A dry run runs the same reads
  # against npm as it is now, the twin: latest is the recorded version, this
  # version is not published yet, and the same presence check finds the
  # recorded version (its positive control). scripts/release-channel.sh holds
  # both modes, and its selftest runs each against recorded npm answers.
  never-default:
    needs: [build, publish]
    if: ${{ !failure() && needs.build.result == 'success' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.dry_run)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: what npm installs by default (dev, still the recorded 1.x with dist-tags.dev on this version; stable, this version) (a dry run asserts it against npm as it is)
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RECORDED: ${{ needs.build.outputs.default }}
          PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'twin' || 'after' }}
        run: |
          version="$(scripts/release-channel.sh tag ts "$TAG_NAME")"
          scripts/release-channel.sh default-check ts "$TAG_NAME" "$version" "$RECORDED" "$PHASE"
  # A publish step exiting 0 does not mean anyone can install the package.
  # Measured on ts/v0.1.1 (issue #10): the job went green ~7 minutes before
  # npm served the tarball, and for ~2 of those minutes `latest` resolved to
  # a version that 404'd. This installs the real thing from the public
  # registry, with no credentials, in a clean directory, and then makes it
  # speak the mode's channel: its generation-2 fingerprint constant must equal
  # the one in include/v2/chtypes.h, its CLI must list, fetch and load from the
  # mode's registry (dev: staging chtypes/v2-dev; stable: production
  # chtypes/v2) and no other, and the loaded library must report abi 2 and
  # that fingerprint. The six checks are scripts/release-verify.sh's header.
  #
  # Its own job, so "Re-run failed jobs" on a timeout re-runs ONLY this:
  # `pnpm publish` cannot be retried, npm refuses to publish over a version
  # that already landed. Measured on ts/v0.4.0 (2026-09-30): the publish step
  # went green at 13:47:36Z, but npm did not serve the version for ~26
  # minutes with no human action anywhere in that window, so the registry-lag
  # loop below keeps its one-hour bound. No `environment` and no `id-token:
  # write` here: this job only reads public registries anonymously.
  # The steps are scripts/release-verify.sh, shared by every path: a tag push
  # verifies the registry's copy after the publish; a dry run (dry_run=true)
  # runs the same steps against the package this run built, the registry
  # retry loop skipped; verify_only=true skips the publish job and runs them
  # against the already-published version the `tag` input names. So the parser
  # of `chtypes list` and the whole sequence are exercised BEFORE a publish. A
  # stable dry run verifies against the stand-in, and before the lock it runs
  # the CLI under vitest, from ts/'s own lockfile (the script's header).
  verify:
    needs: [build, publish]
    if: ${{ !failure() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.verify_only)) && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && (github.event_name == 'push' || inputs.verify_only || inputs.dry_run || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.21" }
      - name: the verify's path (a stable dry run runs against the stand-in)
        id: path
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.verify_only && 'true' || 'false' }}
        run: |
          mode="$(scripts/release-channel.sh mode ts "$TAG_NAME")"
          path=registry
          if [ "$DRY" = true ]; then path=local; [ "$mode" != stable ] || path=standin; fi
          echo "release mode: $mode; verify: $path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.path.outputs.path == 'standin'
        with:
          package_json_file: ts/package.json
      - name: the stand-in's test runner, vitest, from ts/'s own lockfile
        if: steps.path.outputs.path == 'standin'
        run: cd ts && pnpm install --frozen-lockfile
      - name: the verify script's own selftest (the list parser and every channel check)
        run: scripts/release-verify.sh --selftest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.verify_only
        with: { name: ts-dist, path: "${{ runner.temp }}/ts-dist/" }
      - name: it installs, speaks include/v2/chtypes.h's fingerprint, and lists, fetches and loads from the mode's registry only (a stable dry run, from the stand-in)
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          MODE: ${{ steps.path.outputs.path }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.verify_only && 'true' || 'false' }}
        run: |
          version="${TAG_NAME#ts/v}"
          if [ "$MODE" = registry ]; then
            scripts/release-verify.sh ts registry "$version"
          else
            scripts/release-verify.sh ts "$MODE" "$version" "$(ls "$RUNNER_TEMP"/ts-dist/*.tgz)"
          fi
