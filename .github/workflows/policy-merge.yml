# policy-merge — a pull request enqueues itself to merge once every
# condition holds. Generalized by chtypes#280 from the old regen-automerge,
# which only handled a pull request that regenerated docs/support.md; every
# condition and the decision itself live in scripts/policy-merge-check.py
# (read its header); this file is the wiring. It does not open pull
# requests: support-matrix-refresh.yml's header says why nothing here may.
#
# THE SEVEN CONDITIONS. A pull request enqueues only when ALL of these hold:
#   1. the head is a branch of THIS repository, never a fork;
#   2. every required check on the head is completed and successful — read
#      BY NAME from the head's check runs, because the `ci` run's overall
#      conclusion is not a usable signal (its non-blocking `divergences`
#      job can be red by design);
#   3. the head has not moved since `ci` judged it;
#   4. GitHub reports no merge conflict, and no review conversation — no
#      requested changes, no review comment — exists;
#   5. no file the pull request touches (its current path, or for a rename
#      its old path too; a deletion counts) matches an unconditional glob in
#      scripts/policy-merge-check.py's PROTECTED_GLOBS — and for each
#      binding whose source tree it touches (chtypes#285 §1), that binding's
#      verdict in the `api-surface` job's log names the judged head and says
#      `changed=false`. A missing, unparseable or errored verdict, or an
#      api-surface job that did not complete with success, counts as
#      changed. The security carve-out (signature and checksum verification
#      code, the trust policy, the release key) stays protected whatever the
#      verdict says. A touch of tests/fixtures/fetch/** (chtypes#344) is
#      excused only when the head's tree there is byte-identical to the
#      served sdk-fetch-fixtures.tar.gz, fetched by main's own
#      scripts/fetch.sh and verified under the release key; any failure in
#      that chain leaves it protected;
#   6. ONLY when docs/support.md is part of the diff: it was MODIFIED, and
#      scripts/support-matrix.sh, run against the live served index over a
#      scratch copy SEEDED WITH THE HEAD'S OWN BYTES — never main's checked-
#      out copy (chtypes#316: main's hand-written prose used to collide with
#      every prose-only edit on the head) — reproduces the pull request
#      head's copy byte for byte;
#   7. ONLY when the pull request touches a test or fixture path
#      (chtypes#285 §1b): no suite's executed-test count, and no
#      golden-case count, fell below main's last green `ci` push run — read
#      from each job's own console log (a check run's own `output.summary`
#      is not populated for a GitHub-Actions-authored job; see
#      scripts/policy-merge-check.py's module docstring for how that was
#      verified), naming the suite and both numbers on a drop. A missing or
#      unparseable count on either side counts as a drop.
# Plus what an enqueue needs in order to succeed at all: one open, non-draft
# pull request against main; a head that has not moved since `ci` judged it;
# no known merge conflict. Anything else is left for a human with ONE
# job-summary line naming the condition that failed, and the run stays
# green: most `ci` runs are not candidates for a self-enqueue, and a refusal
# is not an error.
#
# DRAFT IS THE HOLD SWITCH. Marking a pull request draft stops this
# enqueueing it — condition (pull-request) above. To stop the mechanism
# outright for every pull request: `gh workflow disable policy-merge`.
#
# Condition 5 is also what makes condition 2 mean anything. A `pull_request`
# run of `ci` uses the pull request's own copy of ci.yml, so a pull request
# that edited it (or a script a required check runs) could make any
# required check pass trivially. This is "a pull request must not be able
# to weaken its own judge" (chtypes#280, the lead's scope addition), and
# scripts/policy-merge-check.py's `decide()` evaluates `protected` before
# `checks` for exactly this reason.
#
# ⚠️ ENQUEUE, NOT MERGE — AND WHY THAT IS WHAT CLOSES THE RACE. Eric approved
# GitHub's merge queue for this repository (to be enabled on main once this
# workflow is ready for it — a repository setting, not something this file
# or script touches). Once every condition above holds, the final step below
# calls the `enqueuePullRequest` GraphQL mutation instead of the REST
# `PUT .../merge` this file used before: it passes `expectedHeadOid` = the
# judged head sha, so GitHub itself refuses the enqueue if the head moved —
# the same role `sha=` played on the old merge call. What happens next is
# the queue's job, not this workflow's: GitHub tests the PULL REQUEST'S
# CHANGES MERGED WITH MAIN'S CURRENT TIP — not the possibly-older main the
# pull request's own `ci` run happened to test — and merges only once every
# required check passes on THAT combination. `ci.yml` triggers on
# `merge_group` (checks_requested) for exactly this: every required job also
# runs, and must conclude, on the queue's own candidate commit, or the queue
# waits forever. This is what makes "the tree that lands is the tree CI
# tested" true even for two pull requests enqueued moments apart — the queue
# serializes them, testing the second against the tip the first just
# produced — without this workflow re-reading main's tip itself and hoping
# nothing moves in between a read and an enqueue call of its own. See
# scripts/policy-merge-check.py's own module docstring (ENQUEUE, NOT MERGE)
# for the full reasoning, including why `main`'s branch protection
# (`required_status_checks.strict: false`, measured) could not have given
# this guarantee under a direct merge.
#
# A protected-class pull request is merged by hand through the same queue,
# with the same `enqueuePullRequest` mutation (CONTRIBUTING.md has the
# command). `gh pr merge` does not work here: with a queue required it falls
# back to enabling auto-merge, which this repository does not allow
# (measured). Draft status is still the hold switch either way.
#
# THIS WORKFLOW IGNORES `merge_group` RUNS OF `ci`. The job's `if:` below
# (`github.event.workflow_run.event == 'pull_request'`) already filtered out
# everything but a `pull_request`-triggered `ci` run before `ci.yml` ever
# gained a `merge_group` trigger, and that condition did not change: a
# `merge_group` run of `ci` is the QUEUE testing its own candidate
# combination, which this workflow has no business reacting to — the pull
# request it came from is already enqueued, and the queue (not this
# workflow) decides what happens with that run's result. Confirmed by
# reading the `if:` below, not just asserted here; chtypes#280 considered a
# dedicated selftest for this and chose a pinned comment instead; see
# scripts/policy-merge-check.py's module docstring for that call.
#
# ⚠️ THE PWN-REQUEST RULE — THE ONE THING THIS FILE MUST NEVER BREAK.
# `workflow_run` runs this file from the DEFAULT BRANCH after a `ci` run that
# anyone can start by opening a pull request from a fork, and its `enqueue`
# job holds an App installation token that can write to this repository. So nothing from a pull request's head may run
# here. Do not point the checkout at the head SHA or the head branch; do not
# check out, build, install, source or execute any file of the head; and pass
# every head-controlled string (a SHA, a repository name, a node id) into a
# `run:` block only through `env:`, as quoted data, never by expanding it into
# the script text. The checkout below is main, and main's scripts are the
# only code that runs. The head's docs/support.md — read only when it is part
# of the diff — is read as DATA, through the contents API at the head SHA,
# written to a scratch file as the regenerator's input text, and only
# compared byte for byte with what that regenerator — main's own script,
# never anything of the head — produces from it. Condition 7
# (chtypes#285 §1b) reads more of this shape, never a new kind of risk: up to
# five job LOGS per side, through the Actions API, matched against a fixed
# regex for two integers — never executed, sourced or parsed as code. The
# jobs read are provably main's own, because `protected` (evaluated before
# both `checks` and `test-counts`) already refuses a pull request that edited
# `.github/**` or `scripts/**`. Condition 5's binding-source half
# (chtypes#285 §1) reads one more log the same way, the `api-surface` job's,
# after that same refusal: one fixed-regex verdict line per binding, anchored
# to the start of a log line and naming the judged head's own sha. Its
# served-fixture half (chtypes#344) reads only the head's tree LISTING
# (paths, modes and blob ids through the git trees API, never a file's
# bytes) and runs main's own scripts/fetch.sh, with constant arguments, no
# CHTYPES_* variable and its own default source, on the served release.
# The `enqueue` job checks out one file of main and reads nothing of the head
# at all. One step that executed head code here would hand every fork a write
# token to this repository.
#
# WHAT IT RESPECTS, AND THE ONE CREDENTIAL IT HOLDS.
#   - "Allow GitHub Actions to create and approve pull requests" stays OFF;
#     support-matrix-refresh.yml's header explains why at length.
#   - Repository auto-merge (the per-pull-request toggle) stays off; it is a
#     different mechanism from the merge queue this enqueues into.
#   - Branch protection still decides, exactly as for a human (enforce_admins
#     is on): this can enqueue only what anyone with write access could, and
#     the queue merges only what its own required checks pass.
#   - The `automerge` job only reads (contents, pull-requests, checks and —
#     for the job-log reads of condition 7 and of condition 5's api-surface
#     verdicts, chtypes#285 — actions: read).
#     The enqueue is made by the merge-bot GitHub App from the
#     `enqueue` job, because an entry the built-in token enqueues gets no
#     merge_group run of `ci` and stalls (measured on #289, chtypes#291). The
#     App's id and key live in the `merge-bot` environment, which deploys
#     from main only, and nothing but that job reads them. The minted token
#     is limited to this repository with contents: write and pull-requests:
#     write, the two permissions the mutation was measured with; whether it
#     needs contents: write is unverified.
#
# TRIGGER. `workflow_run` on `ci` completing, for PULL_REQUEST runs of `ci`
# only (see THIS WORKFLOW IGNORES `merge_group` RUNS OF `ci`, above): a run
# on main has no pull request to judge, and a `merge_group` run is the
# queue's own business. `workflow_dispatch` re-checks one pull request by
# number; with dry_run it does everything except the enqueue call and says
# so in the job summary, which is how to watch it judge a real pull request
# without letting it enqueue. (A `workflow_run` workflow runs only from the
# default branch, so neither path exists before this file is on main.)
#
# EXIT. An enqueue, a dry run and a refusal are green. An API failure, or
# anything else unexpected, is red, so it can never pass for a quiet refusal.
name: policy-merge

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to re-check"
        required: true
        type: number
      dry_run:
        description: "Do everything except the enqueue call"
        required: false
        type: boolean
        default: false

# Nothing at the top level: the one job asks for exactly what it uses.
permissions: {}

# One judgment per head commit at a time, never canceled mid-enqueue: a
# second `ci` completion for the same commit (a re-run) waits, then finds the
# pull request already enqueued and refuses quietly.
concurrency:
  group: policy-merge-${{ github.event.workflow_run.head_sha || format('pr-{0}', inputs.pr) }}
  cancel-in-progress: false

# Every run: step uses bash with -eo pipefail. GitHub's default for a step
# with no shell: is `bash -e {0}`, WITHOUT pipefail, so a failing command on
# the left of a pipe was hidden by the exit status of the one on the right.
defaults:
  run:
    shell: bash

jobs:
  automerge:
    name: "policy-merge — a pull request enqueues itself to merge once every condition holds"
    # See THIS WORKFLOW IGNORES `merge_group` RUNS OF `ci`, above: a
    # workflow_run whose underlying `ci` run fired on `merge_group` reports
    # github.event.workflow_run.event == 'merge_group' here, which this
    # condition already excludes — unchanged by ci.yml gaining that trigger.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job only READS: it judges, and hands the judged head to the
    # `enqueue` job below. It holds no write permission and no App token.
    # `actions: read` (chtypes#285) is for two job-log reads: the
    # `test-counts` condition's (§1b) and condition 5's api-surface verdicts
    # (§1). GET .../actions/jobs/{id}/logs and GET .../actions/runs/{id}/jobs,
    # both read-only, both needed because a check run's own `output.summary`
    # is NOT populated for a GitHub-Actions-authored job (measured; see
    # scripts/policy-merge-check.py's module docstring) — the job's console
    # log is the only place a read-only token can read the chtypes-count
    # lines scripts/check-suite.sh and scripts/check-standalone.sh print, and
    # the chtypes-api-surface lines scripts/api-surface.py prints.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      enqueue: ${{ steps.judge.outputs.enqueue }}
      pr: ${{ steps.judge.outputs.pr }}
      node_id: ${{ steps.judge.outputs.node_id }}
      head_sha: ${{ steps.judge.outputs.head_sha }}
    steps:
      # MAIN, never the head: see the pwn-request rule above. fetch-depth: 0
      # for the reason support-matrix-refresh.yml gives: support-matrix.sh
      # reads include/chtypes.h at every binding's release tag. No
      # credentials are left in .git/config, because nothing here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # Selftest first, the house rule for every checker: a refusal nobody has
      # seen fire is not known to work. Then the pinned required-check list
      # must still name exactly ci.yml's blocking jobs, and the
      # CONTRIBUTING.md guide must still match PROTECTED_GLOBS, or an enqueue
      # could be judged against the wrong list, or a contributor could read a
      # stale guide; and the security carve-out must still cover main's own
      # verification code. None of them needs the network.
      - name: selftest, the pinned required checks, the CONTRIBUTING.md guide and the carve-out all still agree with the code
        run: |
          set -euo pipefail
          scripts/policy-merge-check.py --selftest
          scripts/policy-merge-check.py --check-ci-names
          scripts/policy-merge-check.py --check-mint-scope
          scripts/policy-merge-check.py --check-guide
          scripts/policy-merge-check.py --check-carve-out
      - name: gate — every condition except the docs/support.md byte comparison, from API reads alone
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            scripts/policy-merge-check.py gate --repo "$REPO" --pr "$PR"
          else
            scripts/policy-merge-check.py gate --repo "$REPO" \
              --run-head-sha "$RUN_HEAD_SHA" --run-head-repo "$RUN_HEAD_REPO"
          fi
      # The byte comparison (condition 6) regenerates unconditionally once the
      # gate passes, whether or not this pull request touches docs/support.md
      # — it is cheap, and `decide()`'s own bytes condition only USES it when
      # the diff actually touches that file. chtypes#316: the regeneration
      # seeds a scratch copy with the HEAD's OWN docs/support.md — read as
      # DATA through the contents API, never main's checked-out copy, whose
      # hand-written prose used to collide with every prose-only edit on the
      # head — and runs main's own scripts/support-matrix.sh over that SAME
      # scratch path, against the live served index. The script rewrites
      # only the generated block in place and leaves the head's own prose
      # untouched; this is all inside policy-merge-check.py's
      # regenerate_guarded_file now, so there is no separate workflow step
      # for it any more, and the checkout is left untouched either way.
      - name: the docs/support.md byte comparison (against the head's own regeneration) and every other condition again, then the hand-off
        id: judge
        if: steps.gate.outputs.candidate == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.gate.outputs.pr }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(enqueue --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA")
          if [ -n "$RUN_HEAD_REPO" ]; then
            args+=(--run-head-repo "$RUN_HEAD_REPO")
          fi
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          scripts/policy-merge-check.py "${args[@]}"

  # BUILT-IN TOKEN EVENTS START NO WORKFLOW. An entry the built-in token
  # enqueues gets no merge_group run of `ci` and stalls in the queue (measured
  # on #289, chtypes#291). So the enqueue is made by the merge-bot GitHub App,
  # whose events do start workflows. Its id and private key live only in the
  # `merge-bot` environment, which deploys from main alone. This job is the
  # only place they are read. It judges nothing: it checks out one file of
  # MAIN (never the head), mints an installation token scoped to this
  # repository, and makes the one enqueuePullRequest call, pinned to the head
  # the `automerge` job judged. A dry run hands nothing on, so this job skips.
  enqueue:
    name: "enqueue — the merge-bot App adds the judged pull request to the merge queue"
    needs: automerge
    if: needs.automerge.outputs.enqueue == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: merge-bot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/policy-merge-check.py
          sparse-checkout-cone-mode: false
      # Both values are secrets of the merge-bot environment. The token is
      # limited to this repository and to exactly the two permissions the
      # mutation was measured with; the App carries more (Workflows, for the
      # artifact producer), and `--check-mint-scope` fails if this step ever
      # asks for anything beyond MINT_PERMISSIONS.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ secrets.CHTYPES_BOT_APP_ID }}
          private-key: ${{ secrets.CHTYPES_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: enqueuePullRequest as the merge-bot App, pinned to the judged head
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ needs.automerge.outputs.pr }}
          NODE_ID: ${{ needs.automerge.outputs.node_id }}
          HEAD_SHA: ${{ needs.automerge.outputs.head_sha }}
        run: |
          set -euo pipefail
          scripts/policy-merge-check.py enqueue-as-bot --pr "$PR" --node-id "$NODE_ID" --head-sha "$HEAD_SHA"
