# policy-merge — a pull request merges itself once every condition holds.
# Generalized by chtypes#280 from the old regen-automerge, which only
# handled a pull request that regenerated docs/support.md; every condition
# and the decision itself live in scripts/policy-merge-check.py (read its
# header); this file is the wiring. It does not open pull requests:
# support-matrix-refresh.yml's header says why nothing here may.
#
# THE SIX CONDITIONS. A pull request merges only when ALL of these hold:
#   1. the head is a branch of THIS repository, never a fork;
#   2. every required check on the head is completed and successful — read
#      BY NAME from the head's check runs, because the `ci` run's overall
#      conclusion is not a usable signal (its non-blocking `divergences`
#      job can be red by design);
#   3. the head has not moved since `ci` judged it;
#   4. GitHub reports no merge conflict, and no review conversation — no
#      requested changes, no review comment — exists;
#   5. no file the pull request touches (its current path, or for a rename
#      its old path too; a deletion counts) matches a glob in
#      scripts/policy-merge-check.py's PROTECTED_GLOBS;
#   6. ONLY when docs/support.md is part of the diff: it was MODIFIED, and
#      scripts/support-matrix.sh, from main's own checkout and against the
#      live served index, produces a docs/support.md byte-identical to the
#      pull request head's copy.
# Plus what a merge needs in order to succeed at all: one open, non-draft
# pull request against main; a head that has not moved since `ci` judged it;
# no known merge conflict. Anything else is left for a human with ONE
# job-summary line naming the condition that failed, and the run stays
# green: most `ci` runs are not candidates for a self-merge, and a refusal
# is not an error.
#
# DRAFT IS THE HOLD SWITCH. Marking a pull request draft stops this merging
# it — condition (pull-request) above. To stop the mechanism outright for
# every pull request: `gh workflow disable policy-merge`.
#
# Condition 5 is also what makes condition 2 mean anything. A `pull_request`
# run of `ci` uses the pull request's own copy of ci.yml, so a pull request
# that edited it (or a script a required check runs) could make any
# required check pass trivially. This is "a pull request must not be able
# to weaken its own judge" (chtypes#280, the lead's scope addition), and
# scripts/policy-merge-check.py's `decide()` evaluates `protected` before
# `checks` for exactly this reason.
#
# ⚠️ THE PWN-REQUEST RULE — THE ONE THING THIS FILE MUST NEVER BREAK.
# `workflow_run` runs this file from the DEFAULT BRANCH with a token that can
# write to this repository (the job grants contents: write and
# pull-requests: write), after a `ci` run that anyone can start by opening a
# pull request from a fork. So nothing from a pull request's head may run
# here. Do not point the checkout at the head SHA or the head branch; do not
# check out, build, install, source or execute any file of the head; and pass
# every head-controlled string (a SHA, a repository name) into a `run:` block
# only through `env:`, as quoted data, never by expanding it into the script
# text. The checkout below is main, and main's scripts are the only code that
# runs. The head's docs/support.md — read only when it is part of the diff —
# is read as DATA, through the contents API at the head SHA, and only
# compared byte for byte with main's regeneration.
# One step that executed head code here would hand every fork a write token
# to this repository.
#
# WHAT IT RESPECTS, AND WHY IT NEEDS NO NEW GRANT.
#   - "Allow GitHub Actions to create and approve pull requests" stays OFF;
#     support-matrix-refresh.yml's header explains why at length. That
#     toggle governs creating and approving pull requests. Merging one with
#     the built-in token is governed by the job's `permissions:` alone, so
#     this needs no change to the toggle, no secret and no personal token.
#   - Repository auto-merge stays off. The job merges through the REST API
#     itself (PUT .../pulls/{n}/merge with merge_method=merge, the merge
#     commit this repository's humans make) and passes sha=<the judged head>,
#     so GitHub refuses the merge if the head moved.
#   - Branch protection still decides, exactly as for a human (enforce_admins
#     is on): this job can merge only what anyone with write access could.
#   - GitHub starts no workflow run for an event made with the built-in token
#     (documented behavior), so the merge commit this job makes gets no
#     `push` run of `ci` on main. The pull request's own run covered the
#     head; the next push to main runs `ci` as usual.
#
# TRIGGER. `workflow_run` on `ci` completing, for pull_request runs only: a
# run on main has no pull request to judge. `workflow_dispatch` re-checks one
# pull request by number; with dry_run it does everything except the merge
# call and says so in the job summary, which is how to watch it judge a real
# pull request without letting it merge. (A `workflow_run` workflow runs only
# from the default branch, so neither path exists before this file is on
# main.)
#
# EXIT. A merge, a dry run and a refusal are green. An API failure, or
# anything else unexpected, is red, so it can never pass for a quiet refusal;
# so is a merge after which a touched docs/support.md is not the regeneration.
name: policy-merge

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to re-check"
        required: true
        type: number
      dry_run:
        description: "Do everything except the merge call"
        required: false
        type: boolean
        default: false

# Nothing at the top level: the one job asks for exactly what it uses.
permissions: {}

# One judgment per head commit at a time, never canceled mid-merge: a second
# `ci` completion for the same commit (a re-run) waits, then finds the pull
# request already merged and refuses quietly.
concurrency:
  group: policy-merge-${{ github.event.workflow_run.head_sha || format('pr-{0}', inputs.pr) }}
  cancel-in-progress: false

# Every run: step uses bash with -eo pipefail. GitHub's default for a step
# with no shell: is `bash -e {0}`, WITHOUT pipefail, so a failing command on
# the left of a pipe was hidden by the exit status of the one on the right.
defaults:
  run:
    shell: bash

jobs:
  automerge:
    name: "policy-merge — a pull request merges itself once every condition holds"
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write and pull-requests: write are what the merge call needs;
    # checks: read is the head's check runs. Nothing else is granted.
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      # MAIN, never the head: see the pwn-request rule above. fetch-depth: 0
      # for the reason support-matrix-refresh.yml gives: support-matrix.sh
      # reads include/chtypes.h at every binding's release tag. No
      # credentials are left in .git/config, because nothing here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # Selftest first, the house rule for every checker: a refusal nobody has
      # seen fire is not known to work. Then the pinned required-check list
      # must still name exactly ci.yml's blocking jobs, and the
      # CONTRIBUTING.md guide must still match PROTECTED_GLOBS, or a merge
      # could be judged against the wrong list, or a contributor could read a
      # stale guide. None of the three needs the network.
      - name: selftest, the pinned required checks, and the CONTRIBUTING.md guide all still agree with the code
        run: |
          set -euo pipefail
          scripts/policy-merge-check.py --selftest
          scripts/policy-merge-check.py --check-ci-names
          scripts/policy-merge-check.py --check-guide
      - name: gate — every condition except the docs/support.md byte comparison, from API reads alone
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            scripts/policy-merge-check.py gate --repo "$REPO" --pr "$PR"
          else
            scripts/policy-merge-check.py gate --repo "$REPO" \
              --run-head-sha "$RUN_HEAD_SHA" --run-head-repo "$RUN_HEAD_REPO"
          fi
      # Regenerated unconditionally once the gate passes, whether or not this
      # pull request happens to touch docs/support.md — it is cheap, and
      # `merge` (below) only USES it when the diff actually touches that
      # file. The regeneration is main's script over main's docs/support.md
      # (whose hand-written text the generated block sits inside), against
      # the default served index, the same one `docs` and
      # support-matrix-refresh read. It writes to a scratch copy; the
      # checkout is left untouched.
      - name: regenerate docs/support.md with main's own script, against the live index
        if: steps.gate.outputs.candidate == '1'
        run: |
          set -euo pipefail
          cp docs/support.md "$RUNNER_TEMP/support.md"
          scripts/support-matrix.sh --out "$RUNNER_TEMP/support.md"
      - name: the docs/support.md byte comparison and every other condition again, then the merge
        if: steps.gate.outputs.candidate == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.gate.outputs.pr }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(merge --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA"
                --regenerated "docs/support.md=$RUNNER_TEMP/support.md")
          if [ -n "$RUN_HEAD_REPO" ]; then
            args+=(--run-head-repo "$RUN_HEAD_REPO")
          fi
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          scripts/policy-merge-check.py "${args[@]}"
