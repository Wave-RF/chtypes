# PROBE (do not merge): a stress run of v1-cache-interop's concurrent-install
# case, to measure a failure rate per binding at the released 1.0.4 and at
# the 1.1.0 release commit, small and large layers, plus a positive control.
name: probe-install-race

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-install-race-${{ github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  stress:
    name: "stress ${{ matrix.runner }} ${{ matrix.name }} ${{ matrix.layer }} ${{ matrix.mode }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, name: "fix", commit: e661922bff9e7cf85332a236455f1e1a173fa30a, layer: small, mode: coarse-shim, rounds: "rust=150", build: rust }
          - { runner: ubuntu-latest, name: "fix", commit: e661922bff9e7cf85332a236455f1e1a173fa30a, layer: large, mode: coarse-shim, rounds: "rust=60", build: rust }
          - { runner: ubuntu-latest, name: "1.1.0", commit: d15083fa6aa7d0ff59b69cc2c216494506e52289, layer: small, mode: coarse-shim, rounds: "rust=150", build: rust }
          - { runner: macos-latest, name: "1.1.0", commit: d15083fa6aa7d0ff59b69cc2c216494506e52289, layer: small, mode: natural, rounds: "rust=150,go=25,python=25,ts=25", build: all }
          - { runner: macos-latest, name: "fix", commit: e661922bff9e7cf85332a236455f1e1a173fa30a, layer: small, mode: natural, rounds: "rust=150,go=25,python=25,ts=25", build: all }
          - { runner: macos-latest, name: "1.1.0", commit: d15083fa6aa7d0ff59b69cc2c216494506e52289, layer: small, mode: coarse-shim, rounds: "rust=100", build: rust }
          - { runner: macos-latest, name: "fix", commit: e661922bff9e7cf85332a236455f1e1a173fa30a, layer: small, mode: coarse-shim, rounds: "rust=100", build: rust }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          path: target
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: target/go/go.mod
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: matrix.build == 'all'
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.build == 'all'
        with:
          package_json_file: target/ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.build == 'all'
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: target/ts/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - name: build the CLIs from the target commit (unmodified)
        env:
          BUILD: ${{ matrix.build }}
        run: |
          X="$RUNNER_TEMP/cli"
          mkdir -p "$X/bin"
          if [ "$BUILD" = all ]; then
            (cd target/go && go build -o "$X/bin/cli-go" ./cmd/chtypes)
            uv venv --python 3.13 "$X/py"
            (cd target/python && UV_PROJECT_ENVIRONMENT="$X/py" uv sync --locked --no-dev --no-editable --link-mode copy)
            printf '#!/usr/bin/env bash\nexec "%s/py/bin/python" -m chtypes "$@"\n' "$X" > "$X/bin/cli-python"
            (cd target/ts && pnpm install --frozen-lockfile && pnpm build)
            printf '#!/usr/bin/env bash\nexec "%s" "%s/target/ts/dist/cli.js" "$@"\n' "$(command -v node)" "$PWD" > "$X/bin/cli-ts"
          fi
          (cd target/rust && cargo build --locked --bin chtypes)
          cp target/rust/target/debug/chtypes "$X/bin/cli-rust"
          chmod +x "$X"/bin/cli-*
          for c in "$X"/bin/cli-*; do "$c" --version; done
          (cd target && git log -1 --format='target %H %s')
      - name: the clock the names are made from
        run: |
          if [ -r /sys/devices/system/clocksource/clocksource0/current_clocksource ]; then
            echo "clocksource: $(cat /sys/devices/system/clocksource/clocksource0/current_clocksource)"
          fi
          echo "cpus: $(getconf _NPROCESSORS_ONLN)"
          python3 - <<'EOF'
          import time
          vals = [time.time_ns() for _ in range(300000)]
          deltas = sorted({b - a for a, b in zip(vals, vals[1:]) if b != a})
          print("CLOCK_REALTIME smallest nonzero steps (ns):", deltas[:8])
          print("distinct readings:", len(set(vals)), "of", len(vals), "consecutive reads")
          print("readings that are whole microseconds:", sum(v % 1000 == 0 for v in vals), "of", len(vals))
          EOF
      - name: "the coarse-clock shim (100 us), and proof it takes effect"
        if: matrix.mode == 'coarse-shim'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            clang -dynamiclib -O2 -Wall -o "$RUNNER_TEMP/coarse-clock.so" scripts/fetch-v1/probe/coarse-clock.c
            var=DYLD_INSERT_LIBRARIES
          else
            gcc -shared -fPIC -O2 -Wall -o "$RUNNER_TEMP/coarse-clock.so" scripts/fetch-v1/probe/coarse-clock.c -ldl
            var=LD_PRELOAD
          fi
          cc -O2 -Wall -o "$RUNNER_TEMP/clockcheck" scripts/fetch-v1/probe/clockcheck.c
          if "$RUNNER_TEMP/clockcheck"; then echo "the plain clock already reads coarse: the control cannot discriminate" >&2; exit 1; fi
          env "$var=$RUNNER_TEMP/coarse-clock.so" PROBE_COARSE_NS=100000 "$RUNNER_TEMP/clockcheck"
          echo "SHIM_VAR=$var" >> "$GITHUB_ENV"
      - name: a large library (32 MiB) for the large-layer leg
        if: matrix.layer == 'large'
        run: |
          cd scripts/fetch-v1/genfixtures
          PROBE_LARGE_LIBRARY_MIB=32 PROBE_LARGE_LIBRARY_SEED=linux-arm64-26.8.15.10-20261001.183455 go run . --write
      - name: stress
        env:
          MODE: ${{ matrix.mode }}
          BUILD: ${{ matrix.build }}
          ROUNDS: ${{ matrix.rounds }}
          LABEL: "${{ matrix.runner }} ${{ matrix.name }} (${{ matrix.commit }}) ${{ matrix.layer }} layer, ${{ matrix.mode }}"
          OUT: "out/stress-${{ matrix.runner }}-${{ matrix.name }}-${{ matrix.layer }}-${{ matrix.mode }}.json"
        run: |
          X="$RUNNER_TEMP/cli"
          mkdir -p out
          case "$MODE" in
            natural) rust="$X/bin/cli-rust" ;;
            coarse-shim) rust="env $SHIM_VAR=$RUNNER_TEMP/coarse-clock.so PROBE_COARSE_NS=100000 $X/bin/cli-rust" ;;
            *) echo "unknown mode $MODE" >&2; exit 2 ;;
          esac
          args=(--cli "rust=$rust")
          if [ "$BUILD" = all ]; then
            args+=(--cli "go=$X/bin/cli-go" --cli "python=$X/bin/cli-python" --cli "ts=$X/bin/cli-ts")
          fi
          python3 scripts/fetch-v1/probe-install-race.py "${args[@]}" --rounds "$ROUNDS" --label "$LABEL" --json "$OUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-${{ matrix.runner }}-${{ matrix.name }}-${{ matrix.layer }}-${{ matrix.mode }}
          path: out/
