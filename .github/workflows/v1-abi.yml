name: v1-abi

# ABI v1's generated FFI layer, on pull requests into main and v2 and in the merge queue (docs/reference/abi-v1.md).
# On v2 its v1-abi-gen job also checks ABI v2 (UNSTABLE), the same way (docs/reference/abi-v2.md).
#
# spec/abi-v1/abi.json describes the whole ABI and scripts/abi-v1/gen.py
# generates every file that states it: the C header, the export list, the
# reference block, and (as their lanes land) each binding's declaration layer,
# the test stub and the conformance cases. This workflow proves those agree,
# then that every binding passes the same ABI cases against the stub.
#
# The job names below are check contexts, some of them required on v1, so
# they are spelled exactly and never renamed casually:
#   v1-abi-gen       required: the description, the header and every generated file agree
#   v1-abi-parity    required (the merge gate): every enrolled binding passes every ABI case
#   v1-abi-linked    required once the Go lane lands
#   v1-abi-rust      required once the Rust lane lands
#   v1-abi-stubs and v1-abi-conformance feed parity and are not required themselves.
#
# v1-abi-conformance, v1-abi-linked and v1-abi-rust each DISPATCH to a
# per-binding script rather than embedding that binding's own logic here:
# scripts/abi-v1/conformance/<binding>.sh for conformance, and one script
# each under scripts/abi-v1 named for its own job (check-linked.sh,
# check-rust.sh) for the other two. Toolchain setup for every
# binding already lives in this file (v1-abi-conformance's steps are each
# gated `if: matrix.binding == '<b>'`), so a binding lane adding its v1 FFI
# directory (go/internal/abi1 and so on) and its one script is a COMPLETE
# change that never touches this workflow — the four lanes landing in
# parallel no longer race to edit the same `case` block. Until a lane adds
# its script, the dispatch fails loudly naming exactly which file is
# missing, the same "a checker nobody has seen fail is not a checker"
# discipline as everywhere else in this repository.
#
# MAJORS (public issue #511). spec/binding-majors.json says which ABI major
# each binding speaks at this commit (scripts/abi-v1/majors.py; absent on
# main, where every binding speaks ABI v1). The context names stay v1's until
# the lock, so every binding job DERIVES its major from that file, prints
# "ABI major tested: N (spec/binding-majors.json@<commit>)" to its log and its
# step summary, and asserts the major against what it actually loads: the stub
# library it hands the binding (dlopen'd and asked), or the identity compiled
# into the binding's generated layer, never the file's own value. The stubs
# are built for every major a binding speaks (build-stubs.sh: abi-stubs/v<N>/),
# and each conformance leg loads its binding's major's.
#
# Hosted runners, no secrets. Network is used only to install pinned tools.

on:
  # `v2` is the ABI v2 development branch (public issue #511): pull requests
  # into it run the same jobs as pull requests into main.
  pull_request:
    branches: [main, v2]
  # The merge queue's candidate combination must run every required context
  # here too, or the queue waits forever: v1 and v1-abi's contexts are required
  # on main once v1 merges (nothing below reads the event's base or head).
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-abi-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  v1-abi-gen:
    name: "v1-abi-gen — the description, the header and every generated file agree"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # Python 3.11 is the generator's floor, and it uses the standard library
      # only: running on 3.11 with no project and no dependencies proves both.
      - name: selftest — every refusal fires on planted copies of the tree, and --write is deterministic
        run: uv run --no-project --python 3.11 scripts/abi-v1/gen.py --selftest
      - name: selftest — the stub census refuses a stub-skip with the stubs set, a missing required test, a zero-run and a skipped-whole-file
        run: python3 scripts/abi-v1/stub_census.py --selftest
      # The major map (spec/binding-majors.json) and its assertion: a map
      # missing a binding is refused, and a binding whose loaded library (a
      # real dlopen of a compiled plant), printed identity or compiled layer
      # answers another major than the map gives it is refused (a job on v2
      # testing v1 after its binding converted), with positive controls.
      - name: "selftest — the major map refuses a missing binding, and a library or layer of another major than the map's, with a positive control"
        run: python3 scripts/abi-v1/majors.py --selftest
      - name: "every binding's compiled-in ABI identity is the major spec/binding-majors.json gives it"
        run: |
          for b in go python ts rust; do
            python3 scripts/abi-v1/majors.py announce "$b" --what "its generated layer"
            python3 scripts/abi-v1/majors.py assert-layer "$b"
          done
      - name: every generated file matches spec/abi-v1/ (gen.py --check)
        run: uv run --no-project --python 3.11 scripts/abi-v1/gen.py --check
      # The fingerprint is computed in exactly one place, scripts/abi-v1/jcs.py.
      # Recompute it with an independent RFC 8785 implementation and require
      # the same bytes, for the description, for every other JSON input, and
      # for the self-test's own vectors: a derivation checked against itself
      # proves nothing.
      - name: the fingerprint and the canonical forms, recomputed by an independent RFC 8785 implementation
        run: |
          ours="$(uv run --no-project --python 3.11 scripts/abi-v1/gen.py --fingerprint)"
          uv run --no-project --python 3.12 --with 'rfc8785==0.1.4' python - "$ours" <<'PY'
          import hashlib, json, subprocess, sys
          import rfc8785
          sys.path.insert(0, "scripts/abi-v1")
          import gen, jcs
          ours = sys.argv[1]
          bad = 0
          with open("spec/abi-v1/abi.json", "rb") as f:
              theirs = "sha256:" + hashlib.sha256(rfc8785.dumps(json.load(f))).hexdigest()
          print(f"jcs.py: {ours}\nrfc8785: {theirs}")
          if ours != theirs:
              print("::error::CHS_ABI_FINGERPRINT differs between scripts/abi-v1/jcs.py and rfc8785")
              bad += 1
          for path in ("spec/abi-v1/abi.json", "spec/abi-v1/sdk.json", "spec/abi-v1/v0-symbols.json",
                       "spec/abi-v1/schema/abi.schema.json", "spec/abi-v1/schema/sdk.schema.json"):
              with open(path, "rb") as f:
                  data = f.read()
              if jcs.canonicalize(jcs.loads(data)) != rfc8785.dumps(json.loads(data)):
                  print(f"::error file={path}::canonical form differs between jcs.py and rfc8785")
                  bad += 1
          for text, want in gen.JCS_VECTORS:
              got = rfc8785.dumps(json.loads(text)).decode()
              if got != want:
                  print(f"::error::self-test vector {text!r}: rfc8785 gives {got!r}, gen.py expects {want!r}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY
          {
            echo "### ABI v1"
            echo
            echo "\`CHS_ABI_FINGERPRINT\` = \`$ours\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # The schemas, checked by a second validator: the description and the
      # policy file validate, both schemas are valid 2020-12 schemas, and a
      # planted violation is refused by the schema itself, not only by
      # scripts/abi-v1/model.py's validator.
      - name: the description validates under an independent JSON Schema validator, which also refuses a planted violation
        run: |
          cj=(uvx --from 'check-jsonschema==0.33.3' check-jsonschema)
          "${cj[@]}" --check-metaschema spec/abi-v1/schema/abi.schema.json spec/abi-v1/schema/sdk.schema.json
          "${cj[@]}" --schemafile spec/abi-v1/schema/abi.schema.json spec/abi-v1/abi.json
          "${cj[@]}" --schemafile spec/abi-v1/schema/sdk.schema.json spec/abi-v1/sdk.json
          python3 -c 'import json,sys; d=json.load(open("spec/abi-v1/abi.json")); d["surprise"]=1; json.dump(d, open(sys.argv[1], "w"))' "$RUNNER_TEMP/planted.json"
          if "${cj[@]}" --schemafile spec/abi-v1/schema/abi.schema.json "$RUNNER_TEMP/planted.json"; then
            echo "::error::the schema accepted a description with an unknown top-level key"
            exit 1
          fi
      - name: selftest — a hand-written chs_ declaration is caught in all four bindings, and generated files are exempt
        run: uv run --no-project --python 3.11 scripts/abi-v1/check-no-hand-decls.py --selftest
      - name: no hand-written chs_ declaration or lookup anywhere in the tree
        run: uv run --no-project --python 3.11 scripts/abi-v1/check-no-hand-decls.py --scope all
      - name: the header compiles as C11 and as C++20 (gcc and clang)
        run: |
          for c in gcc clang; do
            "$c" -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only -x c include/chtypes.h
          done
          for cxx in g++ clang++; do
            "$cxx" -std=c++20 -Wall -Wextra -Werror -pedantic -fsyntax-only -x c++ include/chtypes.h
          done
          echo "include/chtypes.h: C11 and C++20, gcc and clang, -Wall -Wextra -Werror -pedantic"
      # ABI v2 (UNSTABLE, docs/reference/abi-v2.md): the same generator, run
      # with --major 2, checks spec/abi-v2/ and its own outputs. ABI v1's steps
      # above never read them, and these never read ABI v1's outputs.
      - name: every ABI v2 generated file matches spec/abi-v2/ (gen.py --major 2 --check)
        run: uv run --no-project --python 3.11 scripts/abi-v1/gen.py --major 2 --check
      # The WHERE-affecting settings lists (spec/abi-v2/where-settings/) are
      # data copied from the artifact producer, outside abi.json: this keeps a
      # bad copy from landing. Selftest first, so the check is proven to fire.
      - name: the WHERE-affecting settings lists — every rule fires on planted copies
        run: uv run --no-project --python 3.11 scripts/abi-v2/check-where-settings.py --selftest
      - name: the WHERE-affecting settings lists agree with their README and with each other
        run: uv run --no-project --python 3.11 scripts/abi-v2/check-where-settings.py --check
      # The filter decline-reasons catalog (spec/abi-v2/declines/) is data
      # copied from the artifact producer, outside abi.json. Same shape.
      - name: the filter decline-reasons catalog — every rule fires on planted copies
        run: uv run --no-project --python 3.11 scripts/abi-v2/check-declines.py --selftest
      - name: the filter decline-reasons catalog agrees with its README
        run: uv run --no-project --python 3.11 scripts/abi-v2/check-declines.py --check
      - name: ABI v2's fingerprint and canonical forms, recomputed by an independent RFC 8785 implementation
        run: |
          ours="$(uv run --no-project --python 3.11 scripts/abi-v1/gen.py --major 2 --fingerprint)"
          uv run --no-project --python 3.12 --with 'rfc8785==0.1.4' python - "$ours" <<'PY'
          import hashlib, json, sys
          import rfc8785
          sys.path.insert(0, "scripts/abi-v1")
          import jcs
          ours = sys.argv[1]
          bad = 0
          with open("spec/abi-v2/abi.json", "rb") as f:
              theirs = "sha256:" + hashlib.sha256(rfc8785.dumps(json.load(f))).hexdigest()
          print(f"jcs.py: {ours}\nrfc8785: {theirs}")
          if ours != theirs:
              print("::error::ABI v2's CHS_ABI_FINGERPRINT differs between scripts/abi-v1/jcs.py and rfc8785")
              bad += 1
          for path in ("spec/abi-v2/abi.json", "spec/abi-v2/sdk.json", "spec/abi-v2/v0-symbols.json",
                       "spec/abi-v2/schema/abi.schema.json", "spec/abi-v2/schema/sdk.schema.json"):
              with open(path, "rb") as f:
                  data = f.read()
              if jcs.canonicalize(jcs.loads(data)) != rfc8785.dumps(json.loads(data)):
                  print(f"::error file={path}::canonical form differs between jcs.py and rfc8785")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY
          {
            echo "### ABI v2 (UNSTABLE)"
            echo
            echo "\`CHS_ABI_FINGERPRINT\` = \`$ours\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: ABI v2's description validates under an independent JSON Schema validator, which also refuses a description without its stability
        run: |
          cj=(uvx --from 'check-jsonschema==0.33.3' check-jsonschema)
          "${cj[@]}" --check-metaschema spec/abi-v2/schema/abi.schema.json spec/abi-v2/schema/sdk.schema.json
          "${cj[@]}" --schemafile spec/abi-v2/schema/abi.schema.json spec/abi-v2/abi.json
          "${cj[@]}" --schemafile spec/abi-v2/schema/sdk.schema.json spec/abi-v2/sdk.json
          python3 -c 'import json,sys; d=json.load(open("spec/abi-v2/abi.json")); d.pop("stability"); json.dump(d, open(sys.argv[1], "w"))' "$RUNNER_TEMP/planted-v2.json"
          if "${cj[@]}" --schemafile spec/abi-v2/schema/abi.schema.json "$RUNNER_TEMP/planted-v2.json"; then
            echo "::error::the v2 schema accepted a description without its stability"
            exit 1
          fi
      - name: the ABI v2 header compiles as C11 and as C++20 (gcc and clang), and refuses to follow ABI v1's header
        run: |
          for c in gcc clang; do
            "$c" -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only -x c include/v2/chtypes.h
          done
          for cxx in g++ clang++; do
            "$cxx" -std=c++20 -Wall -Wextra -Werror -pedantic -fsyntax-only -x c++ include/v2/chtypes.h
          done
          printf '#include "include/chtypes.h"\n#include "include/v2/chtypes.h"\n' > "$RUNNER_TEMP/mixed.c"
          if gcc -std=c11 -fsyntax-only -I. "$RUNNER_TEMP/mixed.c" 2> "$RUNNER_TEMP/mixed.err"; then
            echo "::error::a translation unit including both ABI headers compiled"
            exit 1
          fi
          command grep -F 'declare the same chs_* names' "$RUNNER_TEMP/mixed.err"
          echo "include/v2/chtypes.h: C11 and C++20, gcc and clang, -Wall -Wextra -Werror -pedantic; refuses to follow include/chtypes.h"

  v1-abi-stubs:
    name: "v1-abi-stubs (${{ matrix.platform }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "selftest — stubs.json paths are relative and resolve after a relocation, and each major's ok stub answers that major"
        run: scripts/abi-v1/build-stubs.sh --selftest
      # Every major some binding speaks (spec/binding-majors.json), each into
      # abi-stubs/v<N>/: both majors while the bindings convert.
      - name: build the stub libraries of every major a binding speaks, and run the stub's handle-rule self-test
        run: scripts/abi-v1/build-stubs.sh --out "$RUNNER_TEMP/abi-stubs"
      - name: upload the stub libraries and manifests for v1-abi-conformance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1-abi-stubs-${{ matrix.platform }}
          path: ${{ runner.temp }}/abi-stubs
          retention-days: 7

  v1-abi-conformance:
    name: "v1-abi-conformance (${{ matrix.binding }} ${{ matrix.toolchain }} ${{ matrix.os }})"
    needs: v1-abi-stubs
    strategy:
      fail-fast: false
      matrix:
        include:
          - {binding: go, toolchain: go.mod, os: linux-amd64, runner: ubuntu-latest}
          - {binding: python, toolchain: "3.11", os: linux-amd64, runner: ubuntu-latest}
          - {binding: python, toolchain: "3.13", os: linux-amd64, runner: ubuntu-latest}
          - {binding: python, toolchain: "3.14", os: linux-amd64, runner: ubuntu-latest}
          - {binding: ts, toolchain: node-22.21.0, os: linux-amd64, runner: ubuntu-latest}
          - {binding: ts, toolchain: node-24, os: linux-amd64, runner: ubuntu-latest}
          # "msrv", not a hardcoded number: resolved at run time from
          # rust/Cargo.toml's own rust-version, by the "the MSRV from
          # rust/Cargo.toml" step below, so a future MSRV bump in that one
          # file flows through here without a workflow edit.
          - {binding: rust, toolchain: msrv, os: linux-amd64, runner: ubuntu-latest}
          - {binding: rust, toolchain: stable, os: linux-amd64, runner: ubuntu-latest}
          - {binding: go, toolchain: go.mod, os: darwin-arm64, runner: macos-latest}
          - {binding: python, toolchain: "3.13", os: darwin-arm64, runner: macos-latest}
          - {binding: ts, toolchain: node-24, os: darwin-arm64, runner: macos-latest}
          - {binding: rust, toolchain: stable, os: darwin-arm64, runner: macos-latest}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download this leg's stub libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v1-abi-stubs-${{ matrix.os }}
          path: ${{ runner.temp }}/abi-stubs
      # The major this leg tests is the binding's, derived from
      # spec/binding-majors.json, printed, and asserted against the stub the
      # leg hands the binding (dlopen'd and asked for chs_abi_version() and its
      # abi_fingerprint) and against the binding's compiled-in layer.
      - name: the ABI major this leg tests, derived and asserted against the stub it loads
        id: major
        run: |
          major="$(python3 scripts/abi-v1/majors.py get "${{ matrix.binding }}")"
          python3 scripts/abi-v1/majors.py announce "${{ matrix.binding }}" --what "${{ matrix.toolchain }} ${{ matrix.os }}"
          python3 scripts/abi-v1/majors.py assert-stubs "${{ matrix.binding }}" "$RUNNER_TEMP/abi-stubs/v$major"
          python3 scripts/abi-v1/majors.py assert-layer "${{ matrix.binding }}"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      # Toolchain setup, one binding at a time, each gated so only the
      # matching leg pays for it. This lives HERE rather than in each
      # binding's own scripts/abi-v1/conformance/<binding>.sh so that adding
      # a binding lane never means editing this workflow (every binding
      # lane editing the same `case` block here was exactly the merge
      # conflict this shape avoids). Pins match ci.yml's own no-artifacts
      # jobs — one source of truth per action.
      - name: set up Go
        if: matrix.binding == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false
      - name: set up uv, at this leg's Python version
        if: matrix.binding == 'python'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.toolchain }}
          # Same as v1-abi-gen's own setup-uv step above: the $dir-absent
          # skip means uv may never actually run in this job (no binding has
          # landed yet), so auto-caching's post-job save step fails loudly
          # on a cache directory that was never created ("Cache path ...
          # does not exist on disk", measured on this PR). Nothing here is
          # expensive enough to need the cache anyway.
          enable-cache: false
      - name: this leg's Node version (the ts toolchain label minus its "node-" prefix)
        if: matrix.binding == 'ts'
        id: ts-version
        run: |
          v="${{ matrix.toolchain }}"
          echo "version=${v#node-}" >> "$GITHUB_OUTPUT"
      - name: set up pnpm
        if: matrix.binding == 'ts'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, the same as ci.yml's own ts job.
          package_json_file: ts/package.json
      - name: set up Node, at this leg's version
        if: matrix.binding == 'ts'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.ts-version.outputs.version }}
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: the MSRV from rust/Cargo.toml (so a future bump needs no workflow edit)
        if: matrix.binding == 'rust' && matrix.toolchain == 'msrv'
        id: msrv
        # A fixed pattern over rust/Cargo.toml's own `rust-version` line; a
        # missing or reshaped line fails the step rather than guessing.
        run: |
          v="$(grep -oE '^rust-version[[:space:]]*=[[:space:]]*"[0-9]+\.[0-9]+"' rust/Cargo.toml | grep -oE '[0-9]+\.[0-9]+')"
          if [ -z "$v" ]; then
            echo "::error::could not read rust-version from rust/Cargo.toml"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: set up Rust, at this leg's toolchain
        if: matrix.binding == 'rust'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: ${{ matrix.toolchain == 'msrv' && steps.msrv.outputs.version || matrix.toolchain }}

      - name: run every ABI case through the binding against the stubs, and upload the report
        id: run
        env:
          MAJOR: ${{ steps.major.outputs.major }}
          REPORT: ${{ runner.temp }}/abi1-report-${{ matrix.binding }}-${{ matrix.toolchain }}-${{ matrix.os }}.json
        run: |
          # The binding reads the variables of the major it speaks:
          # CHTYPES_ABI<N>_STUBS, _REPORT and _TOOLCHAIN (a v2 binding reads
          # nothing named for ABI v1).
          export "CHTYPES_ABI${MAJOR}_STUBS=$RUNNER_TEMP/abi-stubs/v$MAJOR"
          export "CHTYPES_ABI${MAJOR}_REPORT=$REPORT"
          export "CHTYPES_ABI${MAJOR}_TOOLCHAIN=${{ matrix.toolchain }}"
          dir="$(python3 scripts/abi-v1/majors.py layer-dir "${{ matrix.binding }}")"
          # No binding's v1 FFI lane has landed yet (F-Go/F-Py/F-TS/F-Rust, per
          # the lane plan). Until one adds "$dir", this leg skips LOUDLY by
          # name rather than failing or silently passing, exactly as every
          # other no-registry test in this repository does.
          if [ ! -d "$dir" ]; then
            echo "v1-abi-conformance (${{ matrix.binding }} ${{ matrix.toolchain }} ${{ matrix.os }}): skipping loudly — $dir does not exist yet; this binding's v1 ABI lane has not landed"
            echo "report=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The lane that adds "$dir" also adds this script (never edits this
          # workflow): it can assume its toolchain is already on PATH (set up
          # above) and CHTYPES_ABI<N>_STUBS/CHTYPES_ABI<N>_REPORT/
          # CHTYPES_ABI<N>_TOOLCHAIN are exported. It should load its generated
          # invoke-by-name dispatcher and loader, point them at
          # CHTYPES_ABI<N>_STUBS (stubs.json there has each variant's path and
          # predicate), run tests/fixtures/abi-v1/cases.json's cases, and
          # write a spec/abi-v1/schema/report.schema.json-shaped report to
          # CHTYPES_ABI<N>_REPORT. Its own exit code is this step's exit code;
          # the report is uploaded whenever CHTYPES_ABI<N>_REPORT exists
          # afterward, pass or fail, so a partial report from a failing run
          # is still visible to a human reading the artifact.
          script="scripts/abi-v1/conformance/${{ matrix.binding }}.sh"
          if [ ! -f "$script" ]; then
            echo "::error::v1-abi-conformance: $dir exists but $script is missing — the lane that added $dir must add $script"
            exit 1
          fi
          # The report path is per leg (binding, toolchain, os): every leg
          # used to write abi1-report.json, and v1-abi-parity's
          # merge-multiple download let one leg's file overwrite the others'.
          # Selftest first, same discipline as v1-abi-linked/v1-abi-rust
          # above, but conditional: unlike those two single-purpose scripts,
          # a conformance script is not REQUIRED to declare --selftest. Only
          # run it when the script actually looks like it declares one (the
          # same declaration shapes scripts/check-selftests-wired.py itself
          # recognizes for a .sh file), so this never calls an unsupported
          # flag on a script that never promised one.
          if command grep -qE '"\$\{1:-\}"[[:space:]]*=[[:space:]]*"--selftest"|^[[:space:]]*--selftest\)' "$script"; then
            bash "$script" --selftest
          fi
          if bash "$script"; then
            rc=0
          else
            rc=$?
          fi
          if [ -f "$REPORT" ]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"
      - name: upload this leg's report
        if: always() && steps.run.outputs.report == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1-abi-conformance-${{ matrix.binding }}-${{ matrix.toolchain }}-${{ matrix.os }}
          path: ${{ runner.temp }}/abi1-report-${{ matrix.binding }}-${{ matrix.toolchain }}-${{ matrix.os }}.json
          retention-days: 7

  v1-abi-linked:
    name: "v1-abi-linked — Go linked mode type-checks against the v1 header"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false
      # No separate C-compiler install: ubuntu-latest ships gcc and clang
      # already, which v1-abi-gen's header-syntax step above already relies
      # on the same way.
      #
      # Two steps, selftest first — the same shape ci.yml uses for
      # check-linked-build.sh — so scripts/check-selftests-wired.py sees
      # this script's own --selftest actually invoked, not just declared.
      # The lane that adds go/internal/abi1 (F-Go) also adds this script
      # (never edits this workflow): a cgo type-check of linked_gen.go
      # against include/chtypes.h, no artifact (plan §2.4's v1 successor
      # of check-linked-build.sh), under scripts/abi-v1 and named for this
      # job (below: check-${check}.sh).
      # The linked path is Go's: the major is go's (spec/binding-majors.json),
      # its header is that major's, and the generated ABI v2 linked_gen.go
      # refuses at compile time any header whose CHS_ABI_VERSION is not 2
      # (the selftest below hands it ABI v1's and requires that refusal).
      - name: the ABI major this job tests, derived, and the header it type-checks against
        run: |
          python3 scripts/abi-v1/majors.py announce go --what "linked mode"
          python3 scripts/abi-v1/majors.py assert-layer go
          python3 scripts/lib/provenance.py --header "$(python3 scripts/abi-v1/majors.py header go)"
      - name: "selftest — the linked-mode check's own fixtures, once it exists"
        run: |
          check="linked"
          script="scripts/abi-v1/check-${check}.sh"
          if [ ! -f "$script" ]; then
            echo "::error::v1-abi-linked: not yet provided (lane F-Go) — add $script"
            exit 1
          fi
          bash "$script" --selftest
      - name: type-check the generated linked table against include/chtypes.h
        run: |
          check="linked"
          bash "scripts/abi-v1/check-${check}.sh"

  v1-abi-rust:
    name: "v1-abi-rust — clippy/fmt/test --features abi-v1"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # stable only, deliberately not a {msrv, stable} matrix like
      # v1-abi-conformance's rust legs: this job's name is one of the
      # spelled-exactly check contexts named at the top of this file
      # ("required once the Rust lane lands"), and a matrix here would split
      # it into two context names to keep in sync with branch protection for
      # no proof this job itself needs — the MSRV legs of the actual
      # conformance cases already run in v1-abi-conformance's
      # `rust msrv`/`rust stable` matrix. If a later lane wants MSRV coverage
      # of clippy/fmt/test too, add a matrix here then and update the header
      # comment's context list in the same change.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: clippy, rustfmt
      # Two steps, selftest first — the same shape as v1-abi-linked above and
      # ci.yml's check-linked-build.sh — so scripts/check-selftests-wired.py
      # sees this script's own --selftest actually invoked. The lane that
      # adds rust/src/abi1 (F-Rust) also adds this script (never edits this
      # workflow): `cargo clippy`/`fmt --check`/`test` with `--features
      # abi-v1`, default-feature output byte-unchanged; under scripts/abi-v1
      # and named for this job, the same way as v1-abi-linked's script above.
      - name: the ABI major this job tests, derived and asserted against the rust binding's compiled-in layer
        run: |
          python3 scripts/abi-v1/majors.py announce rust --what "clippy, fmt, test"
          python3 scripts/abi-v1/majors.py assert-layer rust
      - name: "selftest — the clippy/fmt/test check's own fixtures, once it exists"
        run: |
          check="rust"
          script="scripts/abi-v1/check-${check}.sh"
          if [ ! -f "$script" ]; then
            echo "::error::v1-abi-rust: not yet provided (lane F-Rust) — add $script"
            exit 1
          fi
          bash "$script" --selftest
      - name: clippy, fmt and the unit tests with the abi-v1 feature
        run: |
          check="rust"
          bash "scripts/abi-v1/check-${check}.sh"

  v1-abi-parity:
    name: "v1-abi-parity — every enrolled binding passes every ABI case"
    needs: v1-abi-conformance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read lets the guard below list this run's artifacts.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: download every leg's report, if any binding is enrolled yet
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: v1-abi-conformance-*
          path: ${{ runner.temp }}/abi1-reports
          merge-multiple: true
        # Every v1-abi-conformance leg skips loudly today (no binding lane has
        # landed), so there is nothing to download yet; parity.py's own
        # 0-reports-dir handling (load_reports) covers that, and this must not
        # fail the job over "no artifacts found" once that is also true for a
        # run with zero MATCHING legs rather than zero REPORTS.
        continue-on-error: true
      # Guard: the downloaded report files must be as many as the
      # v1-abi-conformance-* artifacts this run uploaded (listed from the
      # Actions API, not from the download, which is the thing under test). A
      # lower count means a report was lost or overwritten on the way here,
      # and a leg reading MISSING for that reason is a harness defect, not a
      # binding's.
      - name: every uploaded leg report was downloaded (no report lost or overwritten)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("v1-abi-conformance-")) | .name' | sort -u | wc -l | tr -d ' ')"
          # The download dir is absent when no leg uploaded anything; under
          # pipefail a find on a missing dir would fail this step silently.
          mkdir -p "$RUNNER_TEMP/abi1-reports"
          have="$(find "$RUNNER_TEMP/abi1-reports" -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')"
          echo "v1-abi-conformance artifacts uploaded: $want; report files downloaded: $have"
          if [ "$have" -lt "$want" ]; then
            echo "::error::v1-abi-parity: $have report file(s) downloaded but $want v1-abi-conformance artifact(s) exist — a report was lost or overwritten"
            exit 1
          fi
      - name: selftest — MISSING, FAILED, EXTRA and STALE each refuse, and 0-enrolled is green, on a fabricated tree
        run: uv run --no-project --python 3.11 scripts/abi-v1/parity.py --selftest
      - name: every enrolled binding has a passing report per leg, for the same cases of its own major
        run: |
          for b in go python ts rust; do
            python3 scripts/abi-v1/majors.py announce "$b" --what "parity"
          done
          uv run --no-project --python 3.11 scripts/abi-v1/parity.py --reports-dir "$RUNNER_TEMP/abi1-reports"
