# release-rust — publish rust/ to crates.io on a `rust/v*` tag, via crates.io
# Trusted Publishing (OIDC): configure the publisher once on crates.io for the
# `chtypes` crate (repo Wave-RF/chtypes, workflow release-rust.yml).
#
# On this branch the only releasable tags are the channel's
# (scripts/release-channel.sh; until the v2 lock, rust/v2.0.0-dev.N): a semver
# pre-release, which Cargo never resolves for a requirement that does not name
# one (#511). The `never-default` job asserts that against crates.io and Cargo
# themselves after the publish, and its twin does in a dry run.
name: release-rust
on:
  push:
    tags: ["rust/v*"]
  # A dry run: every step up to the publish, none of the publish. `tag` is the
  # tag NAME to check against the crate's version (nothing is tagged).
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag name to check against the crate version, for example rust/v1.0.0."
        required: true
        type: string
      dry_run:
        description: "Run every step up to the publish (cargo publish --dry-run --locked); skip the publish and the post-publish check."
        required: true
        type: boolean
        default: true
      verify_only:
        description: "Skip the publish job and run only the verify job against the ALREADY-PUBLISHED version the tag names (registry install first, with its retry loop). Wins over dry_run."
        required: false
        type: boolean
        default: false
permissions:
  contents: read
# Every run: step uses bash with -eo pipefail. GitHub's default for a step
# with no shell: is `bash -e {0}`, WITHOUT pipefail, so a failing command on
# the left of a pipe was hidden by the exit status of the one on the right.
defaults:
  run:
    shell: bash

jobs:
  # Every step a dry run needs, in a job with NO `environment:`: a dry run is
  # dispatched from any branch and must never enter the `crates-io` deployment
  # environment (the crates.io trusted publisher trusts that environment NAME,
  # so only a real publish, from a tag, may carry it). Same split as main's.
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      default: ${{ steps.record.outputs.default }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before anything is installed or built: the channel's own selftest, then
      # the tag must be a release of this branch's channel.
      - name: "the tag is a release of this branch's channel (scripts/release-channel.sh, #511)"
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          scripts/release-channel.sh --selftest
          scripts/release-channel.sh tag rust "$TAG_NAME"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: the tag and the crate agree on the version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          name="${TAG_NAME#rust/v}"
          tag="$name"
          ver="$(cd rust && cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["packages"][0]["version"])')"
          [ "$tag" = "$ver" ] || { echo "::error::tag rust/v$tag but Cargo.toml says $ver"; exit 1; }
      - run: cd rust && cargo build --locked && cargo test --locked --lib
      # The User-Agent assertion. `user_agent()` is `chtypes-rust/` plus
      # CARGO_PKG_VERSION; the unit test pins that shape (and must have RUN: a
      # filter that matches nothing reports "0 passed"), and the BUILT binary
      # must report the tagged version. It runs on the tag path too, before
      # anything is published.
      - name: the User-Agent version is the version being tagged
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="${TAG_NAME#rust/v}"
          out="$(cd rust && cargo test --locked --lib user_agent_is_chtypes_rust_with_the_crate_version 2>&1)"
          printf '%s\n' "$out"
          grep -q 'test result: ok. 1 passed' <<<"$out" || { echo "::error::the User-Agent unit test did not run and pass"; exit 1; }
          got="$(cd rust && cargo run --locked --quiet --bin chtypes -- --version)"
          echo "binary: $got"
          [ "$got" = "chtypes $tag" ] || { echo "::error::the built binary reports '$got', the tag says chtypes $tag"; exit 1; }
      # The record the never-default job compares against: crates.io's
      # max_stable_version right now. It must already be a stable 1.x, or
      # nothing is published over it.
      - name: record what crates.io installs by default before the publish (a stable 1.x)
        id: record
        run: |
          default="$(scripts/release-channel.sh default rust)"
          echo "max_stable_version before the publish: $default"
          echo "default=$default" >> "$GITHUB_OUTPUT"
      - name: dry run, the publish rehearsal
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cd rust && cargo publish --dry-run --locked
  # The only job with `environment:`. It runs for a real publish alone: a tag
  # push, or a dispatch with dry_run=false (and not verify_only). `cargo publish`
  # builds and verifies the crate itself; every check already passed in `build`.
  publish:
    needs: build
    if: github.event_name == 'push' || (inputs.dry_run == false && !inputs.verify_only)
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cd rust && cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  # "Never installed by default", asserted against crates.io and Cargo
  # themselves, never left to a comment. After a publish: crates.io's
  # max_stable_version is still the 1.x the publish job recorded, on every
  # read, and a plain `cargo add chtypes` (no version) in a clean project still
  # locks that 1.x, while the crate's own version page serves 2.0.0-dev.N
  # (polled for lag, up to 15 minutes). A dry run runs the same assertions
  # against crates.io as it is now, the twin: the default is the recorded 1.x,
  # the version is not published yet, and the same presence check finds the
  # recorded version (its positive control). scripts/release-channel.sh holds
  # both, and its selftest plants every refusal.
  never-default:
    needs: [build, publish]
    if: ${{ !failure() && needs.build.result == 'success' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.dry_run)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: crates.io and a plain cargo add still pick the recorded 1.x, and 2.0.0-dev.N is served (a dry run asserts it against crates.io as it is)
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RECORDED: ${{ needs.build.outputs.default }}
          PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'twin' || 'after' }}
        run: |
          version="$(scripts/release-channel.sh tag rust "$TAG_NAME")"
          scripts/release-channel.sh never-default rust "$version" "$RECORDED" "$PHASE"
  # A publish step exiting 0 does not mean anyone can install the package.
  # Measured on ts/v0.1.1 (issue #10): the job went green ~7 minutes before
  # npm served the tarball, and for ~2 of those minutes `latest` resolved to
  # a version that 404'd. This installs the real thing from the public
  # registry, with no credentials, in a clean directory, and makes it speak.
  #
  # Its own job so "Re-run failed jobs" on a timeout re-runs ONLY this:
  # `cargo publish` cannot be retried, crates.io refuses to publish over a
  # version that already exists. No `environment` and no `id-token: write`
  # here: this job only reads public registries anonymously.
  #
  # What it proves (on the tag path each one a fact about the PUBLISHED
  # crate, none read from this checkout's source tree): the crate installs
  # (the registry-lag retry loop, 15 minutes); its generation-2 fingerprint
  # constant equals CHS_ABI_FINGERPRINT in include/v2/chtypes.h; the published
  # `chtypes` binary lists, fetches and loads from the channel's registry
  # (staging chtypes/v2-dev) and no other; and the loaded library reports abi
  # 2 and that fingerprint. The six checks are scripts/release-verify.sh's
  # header.
  # The steps are scripts/release-verify.sh, shared by every path:
  #   - a tag push: publish, then verify the registry's copy;
  #   - a dry run (dry_run=true): no publish; the same steps against the crate
  #     in this checkout (`cargo install --path`), the retry loop skipped;
  #   - verify_only=true: no publish; the same steps against the version the
  #     `tag` input names, already on crates.io.
  # The parser of `chtypes list` and the whole sequence are therefore exercised
  # by a dry run, before an irreversible publish.
  verify:
    needs: [build, publish]
    if: ${{ !failure() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.verify_only)) && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && (github.event_name == 'push' || inputs.verify_only || inputs.dry_run || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: the verify script's own selftest (the list parser and every channel check)
        run: scripts/release-verify.sh --selftest
      - name: the crate installs, speaks include/v2/chtypes.h's fingerprint, and lists, fetches and loads from the channel's registry only
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.verify_only && 'local' || 'registry' }}
        run: |
          version="${TAG_NAME#rust/v}"
          if [ "$MODE" = local ]; then
            scripts/release-verify.sh rust local "$version" rust
          else
            scripts/release-verify.sh rust registry "$version"
          fi
