# release-rust — publish rust/ to crates.io on a `rust/v*` tag, via crates.io
# Trusted Publishing (OIDC): configure the publisher once on crates.io for the
# `chtypes` crate (repo Wave-RF/chtypes, workflow release-rust.yml).
name: release-rust
on:
  push:
    tags: ["rust/v*"]
  # A dry run: every step up to the publish, none of the publish. `tag` is the
  # tag NAME to check against the crate's version (nothing is tagged).
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag name to check against the crate version, for example rust/v1.0.0."
        required: true
        type: string
      dry_run:
        description: "Run every step up to the publish (cargo publish --dry-run --locked); skip the publish and the post-publish check."
        required: true
        type: boolean
        default: true
permissions:
  contents: read
# Every run: step uses bash with -eo pipefail. GitHub's default for a step
# with no shell: is `bash -e {0}`, WITHOUT pipefail, so a failing command on
# the left of a pipe was hidden by the exit status of the one on the right.
defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: the tag and the crate agree on the version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          name="${TAG_NAME#rust/v}"
          tag="$name"
          ver="$(cd rust && cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["packages"][0]["version"])')"
          [ "$tag" = "$ver" ] || { echo "::error::tag rust/v$tag but Cargo.toml says $ver"; exit 1; }
      - run: cd rust && cargo build --locked && cargo test --locked --lib
      # The User-Agent assertion. `user_agent()` is `chtypes-rust/` plus
      # CARGO_PKG_VERSION; the unit test pins that shape (and must have RUN: a
      # filter that matches nothing reports "0 passed"), and the BUILT binary
      # must report the tagged version. It runs on the tag path too, before
      # anything is published.
      - name: the User-Agent version is the version being tagged
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="${TAG_NAME#rust/v}"
          out="$(cd rust && cargo test --locked --lib user_agent_is_chtypes_rust_with_the_crate_version 2>&1)"
          printf '%s\n' "$out"
          grep -q 'test result: ok. 1 passed' <<<"$out" || { echo "::error::the User-Agent unit test did not run and pass"; exit 1; }
          got="$(cd rust && cargo run --locked --quiet --bin chtypes -- --version)"
          echo "binary: $got"
          [ "$got" = "chtypes $tag" ] || { echo "::error::the built binary reports '$got', the tag says chtypes $tag"; exit 1; }
      - name: dry run, the publish rehearsal
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cd rust && cargo publish --dry-run --locked
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
      - run: cd rust && cargo publish --locked
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  # A publish step exiting 0 does not mean anyone can install the package.
  # Measured on ts/v0.1.1 (issue #10): the job went green ~7 minutes before
  # npm served the tarball, and for ~2 of those minutes `latest` resolved to
  # a version that 404'd. This installs the real thing from the public
  # registry, with no credentials, in a clean directory, and makes it speak.
  #
  # Its own job so "Re-run failed jobs" on a timeout re-runs ONLY this:
  # `cargo publish` cannot be retried, crates.io refuses to publish over a
  # version that already exists. No `environment` and no `id-token: write`
  # here: this job only reads public registries anonymously.
  #
  # What it proves, in order, each one a fact about the PUBLISHED crate and
  # none read from this checkout's source tree:
  #   1. the crate installs (the registry-lag retry loop, 15 minutes);
  #   2. the ABI fingerprint constant in the published source equals
  #      CHS_ABI_FINGERPRINT in include/chtypes.h (v1 has no revision number);
  #   3. the published `chtypes` binary lists the production registry's lines
  #      and fetches one of them;
  #   4. the public API opens that line, and the loaded library's own
  #      build_info reports the same fingerprint.
  verify:
    needs: publish
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: the published crate installs, speaks the header's ABI fingerprint, fetches a line and loads it
        env:
          WORK_PARENT: ${{ runner.temp }}
        run: |
          version="${GITHUB_REF_NAME#rust/v}"
          want="$(sed -n 's/^#define CHS_ABI_FINGERPRINT "\(sha256:[0-9a-f]*\)"$/\1/p' include/chtypes.h)"
          [ -n "$want" ] || { echo "::error::could not read CHS_ABI_FINGERPRINT from include/chtypes.h"; exit 1; }
          work="$WORK_PARENT/verify-rust"
          rm -rf "$work"; mkdir -p "$work/bin"
          export CHTYPES_CACHE="$work/cache"
          echo "verifying chtypes $version, expecting $want"

          # 1. the registry-lag retry loop: install the published binary.
          deadline=$(( $(date +%s) + 900 ))
          until cargo install "chtypes@=$version" --locked --root "$work/bin" > "$work/install.log" 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              tail -n 20 "$work/install.log"
              echo "::error::chtypes $version did not become installable from crates.io within 900s"
              exit 1
            fi
            echo "not installable yet; retrying in 30s"
            sleep 30
          done

          # 2. the fingerprint constant in the PUBLISHED source, from the registry's own copy.
          cd "$work"
          cargo init --name chtypes-verify --vcs none >/dev/null 2>&1
          cargo add "chtypes@=$version" >/dev/null 2>&1
          src="$(cargo metadata --format-version 1 | python3 -c 'import json,sys; print(next(p["manifest_path"] for p in json.load(sys.stdin)["packages"] if p["name"] == "chtypes"))')"
          got="$(sed -n 's/^ *"\(sha256:[0-9a-f]*\)";$/\1/p' "$(dirname "$src")/src/abi1/decls.rs" | head -n 1)"
          [ "$got" = "$want" ] || { echo "::error::published CHS_ABI_FINGERPRINT is '$got', include/chtypes.h says '$want'"; exit 1; }

          # 3. the published CLI, against the production registry.
          line="$("$work/bin/bin/chtypes" list | sed -n '/^[0-9][0-9]*\.[0-9][0-9]*$/p' | sort -V | tail -n 1)"
          [ -n "$line" ] || { echo "::error::the production registry lists no line"; exit 1; }
          echo "fetching $line"
          "$work/bin/bin/chtypes" fetch "$line"

          # 4. the public API opens it; the library's own build_info must agree.
          cat > src/main.rs <<RS
          fn main() -> Result<(), Box<dyn std::error::Error>> {
              let registry = chtypes::Registry::new(chtypes::RegistryOptions::default())?;
              let lib = registry.for_version("$line")?;
              println!("{}", lib.build_info().abi_fingerprint);
              Ok(())
          }
          RS
          loaded="$(cargo run --quiet)"
          [ "$loaded" = "$want" ] || { echo "::error::the loaded library reports '$loaded', expected '$want'"; exit 1; }
          echo "OK: chtypes $version installs, speaks $want, fetched $line and loaded it"
