# ci — the SDK repository's own gate, on GitHub's hosted runners only.
#
# This repository is public and its CI is deliberately small — the bindings,
# and how to use them — with no secret and no runner of our own. This file is
# the language half: each binding builds, lints and runs its own unit suite
# with nothing on any artifact search path (the go / python / ts / rust jobs),
# and `checks` runs the repository's own scripts and their selftests. The ABI
# half and the fetch half live in two sibling workflows, each with its own
# required contexts:
#
#   v1-abi.yml   the ABI description, the generated header and every generated
#                declaration layer agree; every binding passes every ABI case
#                against the generated stub (`v1-abi-gen`, `v1-abi-parity`,
#                `v1-abi-linked`, `v1-abi-rust`);
#   v1.yml       one constants source, fixtures that regenerate byte-identical,
#                the no-network sandbox, and every binding's fetch conformance
#                (`v1-constants`, `v1-fixtures`, `v1-sandbox`, `v1-parity`).
#
# What used to be here and is gone: the `abi` job (header and bindings agree on
# a revision NUMBER, v0's hand-written declarations checked against the
# header), the `abi-fixtures` job (the wrong-revision refusal against a
# generated fixture), the `artifacts` job (two published lines fetched by the
# v0 shell fetcher, every suite run against the served golden set), and the
# `docs` job (the v0 support page's generated table against the old download
# host's live index), with every selftest of the v0 channel tooling those jobs
# and the v0 read-back workflows ran (retired with v0, #431). ABI v1 has
# no revision number, its declarations are generated from one description, and
# its libraries are fetched over OCI and verified before they load; v1-abi.yml
# and v1.yml prove those properties against a generated stub and a registry
# the tests start themselves, so no job here needs the network or a published
# artifact. A suite that skipped everything is still not a pass:
# scripts/check-suite.sh and scripts/check-standalone.sh read each runner's own
# summary line (color stripped) and refuse zero tests passed. Nothing in this
# file computes a verdict; every step runs a script or a test runner whose own
# output is the answer.
#
# MAJORS (public issue #511). spec/binding-majors.json says which ABI major
# each binding speaks (scripts/abi-v1/majors.py; absent on main: ABI v1 for
# all). Each binding job prints "ABI major tested: N (spec/binding-majors.json@
# <commit>)" to its log and step summary, and asserts N against the identity
# compiled into the binding's generated layer (and, for Go, against the
# constants its own test binary prints), never against the file's own value.
name: ci

# merge_group (checks_requested): the merge queue's own candidate combination
# — a pull request's changes merged with main's CURRENT tip, not the
# possibly-older main its own pull_request run tested — must run and
# conclude every required job here or the queue waits forever. No REQUIRED
# job below reads github.event.pull_request.*, github.base_ref or
# github.head_ref (the only github.ref use is the concurrency group below,
# which is unique per merge_group entry same as it is per pull request), so
# nothing needed a merge_group-specific branch. The one job that reads the
# event's commits is the non-blocking `api-surface`, which names both
# events' base and head explicitly (its own comment says why); this audit is
# recorded in
# .github/workflows/policy-merge.yml's header and in scripts/policy-merge-
# check.py's module docstring (ENQUEUE, NOT MERGE), which also explains why
# it exists. .github/workflows/policy-merge.yml explicitly ignores a
# merge_group-triggered run of this workflow — it is the queue's own test,
# not something that workflow enqueues again.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every run: step uses bash with -eo pipefail. GitHub's default for a step
# with no shell: is `bash -e {0}`, WITHOUT pipefail, so a failing command on
# the left of a pipe was hidden by the exit status of the one on the right.
defaults:
  run:
    shell: bash

jobs:
  checks:
    name: "checks — repository scripts and their selftests (no network, no artifact)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every binding used to carry its own copy of ClickHouse's identifier
      # quoting, and all four were wrong the same way (#52). The copies are
      # deleted; chs_back_quote, chs_back_quote_if_needed and chs_quote_string
      # are the only source of a quoted spelling here. This fails if a binding
      # re-grows a local rule, and if a binding's generated declaration layer
      # stops wiring the symbols it must call instead. Selftest first: it
      # plants a re-grown rule and a dropped declaration in every binding and
      # requires each to be caught, because a check that has only ever passed
      # is not known to work.
      - name: selftest — a re-grown quoting rule and a dropped declaration fire in every binding
        run: scripts/check-quoting-passthrough.py --selftest
      - name: no binding spells a ClickHouse quoting rule of its own
        run: scripts/check-quoting-passthrough.py
      # The same rule, for ClickHouse's error-code table. The table is a
      # property of each build and moves between lines — one number names two
      # different errors on 25.8 and 26.2 — so every binding asks the loaded
      # library through chs_error_codes and none may carry a code -> name
      # table of its own. This fails on a table shape or a known error name as
      # a literal in binding source (tests excluded), and on a binding whose
      # generated layer stops declaring chs_error_codes.
      - name: selftest — a planted error-code table, a name literal and a dropped declaration fire in every binding
        run: scripts/check-no-error-code-table.py --selftest
      - name: no binding carries a ClickHouse error-code table of its own
        run: scripts/check-no-error-code-table.py
      # go/chtypes shares one package namespace with the artifact producer's
      # overlay tests when they are compiled in with `go test -overlay`, and
      # a top-level name declared on both sides breaks that build (#127) — a
      # collision neither repository's own CI can see coming, since this one
      # cannot read the overlay's files and the overlay only meets a new name
      # once the header pin moves to point at it. check-reserved-test-names.go
      # statically parses go/chtypes/*.go with Go's own syntax parser (no
      # build, no test, no artifact, no network — see its own header) and
      # fails on any top-level func/type/var/const identifier — including
      # every member of a grouped block — matching the reserved range.
      # Selftest first, same discipline as the `public` job below: a rule
      # that matches nothing passes silently, which is the failure this
      # exists to prevent.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: go/chtypes never declares an identifier in the artifact producer's reserved Truth range (selftest)
        run: scripts/check-reserved-test-names.sh --selftest
      - name: go/chtypes never declares an identifier in the artifact producer's reserved Truth range
        run: scripts/check-reserved-test-names.sh
      # .github/workflows/policy-merge.yml enqueues a pull request to merge
      # itself once every condition holds, and scripts/policy-merge-check.py
      # is its whole decision (chtypes#280 generalized this from the old
      # regen-automerge, which only handled a regeneration of the v0 support
      # page — see that script's own header for the conditions and
      # PROTECTED_GLOBS). Selftest first: each refusal (every PROTECTED_GLOBS
      # family, a missing, failing or pending required check, a fork, a stale
      # head) must fire and an all-good input
      # must pass. Then its pinned REQUIRED_CHECKS must name exactly the jobs
      # in THIS file that carry no job-level `continue-on-error: true`,
      # derived from this file's text: the built-in token cannot read branch
      # protection, so that list is pinned, and renaming or adding a blocking
      # job here without updating it fails here rather than leaving the
      # policy merge judging a stale list. Last, CONTRIBUTING.md's generated
      # protected-glob block must still match PROTECTED_GLOBS exactly — the
      # guide is derived, never hand-copied, and this is what catches the two
      # drifting apart. No network, no artifact.
      - name: selftest — every policy-merge refusal fires, and an all-good pull request passes
        run: scripts/policy-merge-check.py --selftest
      - name: the policy merge's pinned required checks are exactly this file's blocking jobs
        run: scripts/policy-merge-check.py --check-ci-names
      - name: the merge-bot token mint asks for exactly contents and pull-requests write, inside the merge-bot job
        run: scripts/policy-merge-check.py --check-mint-scope
      - name: CONTRIBUTING.md's protected-glob block matches PROTECTED_GLOBS exactly
        run: scripts/policy-merge-check.py --check-guide
      # The security carve-out (chtypes#285 §1): signature and checksum
      # verification code stays protected whatever its binding's api-surface
      # verdict says. The list is pinned in PROTECTED_GLOBS, and this derives
      # it again from the tree — every binding file holding a verification
      # primitive or a trust anchor must be covered, and every entry must
      # still cover a file — so code that moves cannot quietly leave the
      # carve-out behind. No network, no artifact.
      - name: the security carve-out covers every binding file that holds verification code, and no entry has gone stale
        run: scripts/policy-merge-check.py --check-carve-out
      # scripts/check-suite.sh and scripts/lib/provenance.py (called from
      # inside check-suite.sh's own --selftest) each had a --selftest mode
      # that no workflow step ever invoked (chtypes#268) — the exact gap a
      # since-retired v0 script was in until #267 wired it here, whose first
      # CI run then found a latent SIGPIPE race that had never shown locally.
      # It passes locally today; that is not the same claim as "CI has seen
      # it fail," which is the whole reason this repository runs a selftest
      # before trusting the check it guards. It needs no artifact and no
      # network: check-suite.sh's selftest drives its census matchers against
      # fabricated logs (and, inside itself, provenance.py's own selftest
      # against rewritten temp headers), with only python3, already on this
      # runner.
      - name: "selftest — check-suite.sh's census matchers (and, inside it, provenance.py's own selftest)"
        run: scripts/check-suite.sh --selftest
      # scripts/lib/gha_annotate.py (chtypes#320) turns a provenance line
      # into a GitHub Actions check-run ANNOTATION, readable anonymously by
      # a machine that cannot read this job's log (measured 2026-09-30: the
      # log 403s unauthenticated). scripts/lib/provenance.py calls it
      # directly (covered by provenance.py's own selftest, above, inside
      # check-suite.sh's). Needs no network and no artifact: it drives its
      # own escaping and gating logic against fabricated input only.
      - name: "selftest — scripts/lib/gha_annotate.py's escaping, titles and the unknown-annotation shape"
        run: python3 scripts/lib/gha_annotate.py --selftest
      # scripts/check-cli-parity.sh holds the four chtypes command lines to one
      # expectation file (scripts/cli-parity/expected.txt); each binding's own
      # job runs it against its real CLI. This is its selftest, which needs no
      # toolchain: a fake CLI that follows the contract must match, and each
      # planted mismatch (help on stderr, a bare version, a list header, a
      # --platform that list accepts) must be caught.
      - name: selftest — the CLI parity check passes a conforming CLI and catches each planted mismatch
        run: scripts/check-cli-parity.sh --selftest
      # The release channel (#511) and the release workflows' post-publish
      # check: the release workflows run both selftests too, but only on a
      # dispatch or a tag, so a pull request that broke a refusal would
      # otherwise merge green. Both run on planted input, with no network.
      - name: selftest — the release channel refuses every tag it does not release, and every never-by-default assertion fires
        run: scripts/release-channel.sh --selftest
      - name: selftest — release-verify's list parser and each of its six channel checks refuse a planted failure
        run: scripts/release-verify.sh --selftest
      # scripts/check-selftests-wired.py is the static check that catches the
      # NEXT unwired selftest before it repeats the three above: every script
      # under scripts/ that declares a --selftest mode must be invoked with it
      # by some workflow step, directly or through a named, verified caller
      # (its own header has the full rule). Selftest first, same discipline as
      # every other check in this job — and it must pass on ITSELF: it is a
      # --selftest script too, so a version of this step that forgot to wire
      # its own check would be exactly the regression this file exists to
      # catch. No network, no artifact.
      - name: selftest — an unwired script, a comment-only mention, and a bad CALLED_BY entry are all caught, and this file's own CALLED_BY map verifies
        run: scripts/check-selftests-wired.py --selftest
      - name: every scripts/* --selftest mode is actually invoked by CI, directly or through a verified caller
        run: scripts/check-selftests-wired.py

  go:
    name: "go — build, vet, standalone check (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: build and vet, dlopen-only
        run: cd go && go build ./... && go vet ./...
      - name: the ABI major this job tests, derived and asserted against the Go binding's compiled-in identity
        run: |
          python3 scripts/abi-v1/majors.py announce go --what "build, vet, standalone"
          python3 scripts/abi-v1/majors.py assert-layer go
          dir="$(python3 scripts/abi-v1/majors.py layer-dir go)"
          (cd go && go test -count=1 -v -run '^TestABIIdentity$' "./${dir#go/}/") > "$RUNNER_TEMP/abi-identity.log"
          cat "$RUNNER_TEMP/abi-identity.log"
          python3 scripts/abi-v1/majors.py assert-identity go "$RUNNER_TEMP/abi-identity.log"
      # Selftest first, same rule as everywhere else in this job: needs no
      # registry and no `go` on PATH — it drives scripts/lib/standalone_census.py
      # directly against synthetic go-test -json logs — so it belongs in this
      # no-artifact leg and gates every pull request. Covers the zero-checked
      # guard (chtypes#225): a parent test (TestGoldens) that itself PASSED
      # while every subtest under it SKIPPED must be refused under
      # --require-artifacts, not read as "TestGoldens ran".
      - name: selftest — the standalone census refuses a golden pass that checked zero cases
        run: scripts/check-standalone.sh --selftest
      - name: standalone check — a bare copy builds, the linked API is absent, the suite's census
        run: scripts/check-standalone.sh --no-artifacts
      - name: CLI parity — this binding's chtypes command line matches the shared expectation
        run: scripts/check-cli-parity.sh go
      # The census JSON is diagnostic: it is how a failure is READ, never how a
      # verdict is reached — scripts/check-standalone.sh already decided, and
      # this job's result does not depend on the upload landing. So the upload
      # must not be able to fail a REQUIRED check. On 2026-09-13 the org's
      # Actions artifact storage filled (97.6% one sibling repository) and every
      # CreateArtifact in the org was refused; without this, `go` and
      # `artifacts` both go red for a reason that has nothing to do with the
      # SDK, and no pull request can land until storage frees days later.
      # A genuine upload failure is still visible: the step itself shows red.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: check-standalone-json-no-artifacts
          path: scratch/check-standalone.json
          if-no-files-found: ignore
          retention-days: 7

  python:
    name: "python — ruff, import, suite (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The release workflow's PEP 440 mapping (python/v2.0.0-dev.N is
      # 2.0.0.devN), here so a pull request runs it; it needs `packaging`, so
      # it runs where uv is, not in `checks`.
      - name: selftest — the release's PEP 440 mapping refuses each planted mismatch
        run: uv run --no-project --with packaging==26.3 python3 scripts/release-pep440.py --selftest
      - name: ruff, and the package imports
        # ONE COMMAND PER LINE, deliberately. These were a single `&&` chain
        # followed by a second line, and `bash -e` does NOT exit when a command
        # inside an && list fails — only the last one in the list is subject to
        # it. So `ruff check` failed, `ruff format` never ran, and the step's
        # status became that of the LAST line (the import), which passes. This
        # required check reported success while printing E501 errors into its
        # own log, on every run. Measured 2026-09-14: eleven of them, back
        # through at least three commits.
        run: |
          cd python
          uv sync --locked --group dev
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run python -c 'import chtypes; print("chtypes", chtypes.__version__)'
      - name: the ABI major this job tests, derived and asserted against the python binding's compiled-in layer
        run: |
          python3 scripts/abi-v1/majors.py announce python --what "suite, no artifacts"
          python3 scripts/abi-v1/majors.py assert-layer python
      - name: suite — the artifact tests skip by name, the rest runs
        run: scripts/check-suite.sh --no-artifacts python
      - name: CLI parity — this binding's chtypes command line matches the shared expectation
        run: scripts/check-cli-parity.sh python

  ts:
    name: "ts — build, typecheck, suite (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: build and typecheck
        run: cd ts && pnpm install --frozen-lockfile && pnpm build && pnpm typecheck
      - name: the ABI major this job tests, derived and asserted against the ts binding's compiled-in layer
        run: |
          python3 scripts/abi-v1/majors.py announce ts --what "suite, no artifacts"
          python3 scripts/abi-v1/majors.py assert-layer ts
      - name: suite — the artifact tests skip by name, the rest runs
        run: scripts/check-suite.sh --no-artifacts ts
      - name: CLI parity — this binding's chtypes command line matches the shared expectation
        run: scripts/check-cli-parity.sh ts

  rust:
    name: "rust — build, clippy, fmt, suite (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: clippy, rustfmt
      - name: build, clippy, fmt
        run: cd rust && cargo build --locked && cargo clippy --locked --all-targets -- -D warnings && cargo fmt --check
      - name: --no-default-features — the configuration docs/install.md tells a consumer to build
        run: cd rust && cargo test --locked --no-default-features && cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: the ABI major this job tests, derived and asserted against the rust binding's compiled-in layer
        run: |
          python3 scripts/abi-v1/majors.py announce rust --what "suite, no artifacts"
          python3 scripts/abi-v1/majors.py assert-layer rust
      - name: suite — the artifact tests skip by name, the rest runs
        run: scripts/check-suite.sh --no-artifacts rust
      - name: CLI parity — this binding's chtypes command line matches the shared expectation
        run: scripts/check-cli-parity.sh rust

  examples:
    name: "examples — every binding's tour runs every section (skips by name until enrolled)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # REQUIRED. The v0 `artifacts` job was the only required check that ran
    # examples/chplay.sh; retiring it left the tours gating nothing, and a tour
    # that was broken (0 of 17 sections) went unnoticed. This is its successor.
    # A binding whose tour is not yet on the v1 API is SKIPPED LOUDLY by name
    # (scripts/check-examples-v1.sh has the enrollment rule); an enrolled one
    # must run every section or the job fails. Selftest first, same discipline
    # as every other gate here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: selftest — unenrolled tours skip by name, an enrolled passing tour runs, an enrolled failing tour fails
        run: scripts/check-examples-v1.sh --selftest
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      # A tour runs against a real library its binding fetches through its own
      # CLI, so a binding at ABI v2 fetches from the staging dev channel only
      # (spec/abi-v2/docs.md r6; examples/chplay.sh picks its line there).
      - name: the ABI major each tour tests, derived and asserted against each binding's compiled-in layer
        run: |
          for b in go python ts rust; do
            python3 scripts/abi-v1/majors.py announce "$b" --what "examples tour"
            python3 scripts/abi-v1/majors.py assert-layer "$b"
          done
      - name: every enrolled tour runs every section; every other tour is skipped by name
        run: scripts/check-examples-v1.sh

  api-surface:
    # NON-BLOCKING, on purpose (chtypes#285 §1), and deliberately not a
    # required check: a pull request that changes a binding's exported API on
    # purpose is not wrong, only a manual merge, so it must not show red.
    # This job MEASURES. For each binding whose source the diff touches it
    # compares the pull request's merge base with main (never main's tip)
    # against its head, with one pinned tool per binding, and prints one
    # verdict line per binding into this job's log:
    #
    #   chtypes-api-surface binding=<b> head=<sha> changed=<true|false|error>
    #
    # scripts/policy-merge-check.py reads those lines, and a pull request that
    # touches binding source enqueues itself only on that binding's
    # `changed=false`. Before any verdict, every tool must pass its fixture
    # proof on tests/fixtures/api-surface/ (an addition, a removal and a
    # signature change read changed; an unexported change reads unchanged).
    # A tool that fails either way turns the job red, and a red job's log is
    # never read for a verdict — so a broken tool holds every binding's
    # source for a human, which is the safe side to fail on. The tools,
    # their pins, and why none of them runs anything from the judged head are
    # in scripts/api-surface.py's own header.
    #
    # The two commits compared come from the event, as data through env: the
    # pull request's base and head, or a merge group's. A push to main or a
    # dispatch has neither, so it runs the fixture proofs alone; that keeps
    # main showing the tools work, and it is the only run that may save the
    # tool cache (#295's rule, the same as the artifacts cache above).
    name: "api-surface — every touched binding's exported API, merge base against head (report only)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the merge base, and both commits' trees, are read
          # from git (`git archive`), never checked out.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      # Stable, for `cargo install cargo-public-api`; the pinned nightly that
      # tool needs for rustdoc JSON is installed by the script itself.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      # The installed tools (apidiff, cargo-public-api), each under a
      # directory named by its pinned version. Restore-only here; saved from
      # a push to main (below). A changed script restores the newest older
      # entry and installs only what that entry lacks.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: api-tools
        with:
          path: ~/.cache/chtypes/api-surface
          key: chtypes-api-surface-tools-${{ hashFiles('scripts/api-surface.py') }}
          restore-keys: chtypes-api-surface-tools-
      - name: selftest — the verdict lines round-trip through the checker's reader, and a missing or failing tool is never `changed=false`
        run: scripts/api-surface.py --selftest
      - name: every tool's fixture proof, then one verdict per touched binding (merge base against head)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: scripts/api-surface.py run --base "$BASE_SHA" --head "$HEAD_SHA" --tools "$HOME/.cache/chtypes/api-surface"
      - name: save the tool cache (push to main only, and only on an exact miss)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.api-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chtypes/api-surface
          key: ${{ steps.api-tools.outputs.cache-primary-key }}

  parity-surface:
    # The v1 public-surface parity gate (public issue #436): every binding's
    # public names against docs/reference/bindings-v1.md, read by the same
    # pinned tools api-surface runs (scripts/parity-surface.py imports its
    # pins from scripts/api-surface.py and its header says how each surface
    # is read). It fails on a name the doc gives that a binding lacks, a
    # name spelled differently from the doc's column, a public name the doc
    # does not give, a vocabulary that differs from the description, and an
    # allowlist entry that no longer matches anything; every deliberate
    # difference is an entry in scripts/parity-surface-allow.json with its
    # written reason. Selftest first, then each tool's fixture proof on
    # tests/fixtures/parity-surface/, then the real surfaces.
    #
    # Non-blocking while it earns trust: making it a required check is the
    # maintainers' call once it has been green on main. It reads the checked-out
    # tree only (no base comparison), restores api-surface's tool cache and
    # never saves it, so the two jobs share one set of installed tools.
    name: "parity-surface — every binding's public names against docs/reference/bindings-v1.md (report only)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chtypes/api-surface
          key: chtypes-api-surface-tools-${{ hashFiles('scripts/api-surface.py') }}
          restore-keys: chtypes-api-surface-tools-
      - name: selftest — planted drift in each binding, in each direction, fails; the green fixtures pass
        run: scripts/parity-surface.py --selftest
      - name: each tool's fixture proof, then every binding's real surface against the doc
        run: scripts/parity-surface.py run --tools "$HOME/.cache/chtypes/api-surface" --save "$RUNNER_TEMP/parity-surface"
      # An allowlist entry that hides a real gap cites its public issue; this
      # fails once that issue is closed, so the entry goes with the fix. Reads
      # the issue state through gh with the job's own token.
      - name: allowlist issues — no entry cites a closed issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/parity-surface.py --check-issues
      # The four surfaces as read, for a reviewer checking an allowlist entry.
      # continue-on-error for the same reason as the go job's upload above.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: parity-surface
          path: ${{ runner.temp }}/parity-surface
          if-no-files-found: ignore
          retention-days: 7

  # ── Lint / supply-chain jobs below ─────────────────────────────────
  #
  # All additive: none of the jobs above gained a `needs:` on any of these,
  # and none of these renames a job above — branch protection names checks
  # by job `name:`, and renaming one of the six above would silently drop it
  # from the required-checks list. Every tool here is installed directly
  # (`go install` at a pinned version, `pnpm dlx <pkg>@<version>`, `uvx
  # <pkg>==<version>`, `cargo install --locked`) rather than through a new
  # third-party Action, so no new `uses:` entries — and no new SHAs to
  # pin — were needed beyond the ones this workflow already carries.
  #
  # `lint-go`, `lint-ts`, `lint-actions` and `misspell` are BLOCKING (once
  # someone adds their job names to branch protection's required-checks
  # list — this PR cannot do that itself) because each one is clean on this
  # tree today; `prose` and `security` are deliberately NOT, for reasons in
  # their own comments below.
  lint-go:
    name: "lint-go — golangci-lint (go/.golangci.yml)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      # The official action downloads a PREBUILT binary and caches it. The
      # previous step ran `go install`, which COMPILES golangci-lint from source
      # on every run — about two minutes of build before any linting, and the
      # only step in this workflow that does sustained compilation of a
      # third-party tree. A run failed here on 2026-09-11 having logged nothing
      # from the step and with its post-step skipped, which is a runner abort
      # rather than a lint finding; it passed on rerun with no code change.
      # Removing the compile removes that surface.
      - name: the ABI major this job lints, derived and asserted against the Go binding's compiled-in layer
        run: |
          python3 scripts/abi-v1/majors.py announce go --what "golangci-lint"
          python3 scripts/abi-v1/majors.py assert-layer go
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: go
          args: --timeout 5m ./...

  lint-ts:
    name: "lint-ts — biome (ts/biome.json)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: biome lint
        run: cd ts && pnpm dlx @biomejs/biome@2.5.13 lint .

  lint-actions:
    name: "lint-actions — actionlint + shellcheck"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: actionlint (workflows) + shellcheck (every tracked *.sh) — ubuntu-latest ships shellcheck
        run: scripts/lint-actions.sh

  misspell:
    name: "misspell — American spelling, whole tree (scripts/lint-spelling.sh)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Covers every tracked file (all four SDKs' source, docs, examples,
    # scripts, include/chtypes.h, the root governance files) except
    # `LICENSE`. Two independent checks —
    # `misspell -locale US` and a from-scratch grep pass — because misspell's
    # own dictionary matcher has been shown to silently miss specific words
    # even when they're present in its built-in list; see the long comment
    # at the top of scripts/lint-spelling.sh for the proof, and run
    # `scripts/lint-spelling.sh --selftest` to re-verify it locally.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: prove the check itself catches what misspell alone misses
        run: scripts/lint-spelling.sh --selftest
      - name: misspell -locale US + wordlist grep, whole tree
        run: scripts/lint-spelling.sh

  public:
    # BLOCKING, and a pure function of the diff. This repository is public; a
    # pointer into the private core repository is a dead end for every reader
    # who is not us, and so is a path that is not in this repository at all.
    # lint-public's rules are two literal strings with no allowlist; lint-cited-paths
    # resolves every cited repository path and fails on the ones that are not
    # there. Each script's header says why it exists and what to write instead.
    name: "public — no pointers into the private repository"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The selftest runs FIRST and in the same job: a rule that matches
      # nothing passes silently, which is the exact failure this check exists
      # to prevent, so prove both rules fire before trusting either verdict.
      - run: scripts/lint-public.sh --selftest
      - run: scripts/lint-public.sh
      # The other half of the same failure. lint-public catches the private
      # repository by NAME; lint-cited-paths catches a citation of a path that is
      # simply not here — which is how one proposals document that this
      # repository does not contain was cited six times, from the C header and
      # all four bindings' source, every one of which ships inside a published
      # package. Selftest first, same reason.
      - run: scripts/lint-cited-paths.sh --selftest
      - run: scripts/lint-cited-paths.sh

  prose:
    # BLOCKING. It was report-only while the tree was still hard-wrapped, which
    # was a reason to format the tree rather than to exempt the rule. dprint fmt
    # has since run over all 40 files, markdownlint's config now scopes MD010 to
    # prose (tabs are correct inside Go code blocks) and cedes table style to
    # dprint, and the 35 genuine findings are fixed. Both checks pass, so both
    # gate. Unlike `security`, this check is a pure function of the
    # diff: nothing outside the repository can turn it red.
    name: "prose — markdownlint + no-hard-wrap (dprint textWrap never)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: markdownlint-cli2 (.markdownlint.json)
        run: pnpm dlx markdownlint-cli2@0.18.1
      - name: dprint check — prose-wrap never (dprint.json)
        run: pnpm dlx dprint@0.57.4 check

  security:
    name: "security — dependency vulnerability scan, all four ecosystems (report only)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NON-BLOCKING, on purpose. A scanner that reddens `main` the moment a
    # fresh upstream advisory lands against a pinned dependency — with no
    # patched version published yet, and no source change this repository
    # can make in the hour it happened — is a cost with no matching benefit:
    # it blocks every unrelated PR until someone either bumps to a version
    # that does not exist yet or adds a time-pressured ignore entry. Each
    # scan still runs every push and PR, and still fails its OWN step (so
    # the finding shows up loudly on the run, color and all) — only the
    # job's overall result is prevented from reddening the required checks.
    # "Nobody has to go looking" is the goal here, not "nothing can ever
    # merge while an advisory exists somewhere in the dependency graph."
    # All four scans ran clean on 2026-09-11.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      # Each of the four scanner steps below carries its own `id:` and
      # `continue-on-error: true` (#226): without them, the first ecosystem
      # to fail ended the job right there and the other three never even
      # ran, so a single stale advisory in one ecosystem silently hid the
      # other three's results. The verdict step at the end of this job reads
      # every step's own `outcome` (never `conclusion`, which
      # continue-on-error rewrites a failed step's result to `success`) and
      # fails on any `failure`, so all four report on every run.
      - name: govulncheck (go)
        id: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          cd go && "$(go env GOPATH)/bin/govulncheck" ./...

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: "pip-audit (python) — python 3.12, pinned: pip-audit's own venv bootstrap is flaky on very new interpreters"
        id: pip-audit
        continue-on-error: true
        run: |
          cd python
          uv export --no-hashes --group dev | grep -v '^-e ' > /tmp/requirements-audit.txt
          uvx --python 3.12 pip-audit==2.10.1 -r /tmp/requirements-audit.txt

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: pnpm audit (ts)
        id: pnpm-audit
        continue-on-error: true
        run: cd ts && pnpm install --frozen-lockfile && pnpm audit

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: cargo audit (rust)
        id: cargo-audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cd rust && "$HOME/.cargo/bin/cargo-audit" audit

      - name: verdict — all four scanners' outcomes, and this step is red if any is `failure`
        if: always()
        env:
          GO_OUTCOME: ${{ steps.govulncheck.outcome }}
          PYTHON_OUTCOME: ${{ steps.pip-audit.outcome }}
          TS_OUTCOME: ${{ steps.pnpm-audit.outcome }}
          RUST_OUTCOME: ${{ steps.cargo-audit.outcome }}
        run: |
          names=("govulncheck (go)" "pip-audit (python)" "pnpm audit (ts)" "cargo audit (rust)")
          outcomes=("$GO_OUTCOME" "$PYTHON_OUTCOME" "$TS_OUTCOME" "$RUST_OUTCOME")

          {
            echo "### security — dependency vulnerability scan, per ecosystem"
            echo
            echo "| scanner | outcome |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Red unless EVERY scanner's outcome is exactly `success`. A scanner can
          # read `skipped` (a setup step before it broke) or be stopped mid-run, and
          # neither of those is a clean scan.
          not_ok=()
          for i in "${!names[@]}"; do
            printf '| %s | %s |\n' "${names[$i]}" "${outcomes[$i]:-<empty>}" >> "$GITHUB_STEP_SUMMARY"
            if [ "${outcomes[$i]}" != "success" ]; then
              not_ok+=("${names[$i]}=${outcomes[$i]:-<empty>}")
            fi
          done

          if [ "${#not_ok[@]}" -gt 0 ]; then
            echo "security: not every scanner succeeded: ${not_ok[*]}" >&2
            exit 1
          fi
          echo "security: all four scanners ran and succeeded"
