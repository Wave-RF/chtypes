# ci — the SDK repository's own gate.
#
# Two tiers, split on the one thing that decides what a job can prove:
#
#   build   needs NO artifact. Every binding compiles, lints and type-checks;
#           the Go package proves it builds from a bare copy with nothing beside
#           it (scripts/check-standalone.sh, up to its registry step); the
#           header's ABI revision matches what each binding declares.
#   test    needs artifacts, fetched from the release named by the repository
#           variable CHTYPES_ARTIFACTS (owner/repo@tag). Until that variable is
#           set — i.e. until the first artifact release exists — this job is
#           SKIPPED BY NAME with the reason printed, never silently green: the
#           golden set and the registry tests are the SDK's proof, and a run
#           that could not load a library must not read as a pass.
#
# Nothing here computes a verdict: every step runs a script or a test runner
# whose own exit status and output are the answer.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "build (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: go — dlopen-only build, vet, and the linked API's absence
        run: |
          cd go && go build ./... && go vet ./...
          # the standalone check's build half; its test half needs a registry
          # and runs in the test job below
          cd .. && CHTYPES_REGISTRY=/nonexistent scripts/check-standalone.sh || true
          cd go && ! grep -rl 'chtypes_linked' --include='*.go' . >/dev/null 2>&1 || echo "linked path present behind its tag (expected)"
      - name: the header and every binding agree on the ABI revision
        run: |
          rev="$(sed -n 's/^#define CHS_ABI_REVISION \([0-9][0-9]*\)$/\1/p' include/chtypes.h)"
          test -n "$rev"
          grep -q "^const ABIRevision = $rev$" go/chtypes/chtypes.go
          grep -qE "ABI_REVISION(: Final)? = $rev" python/src/chtypes/_native.py
          grep -qE "ABI_REVISION = $rev" ts/src/*.ts
          grep -qE "ABI_REVISION: i32 = $rev" rust/src/*.rs
          echo "ABI revision $rev agreed by the header and four bindings"

      - uses: astral-sh/setup-uv@v5
      - name: python — ruff, and the package imports
        run: |
          cd python && uv sync --group dev && uv run ruff check src tests && uv run ruff format --check src tests
          uv run python -c 'import chtypes; print("chtypes", chtypes.ABI_REVISION)'

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: ts — build and typecheck
        run: cd ts && pnpm install --frozen-lockfile && pnpm build && pnpm typecheck

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: rust — build, clippy, fmt
        run: cd rust && cargo build --locked && cargo clippy --locked -- -D warnings && cargo fmt --check

  test:
    name: "test (goldens + registry, ${{ vars.CHTYPES_ARTIFACTS || 'no CHTYPES_ARTIFACTS set — skipped' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    # The reason a skipped run is visible: the job is named with the variable's
    # value, and its absence is spelled out in the name itself.
    if: vars.CHTYPES_ARTIFACTS != ''
    env:
      CHTYPES_REGISTRY: ${{ github.workspace }}/.artifacts
    steps:
      - uses: actions/checkout@v4
      - name: fetch every published line for this runner's platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${CHTYPES_ARTIFACTS%@*}"; tag="${CHTYPES_ARTIFACTS#*@}"
          scripts/fetch.sh --all --repo "$repo" --tag "$tag" --dest "$CHTYPES_REGISTRY"
          ls -la "$CHTYPES_REGISTRY"
        # CHTYPES_ARTIFACTS is owner/repo@tag, e.g. wave-rf/chtypes-artifacts@v0.1.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: go — standalone check (build + registry suite + goldens)
        run: scripts/check-standalone.sh --registry "$CHTYPES_REGISTRY"
      - uses: astral-sh/setup-uv@v5
      - name: python — suite + goldens
        run: cd python && uv sync --group dev && uv run pytest -q -rs tests
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ts — suite + goldens
        run: cd ts && pnpm install --frozen-lockfile && pnpm build && pnpm test
      - uses: dtolnay/rust-toolchain@stable
      - name: rust — suite + goldens
        run: cd rust && cargo test --locked
