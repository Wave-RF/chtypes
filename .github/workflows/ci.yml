# ci — the SDK repository's own gate, on GitHub's hosted runners only.
#
# This repository is public and its CI is deliberately small — the bindings,
# and how to use them — with no secret and no runner of our own. The only
# repository variables are CHTYPES_ARTIFACTS_URL and CHTYPES_ARTIFACTS_TAG
# (both optional, both plain non-secret config — visible to a fork's
# pull_request run same as everything else here), which point the
# `artifacts` job at a channel other than the rolling release; see that
# job's own comment for why. It runs every suite three times, on
# ubuntu-latest, and the three legs differ in exactly what the suites are
# given:
#
#   1. WITHOUT artifacts (the go / python / ts / rust jobs). Every binding
#      builds, lints and type-checks; the header and the four bindings agree
#      on the ABI revision; each suite runs with nothing on the artifact
#      search path — the fetch/verify/install contract against
#      spec/fixtures/fetch, the CLIs and the pure units all RUN, and every
#      test that needs an artifact SKIPS, loudly, by name, naming the one
#      command that would fill the gap. This is what a contributor with no
#      network and no artifacts gets, and it must be an honest result.
#      ⚠️ Nothing that reaches the network belongs in these four — see the
#      `abi-fixtures` job's own header, which is separate for exactly that
#      reason.
#
#   2. WITH two published artifacts (the artifacts job, after 1 is green).
#      The newest -lts and the newest -stable line the public release
#      publishes for linux-amd64 — read from the live index.json, never
#      hard-coded — are fetched by scripts/fetch.sh exactly as a consumer
#      fetches them (anonymous, signed, every hash checked), cached on a key
#      derived from those two index rows so nothing downloads until the
#      release changes, and the same suites then RUN the golden set and the
#      registry tests against them. This is "does the published SDK work
#      with the published artifacts", kept small on purpose: two lines, the
#      SDK's own tests. Which release this job reads is itself an input —
#      CHTYPES_ARTIFACTS_URL / CHTYPES_ARTIFACTS_TAG, unset by default and
#      then identical to today — so a branch built against a different ABI
#      revision can point at its own channel with no workflow edit (#85).
#      The bulk proof — the server-truth suites, the oracle, the rigs, every
#      supported line — is the core repository's sdk-suites workflow,
#      against this same tree.
#
#   3. WITH A GENERATED FIXTURE AND NO PUBLISHED ARTIFACT (the abi-fixtures
#      job, #105). Each binding's ABI-revision refusal case and its
#      matching-revision control run only when $CHTYPES_ABI_FIXTURES names a
#      fixture set, and that variable used to be set in run 2 alone — a job
#      that is red by design on a revision branch, which is exactly how a
#      broken refusal hid there. The fixture pair is generated from
#      include/chtypes.h, so it needs no channel and no published line, and
#      this leg therefore gates every pull request whatever any channel has
#      published. It is its own job rather than four extra steps in run 1
#      because the generator is fetched over the network and run 1's whole
#      point is that it needs none; the job's own header argues that at
#      length, and it is the argument someone will later want to "simplify"
#      away.
#
# A suite that skipped everything is not a pass, in any of the three:
# scripts/check-suite.sh and scripts/check-standalone.sh read each runner's
# own summary line (color stripped) and refuse zero tests passed; with
# --require-artifacts they also refuse a golden set that did not run, and with
# $CHTYPES_ABI_FIXTURES set they refuse an ABI-revision case that did not RUN
# and pass. Nothing in this file computes a verdict; every step runs a script
# or a test runner whose own output is the answer.
name: ci

# merge_group (checks_requested): the merge queue's own candidate combination
# — a pull request's changes merged with main's CURRENT tip, not the
# possibly-older main its own pull_request run tested — must run and
# conclude every required job here or the queue waits forever. No REQUIRED
# job below reads github.event.pull_request.*, github.base_ref or
# github.head_ref (the only github.ref use is the concurrency group below,
# which is unique per merge_group entry same as it is per pull request), so
# nothing needed a merge_group-specific branch. The one job that reads the
# event's commits is the non-blocking `api-surface`, which names both
# events' base and head explicitly (its own comment says why); this audit is
# recorded in
# .github/workflows/policy-merge.yml's header and in scripts/policy-merge-
# check.py's module docstring (ENQUEUE, NOT MERGE), which also explains why
# it exists. .github/workflows/policy-merge.yml explicitly ignores a
# merge_group-triggered run of this workflow — it is the queue's own test,
# not something that workflow enqueues again.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every run: step uses bash with -eo pipefail. GitHub's default for a step
# with no shell: is `bash -e {0}`, WITHOUT pipefail, so a failing command on
# the left of a pipe was hidden by the exit status of the one on the right.
defaults:
  run:
    shell: bash

jobs:
  abi:
    name: "abi — the header and every binding agree"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the header and every binding agree on the ABI revision
        run: |
          rev="$(sed -n 's/^#define CHS_ABI_REVISION \([0-9][0-9]*\)$/\1/p' include/chtypes.h)"
          test -n "$rev"
          grep -q "^const ABIRevision = $rev$" go/chtypes/chtypes.go
          grep -qE "ABI_REVISION(: Final)? = $rev" python/src/chtypes/_native.py
          grep -qE "ABI_REVISION = $rev" ts/src/*.ts
          grep -qE "ABI_REVISION: i32 = $rev" rust/src/*.rs
          echo "ABI revision $rev agreed by the header and four bindings"
      # An agreed revision NUMBER proves nothing about the declarations it is
      # supposed to stand for, which is exactly how a nine-parameter typedef
      # for a ten-parameter symbol passed all twelve required checks. The step
      # below generates the prototype table from include/chtypes.h and asserts
      # every binding's own FFI declaration against it — parameter count AND
      # each parameter's type.
      #
      # It belongs in THIS job, not in the artifacts leg: an artifact-gated
      # check would not have caught this one and will not catch the next,
      # because while published artifacts are revision 4 the bindings refuse
      # at load and a wrong declaration is never exercised. This job runs on
      # every pull request with nothing but a checkout.
      #
      # The selftest runs FIRST and in the same job, the precedent
      # scripts/lint-public.sh set: it plants a wrong arity AND a wrong type in
      # every binding and requires each to be caught, because a check that has
      # only ever passed is not known to work.
      - name: selftest — a wrong arity and a wrong type fire in every binding
        run: scripts/check-abi-decls.py --selftest
      - name: every binding's chs_* declaration matches the header's prototype
        run: scripts/check-abi-decls.py
      # Every binding used to carry its own copy of ClickHouse's identifier
      # quoting, and all four were wrong the same way (#52). The copies are
      # deleted; chs_quote_identifier, chs_quote_identifier_if_needed and
      # chs_quote_literal are the only source of a quoted spelling here. This
      # fails if a binding re-grows a local rule, and — the half
      # check-abi-decls.py deliberately does not cover, since it REPORTS an
      # undeclared symbol rather than failing on it — if a binding stops wiring
      # the symbols it must call instead.
      #
      # Here rather than in the artifacts leg, for the reason above it: no
      # revision-5 artifact is published yet, so an artifact-gated check would
      # not run at all on the branch that introduces this.
      - name: selftest — a re-grown quoting rule and a dropped declaration fire in every binding
        run: scripts/check-quoting-passthrough.py --selftest
      - name: no binding spells a ClickHouse quoting rule of its own
        run: scripts/check-quoting-passthrough.py
      # The same rule, for ClickHouse's error-code table (revision 6). The
      # table is a property of each build and moves between lines — one
      # number names two different errors on 25.8 and 26.2 — so every binding
      # asks the loaded library through chs_error_codes and none may carry a
      # code -> name table of its own. This fails on a table shape or a known
      # error name as a literal in binding source (tests excluded), and — the
      # half check-abi-decls.py deliberately does not cover — on a binding
      # that stops declaring chs_error_codes. Here, not in the artifacts leg,
      # for the reason given above: no revision-6 artifact exists on the
      # branch that introduces it.
      - name: selftest — a planted error-code table, a name literal and a dropped declaration fire in every binding
        run: scripts/check-no-error-code-table.py --selftest
      - name: no binding carries a ClickHouse error-code table of its own
        run: scripts/check-no-error-code-table.py
      # go/chtypes shares one package namespace with the artifact producer's
      # overlay tests when they are compiled in with `go test -overlay`, and
      # a top-level name declared on both sides breaks that build (#127) — a
      # collision neither repository's own CI can see coming, since this one
      # cannot read the overlay's files and the overlay only meets a new name
      # once the header pin moves to point at it. check-reserved-test-names.go
      # statically parses go/chtypes/*.go with Go's own syntax parser (no
      # build, no test, no artifact, no network — see its own header) and
      # fails on any top-level func/type/var/const identifier — including
      # every member of a grouped block — matching the reserved range.
      # Selftest first, same discipline as the `public` job below: a rule
      # that matches nothing passes silently, which is the failure this
      # exists to prevent.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: go/chtypes never declares an identifier in the artifact producer's reserved Truth range (selftest)
        run: scripts/check-reserved-test-names.sh --selftest
      - name: go/chtypes never declares an identifier in the artifact producer's reserved Truth range
        run: scripts/check-reserved-test-names.sh
      # scripts/abi-channel.sh is what decides whether the `artifacts` job
      # below reads the served channel or the artifact producer's candidate
      # one for a pending revision (chtypes#232) — get its own derivation
      # wrong and that job either fails red on an equal revision forever, or
      # silently keeps reading the served channel while the header has moved
      # on. Needs no network and no artifact: every case is driven from a
      # fixture index.json and a temp header this script writes itself, never
      # a hand-set derived value, so this runs here rather than in the
      # `artifacts` job and gates every pull request regardless of what any
      # channel currently serves.
      - name: selftest — abi-channel.sh's channel derivation (equal, ahead, behind, disagreeing, missing, explicit override)
        run: scripts/abi-channel.sh --selftest
      # .github/workflows/policy-merge.yml enqueues a pull request to merge
      # itself once every condition holds, and scripts/policy-merge-check.py
      # is its whole decision (chtypes#280 generalized this from the old
      # regen-automerge, which only handled a docs/support.md regeneration — see that script's
      # own header for the six conditions and PROTECTED_GLOBS). Selftest
      # first: each refusal (every PROTECTED_GLOBS family, a docs/support.md
      # byte mismatch or non-modification, a missing, failing or pending
      # required check, a fork, a stale head) must fire and an all-good input
      # must pass. Then its pinned REQUIRED_CHECKS must name exactly the jobs
      # in THIS file that carry no job-level `continue-on-error: true`,
      # derived from this file's text: the built-in token cannot read branch
      # protection, so that list is pinned, and renaming or adding a blocking
      # job here without updating it fails here rather than leaving the
      # policy merge judging a stale list. Last, CONTRIBUTING.md's generated
      # protected-glob block must still match PROTECTED_GLOBS exactly — the
      # guide is derived, never hand-copied, and this is what catches the two
      # drifting apart. No network, no artifact.
      - name: selftest — every policy-merge refusal fires, and an all-good pull request passes
        run: scripts/policy-merge-check.py --selftest
      - name: the policy merge's pinned required checks are exactly this file's blocking jobs
        run: scripts/policy-merge-check.py --check-ci-names
      - name: the merge-bot token mint asks for exactly contents and pull-requests write, inside the merge-bot job
        run: scripts/policy-merge-check.py --check-mint-scope
      - name: CONTRIBUTING.md's protected-glob block matches PROTECTED_GLOBS exactly
        run: scripts/policy-merge-check.py --check-guide
      # The security carve-out (chtypes#285 §1): signature and checksum
      # verification code stays protected whatever its binding's api-surface
      # verdict says. The list is pinned in PROTECTED_GLOBS, and this derives
      # it again from the tree — every binding file holding a verification
      # primitive or a trust anchor must be covered, and every entry must
      # still cover a file — so code that moves cannot quietly leave the
      # carve-out behind. No network, no artifact.
      - name: the security carve-out covers every binding file that holds verification code, and no entry has gone stale
        run: scripts/policy-merge-check.py --check-carve-out
      # scripts/check-suite.sh, scripts/lib/provenance.py (called from inside
      # check-suite.sh's own --selftest) and scripts/published-lines.sh each
      # had a --selftest mode that no workflow step ever invoked (chtypes#268)
      # — the exact gap scripts/index-diff.sh was in until #267 wired it here,
      # whose first CI run then found a latent SIGPIPE race that had never
      # shown locally. Both pass locally today; that is not the same claim as
      # "CI has seen them fail," which is the whole reason this repository
      # runs a selftest before trusting the check it guards. Neither needs an
      # artifact or the network: check-suite.sh's selftest drives its
      # ABI-fixture and parity matchers against fabricated logs (and, inside
      # itself, provenance.py's own selftest against a fabricated registry and
      # a rewritten temp header); published-lines.sh's selftest drives its
      # newest-build selection against a planted index.json fixture, never a
      # curled one. Both need only python3, already on this runner.
      - name: "selftest — check-suite.sh's census matchers (and, inside it, provenance.py's own selftest)"
        run: scripts/check-suite.sh --selftest
      - name: "selftest — published-lines.sh picks the newest BUILD in a line, not list order, not a lexical sort"
        run: scripts/published-lines.sh --selftest
      # scripts/lib/gha_annotate.py (chtypes#320) turns a provenance line
      # into a GitHub Actions check-run ANNOTATION, readable anonymously by
      # a machine that cannot read this job's log (measured 2026-09-30: the
      # log 403s unauthenticated). scripts/lib/provenance.py calls it
      # directly (covered by provenance.py's own selftest, above, inside
      # check-suite.sh's); the `artifacts` job below also calls its CLI
      # directly for the channel notice and the "unknown" fallbacks, which
      # is why this selftest is wired here rather than only reached as a
      # caller's dependency. Needs no network and no artifact: it drives its
      # own escaping and gating logic against fabricated input only.
      - name: "selftest — scripts/lib/gha_annotate.py's escaping, titles and the unknown-annotation shape"
        run: python3 scripts/lib/gha_annotate.py --selftest
      # scripts/check-selftests-wired.py is the static check that catches the
      # NEXT unwired selftest before it repeats the three above: every script
      # under scripts/ that declares a --selftest mode must be invoked with it
      # by some workflow step, directly or through a named, verified caller
      # (its own header has the full rule). Selftest first, same discipline as
      # every other check in this job — and it must pass on ITSELF: it is a
      # --selftest script too, so a version of this step that forgot to wire
      # its own check would be exactly the regression this file exists to
      # catch. No network, no artifact.
      - name: selftest — an unwired script, a comment-only mention, and a bad CALLED_BY entry are all caught, and this file's own CALLED_BY map verifies
        run: scripts/check-selftests-wired.py --selftest
      - name: every scripts/* --selftest mode is actually invoked by CI, directly or through a verified caller
        run: scripts/check-selftests-wired.py

  docs:
    name: "docs — the support matrix still matches what the release serves"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NON-BLOCKING, on purpose, and deliberately not a required check. The
    # matrix names the ClickHouse lines the release publishes, and core adds a
    # line whenever it certifies one — a cross-repo event this repository
    # cannot fix by itself. Blocking here would redden main on somebody else's
    # commit, which is the trade core already refused for fetch-fixtures-check.
    # A warning is the right volume: the docs are stale, nothing is broken.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history AND all tags — the SDK-version -> ABI-revision half of
          # the support matrix reads include/chtypes.h at each binding's own
          # release tag (git show <tag>:include/chtypes.h), and the default
          # single-commit checkout carries neither.
          fetch-depth: 0
      - name: docs/support.md matches the manifests and the live index
        run: |
          if ! scripts/support-matrix.sh --check; then
            {
              echo "### docs/support.md is stale"
              echo
              echo "The release publishes something \`docs/support.md\` does not name."
              echo "Regenerate and commit:"
              echo
              echo '```sh'
              echo 'scripts/support-matrix.sh'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  divergences:
    name: "divergences — docs/limitations.md's Known-divergences claims, against loaded artifacts"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NON-BLOCKING, on purpose — the identical reasoning as the `docs` job
    # just above, not a separate judgment call (chtypes#185). The artifact
    # producer fixing a documented divergence is a cross-repo event this
    # repository cannot prevent, and reddening main on somebody else's
    # correct work is the trade `docs` and scripts/support-matrix.sh already
    # declined, for the same reason fetch-fixtures-check did. A red here
    # means "update docs/limitations.md", never "the library regressed" —
    # scripts/check-divergences.py's own message says which direction.
    continue-on-error: true
    env:
      CHTYPES_REGISTRY: ${{ github.workspace }}/.divergences-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Selftest first, same discipline as `abi` and `public`: a checker
      # nobody has seen fail is not a checker. Needs no network and no
      # registry — it drives the coverage rule and the outcome/err_code/
      # err_msg comparison directly, against fabricated inputs.
      - name: selftest — a claim that no longer holds, and a heading/entry mismatch, are both caught
        run: scripts/check-divergences.py --selftest
      # Exactly the lines docs/divergences.json names, on linux-amd64 — never
      # the `artifacts` job's own three (the newest -lts / -stable / a
      # derived oldest, chtypes#281 item 2): the documented entries' own
      # version range is a DIFFERENT set of lines (run `scripts/
      # check-divergences.py --print-lines` for today's — it is not repeated
      # here, since it drifts as entries are added and retired) that job's
      # own three do not cover (its own comment says why it fetches what it
      # fetches — see .github/workflows/ci.yml above), so bolting on there
      # would silently check nothing. --print-lines reads the same
      # docs/divergences.json the reality check itself drives, so the two
      # can never name a different set.
      # Restored on every event, SAVED only from a push to main (below):
      # a pull_request or merge_group run's save lands under its own ref,
      # which main can never read, so each new key used to be stored twice
      # or three times and the repository's 10 GiB cache filled (#295).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: divergences-cache
        with:
          path: .divergences-artifacts
          key: chtypes-divergences-linux-amd64-${{ hashFiles('docs/divergences.json') }}
      # Deliberately never reads scripts/abi-channel.sh (chtypes#232, point
      # 7 of its own spec): this job stays on the served channel always. It
      # asserts documented claims about a library revision that is already
      # served, and a pending candidate revision has nothing to say about
      # that — there would be no artifact_revision-matching row to check
      # divergences against on a candidate channel in the first place.
      # A line docs/divergences.json names (chtypes#281 item 4) can retire —
      # served, but no longer getting new ABI revisions — the same as any
      # other line. scripts/fetch.sh then exits 4 (CHTYPES_ARTIFACT_UNPUBLISHED:
      # the line IS published, just not at this SDK's revision), and this
      # loop runs under bash's default `-eo pipefail`, so a hard failure on
      # that exit code used to abort the whole loop before a single later
      # line — 25.10, 26.3, 26.8, 26.9 — ever fetched, going dark instead of
      # checking anything (the job is non-blocking, so this never reddened a
      # merge, only silently stopped testing). Exit 4 alone is now a loud,
      # named skip: scripts/check-divergences.py's own "not in this
      # registry" skip (resolve_case(), chtypes#281) then applies to every
      # check that named it, exactly as it already does for a line nobody
      # fetched at all. Exit 3 (CHTYPES_SOURCE_UNREACHABLE: a real outage)
      # and anything else still aborts the loop — only "published, wrong
      # revision" is safe to treat as absence.
      - name: fetch exactly what docs/divergences.json names
        run: |
          for line in $(scripts/check-divergences.py --print-lines); do
            ec=0
            scripts/fetch.sh "$line" --platform linux-amd64 --dest "$CHTYPES_REGISTRY" || ec=$?
            if [ "$ec" -eq 4 ]; then
              echo "divergences: $line is not published at this SDK's ABI revision (CHTYPES_ARTIFACT_UNPUBLISHED) — skipping it; any check naming it will skip loudly by name"
              continue
            elif [ "$ec" -ne 0 ]; then
              exit "$ec"
            fi
          done
      - name: save the divergences cache (push to main only, and only on a miss)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.divergences-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .divergences-artifacts
          key: ${{ steps.divergences-cache.outputs.cache-primary-key }}
      - name: docs/limitations.md's Known-divergences claims still hold against the loaded artifacts
        run: scripts/check-divergences.py --registry "$CHTYPES_REGISTRY"
      # A second, unrelated, equally non-blocking claim about the same served
      # release (chtypes#188): not whether a divergence still holds, but
      # whether the golden set's own SHAPE still has nowhere for a server
      # message to hide. Selftest first, same discipline as the check above.
      - name: selftest — an unknown field, an err_msg-shaped key, and a hardcoded (never source-read) vocabulary are all caught
        run: scripts/check-goldens-shape.py --selftest
      # The registry this job already populated above has no release-level
      # file in it yet (only per-line artifact directories) — sdk-goldens.json
      # is fetched separately, into the SAME directory, so it rides the same
      # cache entry rather than opening a second one.
      - name: fetch the served golden set
        run: scripts/fetch.sh --release-file sdk-goldens.json --dest "$CHTYPES_REGISTRY"
      - name: the served golden set has not grown a field this repository never reviewed
        run: scripts/check-goldens-shape.py --registry "$CHTYPES_REGISTRY"

  go:
    name: "go — build, vet, standalone check (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: build and vet, dlopen-only
        run: cd go && go build ./... && go vet ./...
      # The OTHER Go build (#118). go/chtypes/linked.go is cgo over
      # include/chtypes.h, so the compiler type-checks every `C.chs_*` call
      # site and go/chtypes/linked_abi_check.go pins the frozen ABI numbers to
      # the header — and until now no job passed `-tags chtypes_linked`, so
      # neither check had ever run. scripts/check-abi-decls.py covers that file
      # for ARITY only, on the stated grounds that the compiler has its types.
      # The compiler was never invoked.
      #
      # It belongs HERE, in the no-artifact leg, and why is the finding #118
      # asked for. The tagged build was believed to need a native library from
      # the other half of the project: measured, it does not. Type-checking a
      # non-main cgo package runs the C compiler and only PROBES the link, so
      # it needs a compiler and the in-repo header and nothing else — which
      # this job already has, from a bare checkout, with no network. The
      # artifact-backed job would have bought less coverage at a higher price:
      # it is red by design on a revision branch, and #105 is the record of
      # what an expected-red job does to a check placed inside it. Selftest
      # first, same rule as `abi` and `public`.
      - name: selftest — a mistyped call site and a drifted header constant fail the linked build
        run: scripts/check-linked-build.sh --selftest
      - name: type-check the linked path — cgo against include/chtypes.h, no artifact needed
        run: scripts/check-linked-build.sh
      # Selftest first, same rule as everywhere else in this job: needs no
      # registry and no `go` on PATH — it drives scripts/lib/standalone_census.py
      # directly against synthetic go-test -json logs — so it belongs in this
      # no-artifact leg and gates every pull request. Covers the zero-checked
      # guard (chtypes#225): a parent test (TestGoldens) that itself PASSED
      # while every subtest under it SKIPPED must be refused under
      # --require-artifacts, not read as "TestGoldens ran".
      - name: selftest — the standalone census refuses a golden pass that checked zero cases
        run: scripts/check-standalone.sh --selftest
      - name: standalone check — a bare copy builds, the linked API is absent, the suite's census
        run: scripts/check-standalone.sh --no-artifacts
      # The census JSON is diagnostic: it is how a failure is READ, never how a
      # verdict is reached — scripts/check-standalone.sh already decided, and
      # this job's result does not depend on the upload landing. So the upload
      # must not be able to fail a REQUIRED check. On 2026-09-13 the org's
      # Actions artifact storage filled (97.6% one sibling repository) and every
      # CreateArtifact in the org was refused; without this, `go` and
      # `artifacts` both go red for a reason that has nothing to do with the
      # SDK, and no pull request can land until storage frees days later.
      # A genuine upload failure is still visible: the step itself shows red.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: check-standalone-json-no-artifacts
          path: scratch/check-standalone.json
          if-no-files-found: ignore
          retention-days: 7

  python:
    name: "python — ruff, import, suite (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: ruff, and the package imports
        # ONE COMMAND PER LINE, deliberately. These were a single `&&` chain
        # followed by a second line, and `bash -e` does NOT exit when a command
        # inside an && list fails — only the last one in the list is subject to
        # it. So `ruff check` failed, `ruff format` never ran, and the step's
        # status became that of the LAST line (the import), which passes. This
        # required check reported success while printing E501 errors into its
        # own log, on every run. Measured 2026-09-14: eleven of them, back
        # through at least three commits.
        run: |
          cd python
          uv sync --locked --group dev
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run python -c 'import chtypes; print("chtypes", chtypes.ABI_REVISION)'
      - name: suite — the artifact tests skip by name, the rest runs
        run: scripts/check-suite.sh --no-artifacts python

  ts:
    name: "ts — build, typecheck, suite (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: build and typecheck
        run: cd ts && pnpm install --frozen-lockfile && pnpm build && pnpm typecheck
      - name: suite — the artifact tests skip by name, the rest runs
        run: scripts/check-suite.sh --no-artifacts ts

  rust:
    name: "rust — build, clippy, fmt, suite (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: clippy, rustfmt
      - name: build, clippy, fmt
        run: cd rust && cargo build --locked && cargo clippy --locked --all-targets -- -D warnings && cargo fmt --check
      - name: --no-default-features — the configuration docs/install.md tells a consumer to build
        run: cd rust && cargo test --locked --no-default-features && cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: suite — the artifact tests skip by name, the rest runs
        run: scripts/check-suite.sh --no-artifacts rust

  # TEMPORARY — chtypes#364 measurement only, removed before this PR merges
  # (fix-lane brief, "run it in CI on your PR only"). `continue-on-error:
  # true` at the JOB level so scripts/policy-merge-check.py --check-ci-names
  # reads it as non-blocking and never asks it to be added to
  # REQUIRED_CHECKS; it gates nothing and nothing here is kept.
  scratch-concurrency-probe-364:
    name: "scratch: rust concurrency probe (chtypes#364, TEMPORARY)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: fetch a scratch registry (25.8, linux-amd64)
        run: scripts/fetch.sh 25.8 --platform linux-amd64 --dest "$GITHUB_WORKSPACE/.scratch-artifacts-364"
      - name: cargo test --release -- --ignored concurrency_scales_with_handle_count --nocapture
        env:
          CHTYPES_REGISTRY: ${{ github.workspace }}/.scratch-artifacts-364
        run: cd rust && cargo test --release --test concurrency_throughput -- --ignored --nocapture
      - name: runner core count (nproc), for the printed measurement's context
        run: nproc

  abi-fixtures:
    # ⚠️ THIS JOB IS SEPARATE FROM THE FOUR ABOVE ON PURPOSE. DO NOT FOLD IT
    # BACK INTO THEM — the saving looks real and the cost is invisible.
    #
    # The four no-artifact jobs exist to prove one property, stated in this
    # file's own header: "This is what a contributor with no network and no
    # artifacts gets, and it must be an honest result." `scripts/abi-fixtures.sh`
    # needs no REGISTRY, but it does need the NETWORK — the fixture generator
    # is served, not tracked (`sdk-fetch-fixtures.tar.gz`, through the release's
    # ed25519 signature and sha256 chain). Putting that fetch inside those four
    # would leave them running, and named, exactly as they are today while they
    # had quietly stopped testing the scenario they document: a suite that began
    # requiring the host in order to pass would no longer be caught by the only
    # thing watching for it. That is the same shape as the regression this job
    # exists to prevent — a check that still runs but no longer means what its
    # name says — so buying this coverage with that proof would be a bad trade
    # at any price.
    #
    # WHAT IT COVERS (#105). Each binding's ABI-revision refusal case and its
    # matching-revision control run only when $CHTYPES_ABI_FIXTURES names a
    # fixture set, and until now that variable was set in the `artifacts` job
    # alone. On `integration/rev5` that job is red by design — revision-5
    # bindings, revision-4 published artifacts — and being expected-red is what
    # made it a hiding place: TestABIRevisionMismatchIsRefused broke there (the
    # refusal is a LOAD-time gate, and lazy construction no longer loads),
    # TypeScript carried the identical latent break, and no required check
    # covered either. The fixture pair is generated from include/chtypes.h
    # itself, so it needs no published artifact and this job gates every pull
    # request regardless of what any channel has published.
    #
    # WHY IT RUNS THE WHOLE NO-ARTIFACT SUITE rather than the four cases alone:
    # check-standalone.sh and check-suite.sh ALREADY fail when the variable is
    # set and either case did not RUN and pass, so this job adds no verdict
    # logic of its own. In particular it does not re-implement check-suite.sh's
    # abi_case_ran matcher, whose own comment explains at length why a second,
    # looser copy of it is dangerous rather than merely redundant. The price is
    # that the rest of each suite runs twice per pull request; that is the
    # cheaper half of this trade.
    #
    # It deliberately has no `needs:` and nothing `needs:` it. A failure here
    # withholds no other job's result, and — for the same reason, one level
    # down — its four binding steps carry `continue-on-error` and an `id`,
    # with the verdict at the end, exactly as the `artifacts` job does. That
    # is not symmetry for its own sake: the FIRST version of this job was
    # fail-fast, and the planted-regression run for #105 showed it skipping
    # python, ts and rust the moment Go failed — reproducing, inside the job
    # built to close that blind spot, the very masking the same issue's other
    # half is about. A job whose subject is "all four bindings" must report
    # all four.
    name: "abi-fixtures — the ABI-revision refusal, all four bindings, no published artifact"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # id + continue-on-error so a source outage (fetch.sh exit 3,
      # CHTYPES_SOURCE_UNREACHABLE) can be told apart from every other way
      # this step can fail, in the verdict step below — without either, the
      # job still went red on an outage, but said a binding had not proven
      # its refusal, which is false: no binding ever ran (#182). The step
      # writes its own exit code (never `outcome`, which continue-on-error
      # would already have rewritten to "success") plus the source URL it
      # tried, as outputs, then re-raises so this step's own result is still
      # `failure` and the four bindings below — gated on `outcome ==
      # 'success'` — do not run when there is no fixture for them to use.
      - name: the wrong-revision ABI fixture, built from this header — no published artifact
        id: fixture
        continue-on-error: true
        run: |
          ec=0
          scripts/abi-fixtures.sh --out "$RUNNER_TEMP/abi-fixtures" || ec=$?
          echo "exit_code=$ec" >> "$GITHUB_OUTPUT"
          echo "source_url=${CHTYPES_ARTIFACTS_URL:-https://artifacts.wavehouse.dev}" >> "$GITHUB_OUTPUT"
          if [ "$ec" -ne 0 ]; then
            exit "$ec"
          fi
          echo "CHTYPES_ABI_FIXTURES=$RUNNER_TEMP/abi-fixtures" >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: go — TestABIRevisionMismatchIsRefused and TestABIRevisionControlLoads must both pass
        id: abi-go
        if: steps.fixture.outcome == 'success'
        continue-on-error: true
        run: scripts/check-standalone.sh --no-artifacts

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: python — test_wrong_revision_is_refused and test_matching_revision_loads must both pass
        id: abi-python
        if: steps.fixture.outcome == 'success'
        continue-on-error: true
        run: cd python && uv sync --locked --group dev && cd .. && scripts/check-suite.sh --no-artifacts python

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: ts — both cases under `abi revision fixture` must pass
        id: abi-ts
        if: steps.fixture.outcome == 'success'
        continue-on-error: true
        run: cd ts && pnpm install --frozen-lockfile && pnpm build && cd .. && scripts/check-suite.sh --no-artifacts ts

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: rust — wrong_revision_is_refused and matching_revision_loads must both pass
        id: abi-rust
        if: steps.fixture.outcome == 'success'
        continue-on-error: true
        run: scripts/check-suite.sh --no-artifacts rust

      # Same rule as the `artifacts` job's verdict below, and for the same
      # reason: `outcome`, never `conclusion` — continue-on-error rewrites a
      # failed step's `conclusion` to `success`, so an aggregate that read
      # `conclusion` would pass while a binding's refusal was broken. That is
      # measured, not assumed; it is visible on this repository's own planted
      # run for #105. `skipped` is a failure too: it means the fixture build
      # or a toolchain setup stopped the binding from being checked at all.
      # Three-way, keyed on the fixture step's own exit code (#182) — never on
      # log text. fetch.sh exits exactly 3 for CHTYPES_SOURCE_UNREACHABLE, so
      # that case is told apart from every other way the fixture step can
      # fail without parsing anything:
      #
      #   exit 3        → the artifact source was unreachable; no binding ran.
      #   other nonzero → the fixture generator itself failed; no binding ran.
      #   success       → the four outcomes below decide it, as before.
      #
      # A source outage or a generator failure is reported here directly and
      # never reaches the per-binding table — go/python/ts/rust are gated on
      # `steps.fixture.outcome == 'success'` above and genuinely did not run,
      # so a table of "skipped" would add nothing this text doesn't already
      # say.
      - name: verdict — all four bindings' results, and this job is red if any is not a pass
        if: always()
        env:
          FIXTURE_OUTCOME: ${{ steps.fixture.outcome }}
          FIXTURE_EXIT_CODE: ${{ steps.fixture.outputs.exit_code }}
          FIXTURE_SOURCE_URL: ${{ steps.fixture.outputs.source_url }}
          GO_OUTCOME: ${{ steps.abi-go.outcome }}
          PYTHON_OUTCOME: ${{ steps.abi-python.outcome }}
          TS_OUTCOME: ${{ steps.abi-ts.outcome }}
          RUST_OUTCOME: ${{ steps.abi-rust.outcome }}
        run: |
          if [ "$FIXTURE_OUTCOME" != "success" ]; then
            echo "### abi-fixtures — the fixture never built; no binding was exercised" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            if [ "$FIXTURE_EXIT_CODE" = "3" ]; then
              echo "**The artifact source was unreachable** (\`scripts/abi-fixtures.sh\` exited 3, CHTYPES_SOURCE_UNREACHABLE, fetching the fixture generator from ${FIXTURE_SOURCE_URL:-the artifacts host}). go, python, ts and rust did not run — none of the four proved anything about its ABI-revision refusal." >> "$GITHUB_STEP_SUMMARY"
              echo "abi-fixtures: the artifact source (${FIXTURE_SOURCE_URL:-the artifacts host}) was unreachable while fetching the fixture generator — no binding was exercised" >&2
            else
              echo "**The fixture generator itself failed** (\`scripts/abi-fixtures.sh\` exited ${FIXTURE_EXIT_CODE:-non-zero}, not a source outage). go, python, ts and rust did not run — none of the four proved anything about its ABI-revision refusal." >> "$GITHUB_STEP_SUMMARY"
              echo "abi-fixtures: the fixture generator itself failed (exit ${FIXTURE_EXIT_CODE:-non-zero}) — no binding was exercised" >&2
            fi
            exit 1
          fi

          failed=0
          {
            echo "### abi-fixtures — the ABI-revision refusal, per binding"
            echo
            echo "| binding | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          row() {
            if [ "$2" = "success" ]; then
              printf '| %s | pass |\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            else
              printf '| %s | **%s** |\n' "$1" "$2" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            printf '  %-8s %s\n' "$1" "$2"
          }
          row "go" "$GO_OUTCOME"
          row "python" "$PYTHON_OUTCOME"
          row "ts" "$TS_OUTCOME"
          row "rust" "$RUST_OUTCOME"
          if [ "$failed" -ne 0 ]; then
            echo "abi-fixtures: at least one binding above did not prove its ABI-revision refusal — all four were checked and are reported here and in the step summary" >&2
            exit 1
          fi
          echo "abi-fixtures: all four bindings refused the wrong revision and loaded the matching one"

  artifacts:
    name: "artifacts — published lines, linux-amd64, every suite runs the golden set"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # needs: [abi] only, not [abi, go, python, ts, rust] (which this carried
    # from the hosted-runners-only split, ccd5f4c5, 2026-09-10). None of the
    # five's outputs are read here — no needs.*.outputs, no
    # actions/download-artifact from any of them — so the full five-way fan-
    # in was fail-fast/runner-economy only: skip this job's own fetch and
    # five suites (~150-240s) when a free check already proved the PR
    # broken. #334 (2026-10-01, 6a9f4fb) added `go test -race` to
    # scripts/check-standalone.sh, which the go job also runs standalone;
    # that pushed the go job from ~15-40s to ~65-106s, making it this job's
    # longest wait and delaying this job's own start by the same amount —
    # on top of the (separately raced) go suite this job already runs again
    # for itself below. abi stays: it is the cheapest of the five (~30s)
    # and the one whose failure (header/binding ABI disagreement, a bad FFI
    # declaration) makes a run here least likely to mean anything. Dropping
    # go/python/ts/rust means a broken build/lint/vet/clippy in one of them
    # no longer skips this job — a PR that fails, say, ruff now also burns
    # a full artifacts run in parallel instead of having it skipped — but
    # go, python, ts and rust each remain required checks in their own
    # right (branch protection names them individually, unchanged here);
    # this only moves when the expensive job starts, not what gates a merge.
    needs: [abi]
    env:
      CHTYPES_REGISTRY: ${{ github.workspace }}/.artifacts
      # The channel this job resolves — host and release tag — is an INPUT,
      # never a literal here, for the same reason scripts/published-lines.sh
      # reads the live index instead of hard-coding a line (its own header
      # says why): the day a branch's own channel has content, this job must
      # go green with no workflow edit, nothing to switch back on, nothing to
      # remember (#85). Both variables are optional and both default to
      # empty. They are plain repository variables, not secrets:
      # non-sensitive config, visible to a fork's pull_request run same as
      # everything else in this workflow.
      #
      # CHTYPES_ARTIFACTS_TAG in particular is no longer read directly by the
      # steps below (chtypes#232) — scripts/abi-channel.sh reads it (an
      # explicit value here still wins outright, unconditionally) and is
      # otherwise the one place that decides the tag, from
      # include/chtypes.h's own CHS_ABI_REVISION against what the served
      # channel's index.json actually carries, never a value stored here. A
      # branch whose channel is set but empty of content is NOT skipped: the
      # steps below still run, and published-lines.sh/fetch.sh refuse
      # loudly — honestly red — exactly as they would for any other
      # unpublished line.
      CHTYPES_ARTIFACTS_URL: ${{ vars.CHTYPES_ARTIFACTS_URL }}
      CHTYPES_ARTIFACTS_TAG: ${{ vars.CHTYPES_ARTIFACTS_TAG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This run's channel (chtypes#232): equal to the served channel's own
      # ABI revision, use the default channel exactly as before; the header
      # AHEAD of it, read the artifact producer's signed candidate build for
      # that revision instead — never fail red against a served channel that
      # is refusing the new revision on purpose, which is what happened to
      # every ABI-revision PR before this existed. BEHIND the served
      # channel, or the served channel's own rows disagreeing about their
      # revision, is refused rather than guessed. See scripts/abi-channel.sh's
      # own header for the full decision table; its one log line here says
      # which channel THIS run picked and why — including the ordinary case,
      # header == served, so a green run here is evidence revision 5 was
      # actually checked against revision 5, not merely unexercised.
      - name: this run's artifact channel — the header's ABI revision decides it, never a stored variable
        id: channel
        run: scripts/abi-channel.sh --platform linux-amd64 | tee -a "$GITHUB_OUTPUT"
      # chtypes#320. A machine automating the artifact producer's ABI-
      # revision transition reads THIS job's check-run ANNOTATIONS
      # anonymously, never its log (measured 2026-09-30: the log 403s
      # unauthenticated) — so the channel step's own outputs, above, are
      # worth nothing to it unless they are turned into one here. This is a
      # SEPARATE step rather than appended to the channel step's own `run:`
      # because that step's stdout is captured into $GITHUB_OUTPUT via
      # `tee -a` — a stray `::notice` line piped into that file is not a
      # `key=value` line GitHub Actions can read back. `if: always()`: a
      # channel-step FAILURE (behind/disagreeing/missing, per its own
      # header) must still produce an explicit "unknown" annotation
      # (scripts/lib/gha_annotate.py) rather than leave the reader with
      # nothing — read `outcome`, never `conclusion`, same reasoning as the
      # verdict step's own comment below.
      - name: provenance annotation — the channel this run tested
        if: always()
        env:
          CHANNEL_OUTCOME: ${{ steps.channel.outcome }}
          CHANNEL_TAG: ${{ steps.channel.outputs.tag }}
          CHANNEL_MODE: ${{ steps.channel.outputs.mode }}
          CHANNEL_REVISION: ${{ steps.channel.outputs.revision }}
          CHANNEL_SERVED: ${{ steps.channel.outputs.served }}
        run: |
          if [ "$CHANNEL_OUTCOME" != "success" ]; then
            python3 scripts/lib/gha_annotate.py unknown "the channel (scripts/abi-channel.sh did not complete)"
            exit 0
          fi
          case "$CHANNEL_MODE" in
            default)
              line="channel: the served release (header ABI revision $CHANNEL_REVISION == served $CHANNEL_SERVED)"
              ;;
            candidate)
              line="channel: $CHANNEL_TAG (header ABI revision $CHANNEL_REVISION ahead of served $CHANNEL_SERVED)"
              ;;
            explicit)
              line="channel: explicit tag $CHANNEL_TAG (vars.CHTYPES_ARTIFACTS_TAG), header ABI revision $CHANNEL_REVISION"
              ;;
            *)
              line="channel: unrecognized mode '$CHANNEL_MODE' (tag=$CHANNEL_TAG, revision=$CHANNEL_REVISION)"
              ;;
          esac
          python3 scripts/lib/gha_annotate.py notice "$line"
      # THREE lines, not two. The newest -lts and the newest -stable come from
      # the live index; the third is DERIVED (chtypes#281 item 2) — the OLDEST
      # line this run's channel publishes whose own winning row carries this
      # SDK's ABI revision (scripts/published-lines.sh's own
      # --oldest-at-revision) — because the per-line boundaries are only
      # observable with something below the two leading lines. Both of those
      # sit ABOVE every boundary the SDK documents — `select` back-quoted from
      # 26.3, `from`/`values` from 26.5, header-name matching going
      # case-insensitive at 26.5 — so with only the two leading lines a
      # boundary case cannot be measured at all, only asserted. This used to
      # be the hardcoded line 24.8, which also exercises the path with no
      # show_create_query_identifier_quoting_rule setting (25.3 onward has
      # it); 24.8 is now a retired ("served, unsupported", item 1) line that
      # gets no further ABI revisions, so hand-typing it would eventually ask
      # for a row this release stops publishing at this SDK's revision —
      # never docs/support.md's `supported_lines`, because the question here
      # is "is this line fetchable at this revision", which a retired line
      # can still answer yes to.
      # id + continue-on-error (chtypes#262), same reasoning as the fetch
      # step below: on a candidate channel with nothing published yet,
      # published-lines.sh itself refuses (exit 4, CHTYPES_ARTIFACT_UNPUBLISHED
      # — or exit 3, CHTYPES_SOURCE_UNREACHABLE, for a real outage) BEFORE the
      # fetch step ever runs. Without continue-on-error here, this step used
      # to fail fast with FETCH_EXIT_CODE left empty below, so the verdict's
      # dedicated "no candidate build" branch never matched and every such
      # run printed the generic "fetch itself failed" message instead. This
      # step now records its own exit code and re-raises so it still fails
      # fast; the verdict step reads THIS exit code first, so it can
      # recognize a missing candidate whichever of the two steps hits it.
      - name: the newest -lts and -stable lines the release publishes (live index.json), plus the oldest line still at this run's ABI revision
        id: lines
        continue-on-error: true
        run: |
          tag_args=()
          tag="${{ steps.channel.outputs.tag }}"
          [ -n "$tag" ] && tag_args=(--tag "$tag")
          ec=0
          scripts/published-lines.sh --platform linux-amd64 "${tag_args[@]}" --oldest-at-revision "${{ steps.channel.outputs.revision }}" | tee -a "$GITHUB_OUTPUT" || ec=$?
          echo "exit_code=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" -ne 0 ]; then
            exit "$ec"
          fi
      # Restore-only here; saved from a push to main after a clean fetch
      # (below), for the reason the divergences job's cache step gives (#295).
      # Gated on the lines step's own outcome (chtypes#262): a candidate
      # channel with nothing published leaves steps.lines.outputs.key empty,
      # and restoring under that key would be pointless (never gated before
      # #262 because the step could not yet continue past that failure).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: artifacts-cache
        if: steps.lines.outcome == 'success'
        with:
          path: .artifacts
          key: chtypes-artifacts-linux-amd64-${{ steps.lines.outputs.key }}
      # id + continue-on-error, same reasoning as the abi-fixtures job's
      # fixture step (#182): a source outage here (fetch.sh exit 3,
      # CHTYPES_SOURCE_UNREACHABLE) used to fail this step fast and skip
      # every suite below, whose `always()` verdict then reported the
      # suites and the goldens as not having passed — attributing an
      # infrastructure outage to five results that never ran. This step now
      # records its own exit code (never `outcome`) and the source URL it
      # tried, then re-raises so it still fails fast — nothing below it is
      # gated separately because every step that follows is either cheap
      # toolchain setup or itself fails fast on the same outage before any
      # suite runs, and the verdict below reads this step's exit code first
      # regardless of what, if anything, ran after it.
      #
      # Gated on the lines step's own outcome (chtypes#262): when lines
      # already refused (a candidate channel with nothing published, or a
      # real outage), running this loop over its empty `lines` output would
      # only re-attempt the same failure against an empty list and obscure
      # which step actually hit it first; skipping cleanly here is what lets
      # the verdict step read lines' own exit code instead. All three lines —
      # the two leading ones and the derived oldest (chtypes#281 item 2) —
      # now come from that one step's own `lines=` output; nothing is
      # appended here by name.
      - name: fetch, verified — an already-installed line is re-hashed and not downloaded
        id: fetch
        if: steps.lines.outcome == 'success'
        continue-on-error: true
        run: |
          tag_args=()
          tag="${{ steps.channel.outputs.tag }}"
          [ -n "$tag" ] && tag_args=(--tag "$tag")
          ec=0
          for line in ${{ steps.lines.outputs.lines }}; do
            scripts/fetch.sh "$line" --platform linux-amd64 --dest "$CHTYPES_REGISTRY" "${tag_args[@]}" || { ec=$?; break; }
          done
          echo "exit_code=$ec" >> "$GITHUB_OUTPUT"
          echo "source_url=${CHTYPES_ARTIFACTS_URL:-https://artifacts.wavehouse.dev}" >> "$GITHUB_OUTPUT"
          if [ "$ec" -ne 0 ]; then
            exit "$ec"
          fi
          ls -la "$CHTYPES_REGISTRY"
          cat "$CHTYPES_REGISTRY"/*/manifest.json
          # patches/<minor>/<clickhouse_version>/ (chtypes#284, "Layout
          # rule") does not exist on an ordinary line fetch, only after the
          # two-real-patches step below adds to it — so this is conditional,
          # unlike the flat cat above.
          if compgen -G "$CHTYPES_REGISTRY/patches/*/*/manifest.json" >/dev/null; then
            cat "$CHTYPES_REGISTRY"/patches/*/*/manifest.json
          fi
      - name: save the artifacts cache (push to main only, a clean fetch, and only on a miss)
        if: steps.lines.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.fetch.outputs.exit_code == '0' && steps.artifacts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts
          key: ${{ steps.artifacts-cache.outputs.cache-primary-key }}
      # Best-effort, additive, never gates the job (chtypes#284, design §8,
      # "P18 in CI"): two real patches of one line the channel publishes
      # twice, so each binding's "load a newer patch without restarting"
      # case has real artifacts to drive instead of skipping by name. Both
      # are fetched by EXACT spelling, so both land under patches/<line>/
      # (the cross-binding placement rule: only a line spelling or --all
      # writes the flat slot) unless one happens to already be flat from the
      # per-line fetch above -- a registry's own resolution reads both
      # levels regardless, so this is not a special case for the suites that
      # consume CHTYPES_TWO_PATCHES. `--release-file index.json` re-verifies
      # the release's own listing through the full chain (signature, then
      # index-vs-SHA256SUMS) without installing an artifact, so no new trust
      # surface is added here. Left unset -- never failing this job -- when
      # this run's channel has no line with two patches at its own ABI
      # revision (a revision cutover, a candidate channel that has not yet
      # built a second patch of anything).
      - name: two real patches of one line, for the "load without restarting" cases
        id: two-patches
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        env:
          CHANNEL_REVISION: ${{ steps.channel.outputs.revision }}
        run: |
          tag_args=()
          tag="${{ steps.channel.outputs.tag }}"
          [ -n "$tag" ] && tag_args=(--tag "$tag")
          scripts/fetch.sh --release-file index.json --dest "$RUNNER_TEMP/two-patches-index" "${tag_args[@]}"
          # One physical line, deliberately: a YAML block scalar requires every
          # line of this step's `run:` body to share its indentation, which a
          # multi-line python heredoc cannot also satisfy as valid Python (the
          # two indentation rules conflict) — see the commit that added this
          # for the IndentationError it replaced.
          pair="$(python3 -c 'import json,os,sys; doc=json.load(open(sys.argv[1])); own=int(os.environ["CHANNEL_REVISION"]); rows=[a for a in doc.get("artifacts",[]) if a.get("os")=="linux" and a.get("arch")=="amd64" and a.get("abi_revision")==own]; by_minor={}; [by_minor.setdefault(a["clickhouse_minor"],set()).add(a["clickhouse_version"]) for a in rows]; cands=sorted((m for m in by_minor if len(by_minor[m])>=2), key=lambda m:[int(p) for p in m.split(".")]); print(" ".join(sorted(by_minor[cands[0]], key=lambda v:[int(p) for p in v.split("-",1)[0].split(".")])[-2:])) if cands else None' "$RUNNER_TEMP/two-patches-index/index.json")"
          if [ -n "$pair" ]; then
            older="${pair%% *}"; newer="${pair##* }"
            scripts/fetch.sh "$older" --platform linux-amd64 --dest "$CHTYPES_REGISTRY" "${tag_args[@]}"
            scripts/fetch.sh "$newer" --platform linux-amd64 --dest "$CHTYPES_REGISTRY" "${tag_args[@]}"
            echo "CHTYPES_TWO_PATCHES=$older $newer" >> "$GITHUB_ENV"
            echo "two real patches of one line: $older $newer" >&2
          else
            echo "no line at ABI revision $CHANNEL_REVISION publishes two patches on linux-amd64 in this channel — CHTYPES_TWO_PATCHES left unset; each binding's case skips by name" >&2
          fi
      # Gated on the fetch step's own outcome (#182), same as the five below
      # — the fetch step now carries continue-on-error, so nothing after it
      # skips by default the way it used to on a fail-fast failure there;
      # without this `if:` a source outage would still leave this step (and
      # the five after it) to actually run, against whatever the fetch step
      # managed to put in $CHTYPES_REGISTRY before failing, which is exactly
      # the kind of self-report this fix exists to stop making.
      - name: the wrong-revision ABI fixture, built from this header — every suite must refuse it (#36)
        if: steps.fetch.outcome == 'success'
        run: |
          scripts/abi-fixtures.sh --out "$RUNNER_TEMP/abi-fixtures"
          echo "CHTYPES_ABI_FIXTURES=$RUNNER_TEMP/abi-fixtures" >> "$GITHUB_ENV"
      # chtypes#281 rework. The per-line quoting-boundary test in each binding
      # needs to tell "nothing below the documented boundary is served this
      # run" (genuinely impossible — skip) apart from "something below the
      # boundary IS served, but this run did not load it" (a CI configuration
      # bug — fail). A test cannot see the resolved channel's own index.json
      # to answer that itself: scripts/fetch.sh does not persist it into the
      # registry (only per-line manifests land there), and only scripts/
      # published-lines.sh / scripts/abi-channel.sh ever read the index at
      # all, each into its own temp directory that does not outlive its step.
      # This step derives CHTYPES_SERVED_LINES_AT_REVISION — every line the
      # RESOLVED channel (served, candidate, or an explicit tag — whichever
      # this run picked) serves at this SDK's own ABI revision — from
      # scripts/published-lines.sh's own --served-at-revision, and exports it
      # so every suite below can read it; never hand-typed. Deliberately
      # WITHOUT continue-on-error, unlike the best-effort steps around it:
      # once `fetch` has succeeded, this run's channel has already proven it
      # serves at least the two leading lines and the derived oldest one
      # (the `lines` step above) at this exact revision, so a failure here is
      # a bug in this derivation, not an absence worth tolerating — the
      # artifacts leg must never reach the boundary test without this set.
      - name: every line served at this run's ABI revision (for the quoting-boundary tests' served-vs-loaded distinction)
        id: served-lines
        if: steps.fetch.outcome == 'success'
        run: |
          tag_args=()
          tag="${{ steps.channel.outputs.tag }}"
          [ -n "$tag" ] && tag_args=(--tag "$tag")
          out="$(scripts/published-lines.sh --platform linux-amd64 "${tag_args[@]}" --served-at-revision "${{ steps.channel.outputs.revision }}")"
          served="$(printf '%s\n' "$out" | sed -n 's/^served=//p')"
          echo "CHTYPES_SERVED_LINES_AT_REVISION=$served" >> "$GITHUB_ENV"
          echo "served at ABI revision ${{ steps.channel.outputs.revision }}: $served" >&2

      # ── The five suites below each carry `id:` and `continue-on-error`.
      #
      # WHY (#105). Measured on integration/rev5: this job fails at its GO
      # step, and every later step is SKIPPED — so the python, ts and rust
      # artifact suites and all four examples/ tours had not executed at all
      # for any change in that cycle. One failing suite was withholding four
      # more results, on the branch where all four bindings were being
      # rewritten, and "runnable" was simply unmeasured there.
      #
      # `continue-on-error: true` lets each of the five report; the `verdict`
      # step at the end of this job reads every `outcome` and FAILS THE JOB
      # unless all five succeeded. The point is that five results are
      # reported, never that a failure is tolerated — a green job with a
      # failing suite would be the opposite of this change, and the verdict
      # step exists to make that impossible. Read `outcome`, never
      # `conclusion`: `conclusion` is what continue-on-error rewrote the
      # result to (`success`), `outcome` is what the step actually did.
      #
      # ⚠️ If the fetch or the fixture build did not happen, running the
      # suites proves nothing, so they must not run. The fixture-build step
      # and these five are each gated `if: steps.fetch.outcome == 'success'`
      # (#182) rather than left to fail-fast on their own: `fetch, verified`
      # now carries continue-on-error too, so nothing downstream skips by
      # default the way it used to when that step failed outright, and an
      # explicit gate is what keeps "the suites did not run" true on a
      # source outage instead of merely usual. Skipped this way, the verdict
      # below still reports those five as `skipped`, which it also counts as
      # a failure — but on a fetch failure it never reads them at all; see
      # the verdict's own comment.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: go — standalone check with the registry; TestGoldens must run
        id: suite-go
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: scripts/check-standalone.sh --registry "$CHTYPES_REGISTRY" --require-artifacts
      # Diagnostic, and must not fail this required job — see the `go` job above.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: check-standalone-json-artifacts
          path: scratch/check-standalone.json
          if-no-files-found: ignore
          retention-days: 7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: python — suite with the registry; the golden set must run
        id: suite-python
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: cd python && uv sync --locked --group dev && cd .. && scripts/check-suite.sh --require-artifacts python

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: ts — suite with the registry; the golden set must run
        id: suite-ts
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: cd ts && pnpm install --frozen-lockfile && pnpm build && cd .. && scripts/check-suite.sh --require-artifacts ts

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: rust — suite with the registry; the golden test must run
        id: suite-rust
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: scripts/check-suite.sh --require-artifacts rust

      # The examples are advertised in README.md as four runnable tours, and
      # until now nothing ran them: a signature change in any binding would
      # break its tour with every gate green, and examples/rust/Cargo.lock sat
      # at 0.1.0 through the whole 0.1.1 release because nothing resolved it.
      # This is the only job with an artifact already in hand and all four
      # toolchains already set up, so the marginal cost is one step.
      #
      # BOTH FLAGS ARE LOAD-BEARING. --require-all: chplay SKIPS a missing
      # toolchain, so without it a run where all four skipped exits 0 and
      # proves nothing. --locked: an unlocked resolve silently REWRITES a
      # drifted lockfile and exits 0 — and on a runner that rewrite is thrown
      # away, so the drift would pass forever. Verified by planting the 0.1.0
      # drift back into the lock: --locked exits 1, unlocked exits 0.
      - name: examples — the four tours actually run, on their committed lockfiles
        id: tours
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: examples/chplay.sh --require-all --locked

      # ── This job's actual verdict (#105) ───────────────────────────────
      #
      # Reads each suite step's own `outcome` and exits non-zero unless all
      # five say `success`, so the job's conclusion is exactly what it was
      # before — red when anything is wrong — while all five results are
      # now REPORTED instead of four of them being withheld by the first
      # failure. `skipped` counts as a failure: it means a fail-fast step
      # above stopped the suite from running, which is not a pass.
      #
      # WHY ONE JOB rather than five. Branch protection names required
      # checks by job `name:` — the same trap the lint block below warns
      # about — so splitting this into five jobs would silently drop
      # "artifacts — two published lines, linux-amd64, every suite runs its
      # goldens" from the required list, and leave five new names unrequired
      # until a human edited protection. It also keeps one live-index read,
      # one cache entry and one set of five toolchains rather than five of
      # each. The trade is that the per-suite results are read here instead
      # of in the checks list, which is why this writes them to the run's
      # step summary as well as its log: nobody should have to open a
      # 30-minute job to find out whether the tours ran.
      # Same three-way branch as the abi-fixtures job's verdict, and for the
      # same reason (#182), keyed on the `fetch, verified` step above rather
      # than on any of the five results below: a source outage or a fetch
      # failure there means none of the five ran, and a message that reads
      # the five and reports "not a pass" would be attributing the outage to
      # them. This branch is checked first and, on a non-success fetch,
      # reports and exits before the five are ever read — whatever they
      # individually did, that fetch failure is the reason, not them.
      - name: verdict — all five results, and this job is red if any of them is not a pass
        if: always()
        env:
          LINES_OUTCOME: ${{ steps.lines.outcome }}
          LINES_EXIT_CODE: ${{ steps.lines.outputs.exit_code }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          FETCH_EXIT_CODE: ${{ steps.fetch.outputs.exit_code }}
          FETCH_SOURCE_URL: ${{ steps.fetch.outputs.source_url }}
          CHANNEL_MODE: ${{ steps.channel.outputs.mode }}
          CHANNEL_TAG: ${{ steps.channel.outputs.tag }}
          CHANNEL_REVISION: ${{ steps.channel.outputs.revision }}
          GO_OUTCOME: ${{ steps.suite-go.outcome }}
          PYTHON_OUTCOME: ${{ steps.suite-python.outcome }}
          TS_OUTCOME: ${{ steps.suite-ts.outcome }}
          RUST_OUTCOME: ${{ steps.suite-rust.outcome }}
          TOURS_OUTCOME: ${{ steps.tours.outcome }}
        run: |
          if [ "$LINES_OUTCOME" != "success" ] || [ "$FETCH_OUTCOME" != "success" ]; then
            echo "### artifacts — the fetch itself did not complete; nothing below ran" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            # chtypes#262: whichever of `lines` (scripts/published-lines.sh)
            # or `fetch` (scripts/fetch.sh) actually hit the failure carries
            # the exit code and tool name that matter — `lines` runs first
            # and has no continue-on-error's worth of downstream dependency
            # on `fetch` having run at all, so a candidate channel with
            # nothing published can be refused by EITHER script first, and
            # this has to recognize it whichever one does (previously only
            # FETCH_EXIT_CODE was read here, which stayed empty whenever
            # `lines` was the one that failed, so every such run fell through
            # to the generic "fetch itself failed" message below instead).
            if [ "$LINES_OUTCOME" != "success" ]; then
              FAILED_TOOL="scripts/published-lines.sh"
              FAILED_EXIT_CODE="$LINES_EXIT_CODE"
              FAILED_SOURCE_URL="${CHTYPES_ARTIFACTS_URL:-https://artifacts.wavehouse.dev}"
            else
              FAILED_TOOL="scripts/fetch.sh"
              FAILED_EXIT_CODE="$FETCH_EXIT_CODE"
              FAILED_SOURCE_URL="$FETCH_SOURCE_URL"
            fi
            # chtypes#232: on the candidate channel, exit 3
            # (CHTYPES_SOURCE_UNREACHABLE) and exit 4
            # (CHTYPES_ARTIFACT_UNPUBLISHED) both mean the SAME thing here —
            # the artifact producer has not (yet) published a candidate for
            # this header's revision. That is a DIFFERENT red from the one
            # this mechanism exists to remove (every served library
            # correctly refusing a revision it doesn't speak, which is why a
            # revision-ahead PR used to be expected-red for its whole life).
            # This one must still fail, loudly, naming the tag and the
            # revision: never skip, never fall back to the served channel —
            # a silent fallback there is exactly the kind of masking that let
            # a broken refusal hide once already (the abi-fixtures job's own
            # header, #105).
            if [ "$CHANNEL_MODE" = "candidate" ] && { [ "$FAILED_EXIT_CODE" = "3" ] || [ "$FAILED_EXIT_CODE" = "4" ]; }; then
              echo "**No candidate build for revision $CHANNEL_REVISION** — \`$FAILED_TOOL\` exited $FAILED_EXIT_CODE reading the \`$CHANNEL_TAG\` channel (source: ${FAILED_SOURCE_URL:-the artifacts host}). The artifact producer has not published a candidate for revision $CHANNEL_REVISION yet. No suite and no example tour was exercised — this does not fall back to the served channel." >> "$GITHUB_STEP_SUMMARY"
              echo "artifacts: the artifact producer has not published a candidate for revision $CHANNEL_REVISION (\`$CHANNEL_TAG\`, $FAILED_TOOL exit $FAILED_EXIT_CODE) — no suite or example tour was exercised, and this never falls back to the served channel" >&2
            elif [ "$FAILED_EXIT_CODE" = "3" ]; then
              echo "**The artifact source was unreachable** (\`$FAILED_TOOL\` exited 3, CHTYPES_SOURCE_UNREACHABLE, fetching the published lines from ${FAILED_SOURCE_URL:-the artifacts host}). No suite and no example tour was exercised." >> "$GITHUB_STEP_SUMMARY"
              echo "artifacts: the artifact source (${FAILED_SOURCE_URL:-the artifacts host}) was unreachable while fetching the published lines — no suite or example tour was exercised" >&2
            else
              echo "**\`$FAILED_TOOL\` itself failed** (exit ${FAILED_EXIT_CODE:-non-zero}, not a source outage). No suite and no example tour was exercised." >> "$GITHUB_STEP_SUMMARY"
              echo "artifacts: $FAILED_TOOL failed (exit ${FAILED_EXIT_CODE:-non-zero}) — no suite or example tour was exercised" >&2
            fi
            # chtypes#320: none of the four suites below ran at all, so none
            # of them printed its own provenance (scripts/lib/provenance.py
            # never got invoked) — a machine reading only this job's
            # annotations must see that named explicitly, never silence,
            # which it would otherwise read as indistinguishable from "ran
            # clean, nothing to warn about".
            for lang in go python ts rust; do
              python3 scripts/lib/gha_annotate.py unknown "$lang suite (the fetch did not complete; see the step summary above)"
            done
            exit 1
          fi

          failed=0
          {
            echo "### artifacts — five results, reported whatever any one of them did"
            echo
            echo "| suite | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          row() {
            if [ "$2" = "success" ]; then
              printf '| %s | pass |\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            else
              printf '| %s | **%s** |\n' "$1" "$2" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            printf '  %-16s %s\n' "$1" "$2"
          }
          row "go" "$GO_OUTCOME"
          row "python" "$PYTHON_OUTCOME"
          row "ts" "$TS_OUTCOME"
          row "rust" "$RUST_OUTCOME"
          row "examples tours" "$TOURS_OUTCOME"
          if [ "$failed" -ne 0 ]; then
            echo "artifacts: at least one of the five above is not a pass — every one of them ran and is reported here and in the step summary" >&2
            exit 1
          fi
          echo "artifacts: all five passed"

  api-surface:
    # NON-BLOCKING, on purpose (chtypes#285 §1), and deliberately not a
    # required check: a pull request that changes a binding's exported API on
    # purpose is not wrong, only a manual merge, so it must not show red.
    # This job MEASURES. For each binding whose source the diff touches it
    # compares the pull request's merge base with main (never main's tip)
    # against its head, with one pinned tool per binding, and prints one
    # verdict line per binding into this job's log:
    #
    #   chtypes-api-surface binding=<b> head=<sha> changed=<true|false|error>
    #
    # scripts/policy-merge-check.py reads those lines, and a pull request that
    # touches binding source enqueues itself only on that binding's
    # `changed=false`. Before any verdict, every tool must pass its fixture
    # proof on tests/fixtures/api-surface/ (an addition, a removal and a
    # signature change read changed; an unexported change reads unchanged).
    # A tool that fails either way turns the job red, and a red job's log is
    # never read for a verdict — so a broken tool holds every binding's
    # source for a human, which is the safe side to fail on. The tools,
    # their pins, and why none of them runs anything from the judged head are
    # in scripts/api-surface.py's own header.
    #
    # The two commits compared come from the event, as data through env: the
    # pull request's base and head, or a merge group's. A push to main or a
    # dispatch has neither, so it runs the fixture proofs alone; that keeps
    # main showing the tools work, and it is the only run that may save the
    # tool cache (#295's rule, the same as the artifacts cache above).
    name: "api-surface — every touched binding's exported API, merge base against head (report only)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the merge base, and both commits' trees, are read
          # from git (`git archive`), never checked out.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      # Stable, for `cargo install cargo-public-api`; the pinned nightly that
      # tool needs for rustdoc JSON is installed by the script itself.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      # The installed tools (apidiff, cargo-public-api), each under a
      # directory named by its pinned version. Restore-only here; saved from
      # a push to main (below). A changed script restores the newest older
      # entry and installs only what that entry lacks.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: api-tools
        with:
          path: ~/.cache/chtypes/api-surface
          key: chtypes-api-surface-tools-${{ hashFiles('scripts/api-surface.py') }}
          restore-keys: chtypes-api-surface-tools-
      - name: selftest — the verdict lines round-trip through the checker's reader, and a missing or failing tool is never `changed=false`
        run: scripts/api-surface.py --selftest
      - name: every tool's fixture proof, then one verdict per touched binding (merge base against head)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: scripts/api-surface.py run --base "$BASE_SHA" --head "$HEAD_SHA" --tools "$HOME/.cache/chtypes/api-surface"
      - name: save the tool cache (push to main only, and only on an exact miss)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.api-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chtypes/api-surface
          key: ${{ steps.api-tools.outputs.cache-primary-key }}

  # ── Lint / supply-chain jobs below ─────────────────────────────────
  #
  # All additive: none of the jobs above gained a `needs:` on any of these,
  # and none of these renames a job above — branch protection names checks
  # by job `name:`, and renaming one of the six above would silently drop it
  # from the required-checks list. Every tool here is installed directly
  # (`go install` at a pinned version, `pnpm dlx <pkg>@<version>`, `uvx
  # <pkg>==<version>`, `cargo install --locked`) rather than through a new
  # third-party Action, so no new `uses:` entries — and no new SHAs to
  # pin — were needed beyond the ones this workflow already carries.
  #
  # `lint-go`, `lint-ts`, `lint-actions` and `misspell` are BLOCKING (once
  # someone adds their job names to branch protection's required-checks
  # list — this PR cannot do that itself) because each one is clean on this
  # tree today; `prose` and `security` are deliberately NOT, for reasons in
  # their own comments below.
  lint-go:
    name: "lint-go — golangci-lint (go/.golangci.yml)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      # The official action downloads a PREBUILT binary and caches it. The
      # previous step ran `go install`, which COMPILES golangci-lint from source
      # on every run — about two minutes of build before any linting, and the
      # only step in this workflow that does sustained compilation of a
      # third-party tree. A run failed here on 2026-09-11 having logged nothing
      # from the step and with its post-step skipped, which is a runner abort
      # rather than a lint finding; it passed on rerun with no code change.
      # Removing the compile removes that surface.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: go
          args: --timeout 5m ./...

  lint-ts:
    name: "lint-ts — biome (ts/biome.json)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: biome lint
        run: cd ts && pnpm dlx @biomejs/biome@2.5.13 lint .

  lint-actions:
    name: "lint-actions — actionlint + shellcheck"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: actionlint (workflows) + shellcheck (every tracked *.sh) — ubuntu-latest ships shellcheck
        run: scripts/lint-actions.sh

  misspell:
    name: "misspell — American spelling, whole tree (scripts/lint-spelling.sh)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Covers every tracked file (all four SDKs' source, docs, examples,
    # scripts, include/chtypes.h, the root governance files) except
    # `**/fixtures/fetch/**` (generated + ed25519-signed; editing it
    # invalidates every signature) and `LICENSE`. Two independent checks —
    # `misspell -locale US` and a from-scratch grep pass — because misspell's
    # own dictionary matcher has been shown to silently miss specific words
    # even when they're present in its built-in list; see the long comment
    # at the top of scripts/lint-spelling.sh for the proof, and run
    # `scripts/lint-spelling.sh --selftest` to re-verify it locally.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: prove the check itself catches what misspell alone misses
        run: scripts/lint-spelling.sh --selftest
      - name: misspell -locale US + wordlist grep, whole tree
        run: scripts/lint-spelling.sh

  public:
    # BLOCKING, and a pure function of the diff. This repository is public; a
    # pointer into the private core repository is a dead end for every reader
    # who is not us, and so is a path that is not in this repository at all.
    # lint-public's rules are two literal strings with no allowlist; lint-cited-paths
    # resolves every cited repository path and fails on the ones that are not
    # there. Each script's header says why it exists and what to write instead.
    name: "public — no pointers into the private repository"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The selftest runs FIRST and in the same job: a rule that matches
      # nothing passes silently, which is the exact failure this check exists
      # to prevent, so prove both rules fire before trusting either verdict.
      - run: scripts/lint-public.sh --selftest
      - run: scripts/lint-public.sh
      # The other half of the same failure. lint-public catches the private
      # repository by NAME; lint-cited-paths catches a citation of a path that is
      # simply not here — which is how one proposals document that this
      # repository does not contain was cited six times, from the C header and
      # all four bindings' source, every one of which ships inside a published
      # package. Selftest first, same reason.
      - run: scripts/lint-cited-paths.sh --selftest
      - run: scripts/lint-cited-paths.sh
      # scripts/index-diff.sh (the read-back of the served artifacts index,
      # .github/workflows/artifacts-readback.yml) has no other CI coverage,
      # and its own elision selftest reads a live needle from THIS job's own
      # `scripts/lint-public.sh --print-rules` — never a hand-copied one, the
      # same discipline that script's header already argues for at length —
      # so its selftest belongs here rather than in a fifth job. Needs no
      # network and no artifact: every fixture channel it compares is one it
      # builds itself, including the --keep-current case.
      - run: scripts/index-diff.sh --selftest
      # scripts/readback-decide.sh (the same workflow's post-or-skip /
      # advance-or-not decision, chtypes#270) is a pure function of an exit
      # code and two small text files — no network, no artifact — so it
      # belongs beside index-diff.sh's own selftest above rather than in a
      # fifth job.
      - run: scripts/readback-decide.sh --selftest
      # scripts/support-matrix.sh's Support column (chtypes#281) has its own
      # selftest too, and it belongs here rather than in `docs`: `docs` is
      # NON-BLOCKING (see its own header) because the matrix names whatever
      # ClickHouse lines the release happens to publish, a cross-repo event
      # this repository cannot fix by itself — but a REGRESSION in the
      # GENERATOR itself is exactly this repository's own fault, and
      # `continue-on-error` would let one merge silently. Needs no network
      # and no served index: it builds a throwaway fixture repo and a
      # file://-served index itself, against this very script.
      - run: scripts/support-matrix.sh --selftest

  prose:
    # BLOCKING. It was report-only while the tree was still hard-wrapped, which
    # was a reason to format the tree rather than to exempt the rule. dprint fmt
    # has since run over all 40 files, markdownlint's config now scopes MD010 to
    # prose (tabs are correct inside Go code blocks) and cedes table style to
    # dprint, and the 35 genuine findings are fixed. Both checks pass, so both
    # gate. Unlike `docs` and `security`, this check is a pure function of the
    # diff: nothing outside the repository can turn it red.
    name: "prose — markdownlint + no-hard-wrap (dprint textWrap never)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: markdownlint-cli2 (.markdownlint.json)
        run: pnpm dlx markdownlint-cli2@0.18.1
      - name: dprint check — prose-wrap never (dprint.json)
        run: pnpm dlx dprint@0.57.4 check

  security:
    name: "security — dependency vulnerability scan, all four ecosystems (report only)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NON-BLOCKING, on purpose. A scanner that reddens `main` the moment a
    # fresh upstream advisory lands against a pinned dependency — with no
    # patched version published yet, and no source change this repository
    # can make in the hour it happened — is a cost with no matching benefit:
    # it blocks every unrelated PR until someone either bumps to a version
    # that does not exist yet or adds a time-pressured ignore entry. Each
    # scan still runs every push and PR, and still fails its OWN step (so
    # the finding shows up loudly on the run, color and all) — only the
    # job's overall result is prevented from reddening the required checks.
    # "Nobody has to go looking" is the goal here, not "nothing can ever
    # merge while an advisory exists somewhere in the dependency graph."
    # All four scans ran clean on 2026-09-11.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      # Each of the four scanner steps below carries its own `id:` and
      # `continue-on-error: true` (#226): without them, the first ecosystem
      # to fail ended the job right there and the other three never even
      # ran, so a single stale advisory in one ecosystem silently hid the
      # other three's results. The verdict step at the end of this job reads
      # every step's own `outcome` (never `conclusion`, which
      # continue-on-error rewrites a failed step's result to `success`) and
      # fails on any `failure`, so all four report on every run.
      - name: govulncheck (go)
        id: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          cd go && "$(go env GOPATH)/bin/govulncheck" ./...

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: "pip-audit (python) — python 3.12, pinned: pip-audit's own venv bootstrap is flaky on very new interpreters"
        id: pip-audit
        continue-on-error: true
        run: |
          cd python
          uv export --no-hashes --group dev | grep -v '^-e ' > /tmp/requirements-audit.txt
          uvx --python 3.12 pip-audit==2.10.1 -r /tmp/requirements-audit.txt

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: pnpm audit (ts)
        id: pnpm-audit
        continue-on-error: true
        run: cd ts && pnpm install --frozen-lockfile && pnpm audit

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: cargo audit (rust)
        id: cargo-audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cd rust && "$HOME/.cargo/bin/cargo-audit" audit

      - name: verdict — all four scanners' outcomes, and this step is red if any is `failure`
        if: always()
        env:
          GO_OUTCOME: ${{ steps.govulncheck.outcome }}
          PYTHON_OUTCOME: ${{ steps.pip-audit.outcome }}
          TS_OUTCOME: ${{ steps.pnpm-audit.outcome }}
          RUST_OUTCOME: ${{ steps.cargo-audit.outcome }}
        run: |
          names=("govulncheck (go)" "pip-audit (python)" "pnpm audit (ts)" "cargo audit (rust)")
          outcomes=("$GO_OUTCOME" "$PYTHON_OUTCOME" "$TS_OUTCOME" "$RUST_OUTCOME")

          {
            echo "### security — dependency vulnerability scan, per ecosystem"
            echo
            echo "| scanner | outcome |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Red unless EVERY scanner's outcome is exactly `success`. A scanner can
          # read `skipped` (a setup step before it broke) or be stopped mid-run, and
          # neither of those is a clean scan.
          not_ok=()
          for i in "${!names[@]}"; do
            printf '| %s | %s |\n' "${names[$i]}" "${outcomes[$i]:-<empty>}" >> "$GITHUB_STEP_SUMMARY"
            if [ "${outcomes[$i]}" != "success" ]; then
              not_ok+=("${names[$i]}=${outcomes[$i]:-<empty>}")
            fi
          done

          if [ "${#not_ok[@]}" -gt 0 ]; then
            echo "security: not every scanner succeeded: ${not_ok[*]}" >&2
            exit 1
          fi
          echo "security: all four scanners ran and succeeded"
