# ci — the SDK repository's own gate, on GitHub's hosted runners only.
#
# This repository is public and its CI is deliberately small — the bindings,
# and how to use them — with no repository variable, no secret, and no
# runner of our own. It runs every suite twice, on ubuntu-latest:
#
#   1. WITHOUT artifacts (the go / python / ts / rust jobs). Every binding
#      builds, lints and type-checks; the header and the four bindings agree
#      on the ABI revision; each suite runs with nothing on the artifact
#      search path — the fetch/verify/install contract against
#      spec/fixtures/fetch, the CLIs and the pure units all RUN, and every
#      test that needs an artifact SKIPS, loudly, by name, naming the one
#      command that would fill the gap. This is what a contributor with no
#      network and no artifacts gets, and it must be an honest result.
#
#   2. WITH two published artifacts (the artifacts job, after 1 is green).
#      The newest -lts and the newest -stable line the public release
#      publishes for linux-amd64 — read from the live index.json, never
#      hard-coded — are fetched by scripts/fetch.sh exactly as a consumer
#      fetches them (anonymous, signed, every hash checked), cached on a key
#      derived from those two index rows so nothing downloads until the
#      release changes, and the same suites then RUN the golden set and the
#      registry tests against them. This is "does the published SDK work
#      with the published artifacts", kept small on purpose: two lines, the
#      SDK's own tests. The bulk proof — the server-truth suites, the oracle,
#      the rigs, every supported line — is the core repository's certify
#      workflow, against this same tree.
#
# A suite that skipped everything is not a pass, in either run:
# scripts/check-suite.sh and scripts/check-standalone.sh read each runner's
# own summary line (colour stripped) and refuse zero tests passed; with
# --require-artifacts they also refuse a golden set that did not run. Nothing
# in this file computes a verdict; every step runs a script or a test runner
# whose own output is the answer.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abi:
    name: "abi — the header and every binding agree"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: the header and every binding agree on the ABI revision
        run: |
          rev="$(sed -n 's/^#define CHS_ABI_REVISION \([0-9][0-9]*\)$/\1/p' include/chtypes.h)"
          test -n "$rev"
          grep -q "^const ABIRevision = $rev$" go/chtypes/chtypes.go
          grep -qE "ABI_REVISION(: Final)? = $rev" python/src/chtypes/_native.py
          grep -qE "ABI_REVISION = $rev" ts/src/*.ts
          grep -qE "ABI_REVISION: i32 = $rev" rust/src/*.rs
          echo "ABI revision $rev agreed by the header and four bindings"

  go:
    name: "go — build, vet, standalone check (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: build and vet, dlopen-only
        run: cd go && go build ./... && go vet ./...
      - name: standalone check — a bare copy builds, the linked API is absent, the suite's census
        run: scripts/check-standalone.sh --no-artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-standalone-json-no-artifacts
          path: scratch/check-standalone.json
          if-no-files-found: ignore
          retention-days: 14

  python:
    name: "python — ruff, import, suite (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: ruff, and the package imports
        run: |
          cd python && uv sync --group dev && uv run ruff check src tests && uv run ruff format --check src tests
          uv run python -c 'import chtypes; print("chtypes", chtypes.ABI_REVISION)'
      - name: suite — the artifact tests skip by name, the rest runs
        run: scripts/check-suite.sh --no-artifacts python

  ts:
    name: "ts — build, typecheck, suite (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: build and typecheck
        run: cd ts && pnpm install --frozen-lockfile && pnpm build && pnpm typecheck
      - name: suite — the artifact tests skip by name, the rest runs
        run: scripts/check-suite.sh --no-artifacts ts

  rust:
    name: "rust — build, clippy, fmt, suite (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: build, clippy, fmt
        run: cd rust && cargo build --locked && cargo clippy --locked --all-targets -- -D warnings && cargo fmt --check
      - name: suite — the artifact tests skip by name, the rest runs
        run: scripts/check-suite.sh --no-artifacts rust

  artifacts:
    name: "artifacts — two published lines, linux-amd64, every suite runs its goldens"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [abi, go, python, ts, rust]
    env:
      CHTYPES_REGISTRY: ${{ github.workspace }}/.artifacts
    steps:
      - uses: actions/checkout@v7
      - name: the newest -lts and -stable lines the release publishes (live index.json)
        id: lines
        run: scripts/published-lines.sh --platform linux-amd64 | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .artifacts
          key: chtypes-artifacts-linux-amd64-${{ steps.lines.outputs.key }}
      - name: fetch, verified — an already-installed line is re-hashed and not downloaded
        run: |
          for line in ${{ steps.lines.outputs.lines }}; do
            scripts/fetch.sh "$line" --platform linux-amd64 --dest "$CHTYPES_REGISTRY"
          done
          ls -la "$CHTYPES_REGISTRY"
          cat "$CHTYPES_REGISTRY"/*/manifest.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: go — standalone check with the registry; TestGoldens must run
        run: scripts/check-standalone.sh --registry "$CHTYPES_REGISTRY" --require-artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-standalone-json-artifacts
          path: scratch/check-standalone.json
          if-no-files-found: ignore
          retention-days: 14

      - uses: astral-sh/setup-uv@v7
      - name: python — suite with the registry; the golden set must run
        run: cd python && uv sync --group dev && cd .. && scripts/check-suite.sh --require-artifacts python

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: ts — suite with the registry; the golden set must run
        run: cd ts && pnpm install --frozen-lockfile && pnpm build && cd .. && scripts/check-suite.sh --require-artifacts ts

      - uses: dtolnay/rust-toolchain@stable
      - name: rust — suite with the registry; the golden test must run
        run: scripts/check-suite.sh --require-artifacts rust
