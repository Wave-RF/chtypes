# ci — the SDK repository's own gate, on GitHub's hosted runners only.
#
# This repository is public and its CI is deliberately small — the bindings,
# and how to use them — with no secret and no runner of our own. The only
# repository variables are CHTYPES_ARTIFACTS_URL and CHTYPES_ARTIFACTS_TAG
# (both optional, both plain non-secret config — visible to a fork's
# pull_request run same as everything else here), which point the
# `artifacts` job at a channel other than the rolling release; see that
# job's own comment for why. It runs every suite twice, on ubuntu-latest:
#
#   1. WITHOUT artifacts (the go / python / ts / rust jobs). Every binding
#      builds, lints and type-checks; the header and the four bindings agree
#      on the ABI revision; each suite runs with nothing on the artifact
#      search path — the fetch/verify/install contract against
#      spec/fixtures/fetch, the CLIs and the pure units all RUN, and every
#      test that needs an artifact SKIPS, loudly, by name, naming the one
#      command that would fill the gap. This is what a contributor with no
#      network and no artifacts gets, and it must be an honest result.
#
#   2. WITH two published artifacts (the artifacts job, after 1 is green).
#      The newest -lts and the newest -stable line the public release
#      publishes for linux-amd64 — read from the live index.json, never
#      hard-coded — are fetched by scripts/fetch.sh exactly as a consumer
#      fetches them (anonymous, signed, every hash checked), cached on a key
#      derived from those two index rows so nothing downloads until the
#      release changes, and the same suites then RUN the golden set and the
#      registry tests against them. This is "does the published SDK work
#      with the published artifacts", kept small on purpose: two lines, the
#      SDK's own tests. Which release this job reads is itself an input —
#      CHTYPES_ARTIFACTS_URL / CHTYPES_ARTIFACTS_TAG, unset by default and
#      then identical to today — so a branch built against a different ABI
#      revision can point at its own channel with no workflow edit (#85).
#      The bulk proof — the server-truth suites, the oracle, the rigs, every
#      supported line — is the core repository's sdk-suites workflow,
#      against this same tree.
#
# A suite that skipped everything is not a pass, in either run:
# scripts/check-suite.sh and scripts/check-standalone.sh read each runner's
# own summary line (color stripped) and refuse zero tests passed; with
# --require-artifacts they also refuse a golden set that did not run. Nothing
# in this file computes a verdict; every step runs a script or a test runner
# whose own output is the answer.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abi:
    name: "abi — the header and every binding agree"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the header and every binding agree on the ABI revision
        run: |
          rev="$(sed -n 's/^#define CHS_ABI_REVISION \([0-9][0-9]*\)$/\1/p' include/chtypes.h)"
          test -n "$rev"
          grep -q "^const ABIRevision = $rev$" go/chtypes/chtypes.go
          grep -qE "ABI_REVISION(: Final)? = $rev" python/src/chtypes/_native.py
          grep -qE "ABI_REVISION = $rev" ts/src/*.ts
          grep -qE "ABI_REVISION: i32 = $rev" rust/src/*.rs
          echo "ABI revision $rev agreed by the header and four bindings"
      # An agreed revision NUMBER proves nothing about the declarations it is
      # supposed to stand for, which is exactly how a nine-parameter typedef
      # for a ten-parameter symbol passed all twelve required checks. The step
      # below generates the prototype table from include/chtypes.h and asserts
      # every binding's own FFI declaration against it — parameter count AND
      # each parameter's type.
      #
      # It belongs in THIS job, not in the artifacts leg: an artifact-gated
      # check would not have caught this one and will not catch the next,
      # because while published artifacts are revision 4 the bindings refuse
      # at load and a wrong declaration is never exercised. This job runs on
      # every pull request with nothing but a checkout.
      #
      # The selftest runs FIRST and in the same job, the precedent
      # scripts/lint-public.sh set: it plants a wrong arity AND a wrong type in
      # every binding and requires each to be caught, because a check that has
      # only ever passed is not known to work.
      - name: selftest — a wrong arity and a wrong type fire in every binding
        run: scripts/check-abi-decls.py --selftest
      - name: every binding's chs_* declaration matches the header's prototype
        run: scripts/check-abi-decls.py

  docs:
    name: "docs — the support matrix still matches what the release serves"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NON-BLOCKING, on purpose, and deliberately not a required check. The
    # matrix names the ClickHouse lines the release publishes, and core adds a
    # line whenever it certifies one — a cross-repo event this repository
    # cannot fix by itself. Blocking here would redden main on somebody else's
    # commit, which is the trade core already refused for fetch-fixtures-check.
    # A warning is the right volume: the docs are stale, nothing is broken.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docs/support.md matches the manifests and the live index
        run: |
          if ! scripts/support-matrix.sh --check; then
            {
              echo "### docs/support.md is stale"
              echo
              echo "The release publishes something \`docs/support.md\` does not name."
              echo "Regenerate and commit:"
              echo
              echo '```sh'
              echo 'scripts/support-matrix.sh'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  go:
    name: "go — build, vet, standalone check (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: build and vet, dlopen-only
        run: cd go && go build ./... && go vet ./...
      - name: standalone check — a bare copy builds, the linked API is absent, the suite's census
        run: scripts/check-standalone.sh --no-artifacts
      # The census JSON is diagnostic: it is how a failure is READ, never how a
      # verdict is reached — scripts/check-standalone.sh already decided, and
      # this job's result does not depend on the upload landing. So the upload
      # must not be able to fail a REQUIRED check. On 2026-09-13 the org's
      # Actions artifact storage filled (97.6% one sibling repository) and every
      # CreateArtifact in the org was refused; without this, `go` and
      # `artifacts` both go red for a reason that has nothing to do with the
      # SDK, and no pull request can land until storage frees days later.
      # A genuine upload failure is still visible: the step itself shows red.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: check-standalone-json-no-artifacts
          path: scratch/check-standalone.json
          if-no-files-found: ignore
          retention-days: 7

  python:
    name: "python — ruff, import, suite (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: ruff, and the package imports
        # ONE COMMAND PER LINE, deliberately. These were a single `&&` chain
        # followed by a second line, and `bash -e` does NOT exit when a command
        # inside an && list fails — only the last one in the list is subject to
        # it. So `ruff check` failed, `ruff format` never ran, and the step's
        # status became that of the LAST line (the import), which passes. This
        # required check reported success while printing E501 errors into its
        # own log, on every run. Measured 2026-09-14: eleven of them, back
        # through at least three commits.
        run: |
          cd python
          uv sync --locked --group dev
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run python -c 'import chtypes; print("chtypes", chtypes.ABI_REVISION)'
      - name: suite — the artifact tests skip by name, the rest runs
        run: scripts/check-suite.sh --no-artifacts python

  ts:
    name: "ts — build, typecheck, suite (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: build and typecheck
        run: cd ts && pnpm install --frozen-lockfile && pnpm build && pnpm typecheck
      - name: suite — the artifact tests skip by name, the rest runs
        run: scripts/check-suite.sh --no-artifacts ts

  rust:
    name: "rust — build, clippy, fmt, suite (no artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: clippy, rustfmt
      - name: build, clippy, fmt
        run: cd rust && cargo build --locked && cargo clippy --locked --all-targets -- -D warnings && cargo fmt --check
      - name: --no-default-features — the configuration docs/install.md tells a consumer to build
        run: cd rust && cargo test --locked --no-default-features && cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: suite — the artifact tests skip by name, the rest runs
        run: scripts/check-suite.sh --no-artifacts rust

  artifacts:
    name: "artifacts — two published lines, linux-amd64, every suite runs its goldens"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [abi, go, python, ts, rust]
    env:
      CHTYPES_REGISTRY: ${{ github.workspace }}/.artifacts
      # The channel this job resolves — host and release tag — is an INPUT,
      # never a literal here, for the same reason scripts/published-lines.sh
      # reads the live index instead of hard-coding a line (its own header
      # says why): the day a branch's own channel has content, this job must
      # go green with no workflow edit, nothing to switch back on, nothing to
      # remember (#85). Both variables are optional and both default to
      # empty, which published-lines.sh and fetch.sh already treat exactly
      # like unset — falling back to their own built-in default, the rolling
      # `artifacts` release at https://artifacts.wavehouse.dev — so on `main`,
      # where neither is set, this job's resolved channel is byte-for-byte
      # what it was before this existed. They are plain repository
      # variables, not secrets: non-sensitive config, visible to a fork's
      # pull_request run same as everything else in this workflow. A branch
      # whose channel is set but empty of content is NOT skipped: the steps
      # below still run, and published-lines.sh/fetch.sh refuse loudly —
      # honestly red — exactly as they would for any other unpublished line.
      CHTYPES_ARTIFACTS_URL: ${{ vars.CHTYPES_ARTIFACTS_URL }}
      CHTYPES_ARTIFACTS_TAG: ${{ vars.CHTYPES_ARTIFACTS_TAG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the newest -lts and -stable lines the release publishes (live index.json)
        id: lines
        run: |
          tag_args=()
          [ -n "$CHTYPES_ARTIFACTS_TAG" ] && tag_args=(--tag "$CHTYPES_ARTIFACTS_TAG")
          scripts/published-lines.sh --platform linux-amd64 "${tag_args[@]}" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts
          key: chtypes-artifacts-linux-amd64-${{ steps.lines.outputs.key }}
      - name: fetch, verified — an already-installed line is re-hashed and not downloaded
        run: |
          tag_args=()
          [ -n "$CHTYPES_ARTIFACTS_TAG" ] && tag_args=(--tag "$CHTYPES_ARTIFACTS_TAG")
          for line in ${{ steps.lines.outputs.lines }}; do
            scripts/fetch.sh "$line" --platform linux-amd64 --dest "$CHTYPES_REGISTRY" "${tag_args[@]}"
          done
          ls -la "$CHTYPES_REGISTRY"
          cat "$CHTYPES_REGISTRY"/*/manifest.json
      - name: the wrong-revision ABI fixture, built from this header — every suite must refuse it (#36)
        run: |
          scripts/abi-fixtures.sh --out "$RUNNER_TEMP/abi-fixtures"
          echo "CHTYPES_ABI_FIXTURES=$RUNNER_TEMP/abi-fixtures" >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: go — standalone check with the registry; TestGoldens must run
        run: scripts/check-standalone.sh --registry "$CHTYPES_REGISTRY" --require-artifacts
      # Diagnostic, and must not fail this required job — see the `go` job above.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: check-standalone-json-artifacts
          path: scratch/check-standalone.json
          if-no-files-found: ignore
          retention-days: 7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: python — suite with the registry; the golden set must run
        run: cd python && uv sync --locked --group dev && cd .. && scripts/check-suite.sh --require-artifacts python

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: ts — suite with the registry; the golden set must run
        run: cd ts && pnpm install --frozen-lockfile && pnpm build && cd .. && scripts/check-suite.sh --require-artifacts ts

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: rust — suite with the registry; the golden test must run
        run: scripts/check-suite.sh --require-artifacts rust

      # The examples are advertised in README.md as four runnable tours, and
      # until now nothing ran them: a signature change in any binding would
      # break its tour with every gate green, and examples/rust/Cargo.lock sat
      # at 0.1.0 through the whole 0.1.1 release because nothing resolved it.
      # This is the only job with an artifact already in hand and all four
      # toolchains already set up, so the marginal cost is one step.
      #
      # BOTH FLAGS ARE LOAD-BEARING. --require-all: chplay SKIPS a missing
      # toolchain, so without it a run where all four skipped exits 0 and
      # proves nothing. --locked: an unlocked resolve silently REWRITES a
      # drifted lockfile and exits 0 — and on a runner that rewrite is thrown
      # away, so the drift would pass forever. Verified by planting the 0.1.0
      # drift back into the lock: --locked exits 1, unlocked exits 0.
      - name: examples — the four tours actually run, on their committed lockfiles
        run: examples/chplay.sh --require-all --locked

  # ── Lint / supply-chain jobs below ─────────────────────────────────
  #
  # All additive: none of the jobs above gained a `needs:` on any of these,
  # and none of these renames a job above — branch protection names checks
  # by job `name:`, and renaming one of the six above would silently drop it
  # from the required-checks list. Every tool here is installed directly
  # (`go install` at a pinned version, `pnpm dlx <pkg>@<version>`, `uvx
  # <pkg>==<version>`, `cargo install --locked`) rather than through a new
  # third-party Action, so no new `uses:` entries — and no new SHAs to
  # pin — were needed beyond the ones this workflow already carries.
  #
  # `lint-go`, `lint-ts`, `lint-actions` and `misspell` are BLOCKING (once
  # someone adds their job names to branch protection's required-checks
  # list — this PR cannot do that itself) because each one is clean on this
  # tree today; `prose` and `security` are deliberately NOT, for reasons in
  # their own comments below.
  lint-go:
    name: "lint-go — golangci-lint (go/.golangci.yml)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      # The official action downloads a PREBUILT binary and caches it. The
      # previous step ran `go install`, which COMPILES golangci-lint from source
      # on every run — about two minutes of build before any linting, and the
      # only step in this workflow that does sustained compilation of a
      # third-party tree. A run failed here on 2026-09-11 having logged nothing
      # from the step and with its post-step skipped, which is a runner abort
      # rather than a lint finding; it passed on rerun with no code change.
      # Removing the compile removes that surface.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: go
          args: --timeout 5m ./...

  lint-ts:
    name: "lint-ts — biome (ts/biome.json)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: biome lint
        run: cd ts && pnpm dlx @biomejs/biome@2.5.13 lint .

  lint-actions:
    name: "lint-actions — actionlint + shellcheck"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: actionlint (workflows) + shellcheck (every tracked *.sh) — ubuntu-latest ships shellcheck
        run: scripts/lint-actions.sh

  misspell:
    name: "misspell — American spelling, whole tree (scripts/lint-prose.sh)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Covers every tracked file (all four SDKs' source, docs, examples,
    # scripts, include/chtypes.h, the root governance files) except
    # `**/fixtures/fetch/**` (generated + ed25519-signed; editing it
    # invalidates every signature) and `LICENSE`. Two independent checks —
    # `misspell -locale US` and a from-scratch grep pass — because misspell's
    # own dictionary matcher has been shown to silently miss specific words
    # even when they're present in its built-in list; see the long comment
    # at the top of scripts/lint-prose.sh for the proof, and run
    # `scripts/lint-prose.sh --selftest` to re-verify it locally.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: prove the check itself catches what misspell alone misses
        run: scripts/lint-prose.sh --selftest
      - name: misspell -locale US + wordlist grep, whole tree
        run: scripts/lint-prose.sh

  public:
    # BLOCKING, and a pure function of the diff. This repository is public; a
    # pointer into the private core repository is a dead end for every reader
    # who is not us, and so is a path that is not in this repository at all.
    # lint-public's rules are two literal strings with no allowlist; lint-paths
    # resolves every cited repository path and fails on the ones that are not
    # there. Each script's header says why it exists and what to write instead.
    name: "public — no pointers into the private repository"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The selftest runs FIRST and in the same job: a rule that matches
      # nothing passes silently, which is the exact failure this check exists
      # to prevent, so prove both rules fire before trusting either verdict.
      - run: scripts/lint-public.sh --selftest
      - run: scripts/lint-public.sh
      # The other half of the same failure. lint-public catches the private
      # repository by NAME; lint-paths catches a citation of a path that is
      # simply not here — which is how one proposals document that this
      # repository does not contain was cited six times, from the C header and
      # all four bindings' source, every one of which ships inside a published
      # package. Selftest first, same reason.
      - run: scripts/lint-paths.sh --selftest
      - run: scripts/lint-paths.sh

  prose:
    # BLOCKING. It was report-only while the tree was still hard-wrapped, which
    # was a reason to format the tree rather than to exempt the rule. dprint fmt
    # has since run over all 40 files, markdownlint's config now scopes MD010 to
    # prose (tabs are correct inside Go code blocks) and cedes table style to
    # dprint, and the 35 genuine findings are fixed. Both checks pass, so both
    # gate. Unlike `docs` and `security`, this check is a pure function of the
    # diff: nothing outside the repository can turn it red.
    name: "prose — markdownlint + no-hard-wrap (dprint textWrap never)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: markdownlint-cli2 (.markdownlint.json)
        run: pnpm dlx markdownlint-cli2@0.18.1
      - name: dprint check — prose-wrap never (dprint.json)
        run: pnpm dlx dprint@0.57.4 check

  security:
    name: "security — dependency vulnerability scan, all four ecosystems (report only)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NON-BLOCKING, on purpose. A scanner that reddens `main` the moment a
    # fresh upstream advisory lands against a pinned dependency — with no
    # patched version published yet, and no source change this repository
    # can make in the hour it happened — is a cost with no matching benefit:
    # it blocks every unrelated PR until someone either bumps to a version
    # that does not exist yet or adds a time-pressured ignore entry. Each
    # scan still runs every push and PR, and still fails its OWN step (so
    # the finding shows up loudly on the run, color and all) — only the
    # job's overall result is prevented from reddening the required checks.
    # "Nobody has to go looking" is the goal here, not "nothing can ever
    # merge while an advisory exists somewhere in the dependency graph."
    # All four scans ran clean on 2026-09-11.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false          # the module is stdlib-only: there is no go.sum to cache
      - name: govulncheck (go)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          cd go && "$(go env GOPATH)/bin/govulncheck" ./...

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: "pip-audit (python) — python 3.12, pinned: pip-audit's own venv bootstrap is flaky on very new interpreters"
        run: |
          cd python
          uv export --no-hashes --group dev | grep -v '^-e ' > /tmp/requirements-audit.txt
          uvx --python 3.12 pip-audit==2.10.1 -r /tmp/requirements-audit.txt

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # No version here on purpose: pnpm/action-setup reads packageManager
          # from ts/package.json, so the pin lives in exactly one place. It used
          # to be pinned twice and the two had already drifted.
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: pnpm audit (ts)
        run: cd ts && pnpm install --frozen-lockfile && pnpm audit

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: cargo audit (rust)
        run: |
          cargo install cargo-audit --locked
          cd rust && "$HOME/.cargo/bin/cargo-audit" audit
