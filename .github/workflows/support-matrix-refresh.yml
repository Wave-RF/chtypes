# support-matrix-refresh — notices when docs/support.md's generated block
# goes stale and puts the fix in front of a human, without a human having to
# remember to look (issue #100).
#
# THE PROBLEM. docs/support.md's ClickHouse-lines table is generated by
# scripts/support-matrix.sh from the release's live index.json. It goes
# stale every time the artifact producer publishes — twice on 2026-09-17/18
# alone. ci.yml's `docs` job already notices, and is DELIBERATELY
# non-blocking (see its own comment there): the matrix names a cross-repo
# event this repository cannot fix by itself, so blocking would redden
# `main` on somebody else's commit. That reasoning does not change here —
# this workflow does not touch that job or its severity. What it fixes is
# that today the remedy depends on someone noticing a red that is designed
# to be ignorable and then remembering one command.
#
# WHY THIS DOES NOT OPEN A PULL REQUEST, EVEN THOUGH ISSUE #100 ASKED FOR
# ONE — READ THIS BEFORE "FIXING" IT. Opening a PR from a workflow needs the
# default GITHUB_TOKEN to be allowed to do so, which is a repository setting
# (Settings → Actions → General → Workflow permissions → "Allow GitHub
# Actions to create and approve pull requests"). Measured on this repository
# on 2026-09-18: that setting is OFF
# (`can_approve_pull_request_reviews: false` via
# GET /repos/Wave-RF/chtypes/actions/permissions/workflow), and reproduced
# directly — a throwaway probe workflow whose job carried
# `permissions: { contents: write, pull-requests: write }` still failed
# `gh pr create` with `GraphQL: GitHub Actions is not permitted to create or
# approve pull requests` (probe PR #103, closed without merging; see issue
# #100 for the full trace). The `permissions:` key cannot grant what this
# toggle withholds.
#
# That toggle is not split into "create" and "approve" halves — enabling it
# to let this workflow open a PR would ALSO let any Actions run in this
# repository approve one, repository-wide, permanently, for every workflow
# this repository will ever add. This repository's merge story rests on
# required checks rather than required human review (branch protection
# requires zero approvals today), and handing an automated identity the
# power to approve trades a large, permanent widening of the trust surface
# for the convenience of skipping one manual command after a warning that
# already tells you the command to run. That is a bad trade on a public
# repository even today, and it stays a bad trade if branch protection ever
# starts requiring real human review, because the grant would still be
# sitting there, silently covering it. This is a considered decision, not an
# oversight — do not flip that toggle to make this workflow open a PR
# instead of failing loudly; introducing a bot PAT/secret to route around it
# is worse, since this repository carries no secret today by design (see
# ci.yml's own header) and that would be its first one, spent on a task the
# built-in token already covers everywhere except this one grant.
#
# WHAT THIS DOES INSTEAD — most of the benefit, none of the grant. When the
# regenerated file differs from what is committed, this workflow:
#   1. writes a per-row summary (old build → new build, and any line that
#      appeared or disappeared) to the run's job summary — the same
#      information issue #100 wanted in a PR body, just read from the run
#      instead of a review queue;
#   2. uploads the regenerated docs/support.md as a run artifact, so
#      applying it is "download and commit", not "re-derive it by hand";
#   3. FAILS the job. This is a scheduled workflow, not a required check —
#      nothing merges any differently because it is red — so failing costs
#      only attention, which is the entire point: a green run nobody opens
#      is exactly today's failure mode, restated.
# When the tree is already current, it says so and exits 0. Quiet stays
# quiet.
#
# CADENCE: daily (17 minutes past the hour — off the hour, so this run does
# not queue behind every other repository's :00 cron on GitHub's shared
# scheduler infrastructure). The producer has published a new build on
# back-to-back days this week, so anything looser than a day reintroduces
# the multi-day staleness window issue #100 is about. Anything tighter
# (hourly) buys nothing: a release is a human-paced event upstream, not a
# continuous one, and would only multiply empty, current-tree runs.
name: support-matrix-refresh
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: support-matrix-refresh
  cancel-in-progress: true
jobs:
  refresh:
    name: "regenerate docs/support.md; summarize + upload + fail if it changed"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: regenerate and compare against what is committed
        id: regen
        run: |
          cp docs/support.md /tmp/support.md.before
          scripts/support-matrix.sh
          if git diff --quiet -- docs/support.md; then
            echo "support-matrix-refresh: docs/support.md is already current — nothing to do"
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: per-row summary of what moved
        if: steps.regen.outputs.changed == '1'
        run: |
          {
            echo "### docs/support.md is stale"
            echo
            echo "\`scripts/support-matrix.sh\` disagrees with what is committed. Changed ClickHouse line(s):"
            echo
            scripts/support-matrix-row-diff.sh /tmp/support.md.before docs/support.md
            echo
            echo "The regenerated file is attached to this run as an artifact —"
            echo "download it and commit it in place of \`docs/support.md\`, or"
            echo "run \`scripts/support-matrix.sh\` locally; both produce the same bytes."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.regen.outputs.changed == '1'
        with:
          name: support-md-regenerated
          path: docs/support.md
          retention-days: 30
      - name: fail loudly — this is a scheduled job, not a gate, so red costs only attention
        if: steps.regen.outputs.changed == '1'
        run: exit 1
