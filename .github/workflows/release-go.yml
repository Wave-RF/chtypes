# release-go — a Go module publishes by being tagged; this only proves the
# tag names a module that builds, and that the tag is the subdirectory form
# `go/v*` the module path (github.com/wave-rf/chtypes/go) requires. pkg.go.dev
# and proxy.golang.org pick the tag up on first fetch.
#
# On this branch the tag selects one of two release modes, and nothing else
# does (scripts/release-channel.sh, THE MODES; #511, #597):
#   - dev, go/v2.0.0-dev.N: a pre-release. Go serves a v2 version only under a
#     module path ending in /v2 (github.com/wave-rf/chtypes/go/v2), so a plain
#     `go get github.com/wave-rf/chtypes/go` keeps resolving the 1.x, and the
#     `never-default` job asserts that against the proxy itself;
#   - stable, go/v2.N.N: `go get github.com/wave-rf/chtypes/go/v2` must resolve
#     it (@latest of the /v2 path), and the same job asserts the opposite.
# The first step refuses any other tag before the toolchain is even installed,
# and a stable tag that is not a dry run unless the maintainer's
# CHTYPES_V2_LOCKED_FP names this module's fingerprint (THE GATE). A Go module
# publishes by the tag existing: this workflow cannot stop a pushed tag (the
# gate then only turns the run red), which is why the order puts Go last.
name: release-go
on:
  push:
    tags: ["go/v*"]
  # A dry run proves the tag name's shape, the module and the build, and then
  # runs the post-publish steps against the LOCAL module (a `replace`) instead of
  # the proxy. verify_only runs just those steps against a published version.
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag name to check, for example go/v1.0.0 (a tag push uses the pushed tag)."
        required: true
        type: string
      dry_run:
        description: "Run every step up to the publish; the post-publish steps then run against the local module instead of the proxy."
        required: false
        type: boolean
        default: true
      verify_only:
        description: "Skip the build and tag checks and run only the post-publish steps against the ALREADY-PUBLISHED version the tag names (proxy install first, with its retry loop). Wins over dry_run."
        required: false
        type: boolean
        default: false
permissions:
  contents: read
# Every run: step uses bash with -eo pipefail. GitHub's default for a step
# with no shell: is `bash -e {0}`, WITHOUT pipefail, so a failing command on
# the left of a pipe was hidden by the exit status of the one on the right.
defaults:
  run:
    shell: bash

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_only
    runs-on: ubuntu-latest
    outputs:
      default: ${{ steps.record.outputs.default }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before anything else: the channel's own selftest, the tag must be a
      # release of this branch (it selects the mode), go/go.mod must declare
      # the module path ending in /v2, and a stable release that is not a dry
      # run must pass THE GATE: the repository variable only the maintainer
      # sets must name the fingerprint this module is built against.
      - name: "the tag selects its mode and is a release of this branch, go/go.mod declares its /v2 module path, and a stable release passes the gate (scripts/release-channel.sh; #511, #597)"
        env:
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          CHTYPES_V2_LOCKED_FP: ${{ vars.CHTYPES_V2_LOCKED_FP }}
        run: |
          scripts/release-channel.sh --selftest
          echo "release mode: $(scripts/release-channel.sh mode go "$TAG")"
          scripts/release-channel.sh tag go "$TAG"
          scripts/release-channel.sh go-module go/go.mod
          scripts/release-channel.sh gate go "$TAG" "$RELEASE_DRY_RUN"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go/go.mod }
      - run: cd go && go build ./... && go vet ./...
      - name: the toolchain reads the same module path, and the module verifies
        run: |
          mod="$(cd go && go list -m)"
          want="$(scripts/release-channel.sh get go "$TAG" GO_MODULE)"
          [ "$mod" = "$want" ] || { echo "::error::go list -m says $mod, the channel releases $want" >&2; exit 1; }
          (cd go && go mod verify)
      # The User-Agent assertion. The fetch layer's `User-Agent` is
      # `chtypes-go/<bindingVersion>`, and Go has no manifest to cross-check
      # that constant against, so a stale one would ship silently. This
      # writes a throwaway test INSIDE the package (userAgent is unexported),
      # drives it with the tag's version, and requires the test to have RUN
      # and passed. It runs on the tag path too, before anything is public.
      - name: the User-Agent version is the version being tagged
        run: |
          version="${TAG#go/v}"
          cat > go/internal/ocifetch/zz_release_useragent_test.go <<'EOF'
          package ocifetch

          import (
          	"os"
          	"testing"
          )

          func TestReleaseUserAgentMatchesTag(t *testing.T) {
          	v := os.Getenv("RELEASE_VERSION")
          	if v == "" {
          		t.Fatal("RELEASE_VERSION is empty")
          	}
          	if got, want := userAgent(), "chtypes-go/"+v; got != want {
          		t.Fatalf("User-Agent is %q, the tag says %q (bump bindingVersion in useragent.go)", got, want)
          	}
          }
          EOF
          out="$(cd go && RELEASE_VERSION="$version" go test ./internal/ocifetch -count=1 -run '^TestReleaseUserAgentMatchesTag$' -v)"
          printf '%s\n' "$out"
          grep -q -- '--- PASS: TestReleaseUserAgentMatchesTag' <<<"$out" || { echo "::error::the User-Agent assertion did not run and pass"; exit 1; }
          rm go/internal/ocifetch/zz_release_useragent_test.go
      # The record the never-default job compares against: what a plain
      # `go get` resolves right now (@latest). The dev mode reads the 1.x path,
      # which must be a stable 1.x: a tag on a /v2 module path cannot move it,
      # and that is exactly what the never-default job asserts. The stable
      # mode reads the /v2 path (its newest dev build until 2.0.0), which the
      # tag must move to this version.
      - name: record what a plain go get resolves before the tag
        id: record
        run: |
          default="$(scripts/release-channel.sh default go "$TAG")"
          echo "@latest of $(scripts/release-channel.sh get go "$TAG" GO_LATEST_MODULE): $default"
          echo "default=$default" >> "$GITHUB_OUTPUT"
  # What a plain `go get` resolves, asserted against the Go proxy itself.
  # Dev mode, "never installed by default": after the tag, `go list -m
  # github.com/wave-rf/chtypes/go@latest` is still the 1.x the verify job
  # recorded, on every read, and github.com/wave-rf/chtypes/go/v2@v2.0.0-dev.N
  # resolves (polled for the proxy, up to 20 minutes). Stable mode, the
  # opposite: github.com/wave-rf/chtypes/go/v2@v2.N.N resolves AND @latest of
  # the /v2 path is that version. A dry run runs the same reads against the
  # proxy as it is now, the twin: @latest is the recorded version, the /v2
  # module does not list this version yet, and the same listing finds the
  # recorded version (its positive control). The twin reads the version LIST,
  # not the version itself, so a dry run never asks the proxy for a tag that
  # does not exist yet. scripts/release-channel.sh holds both modes, and its
  # selftest runs each against recorded proxy answers.
  never-default:
    needs: verify
    if: ${{ !failure() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go/go.mod }
      - name: what a plain go get resolves (dev, still the recorded 1.x; stable, this version), and the /v2 module serves this version (a dry run asserts it against the proxy as it is)
        env:
          RECORDED: ${{ needs.verify.outputs.default }}
          PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'twin' || 'after' }}
        run: |
          version="$(scripts/release-channel.sh tag go "$TAG")"
          scripts/release-channel.sh default-check go "$TAG" "$version" "$RECORDED" "$PHASE"
  # A tag exiting green does not mean anyone can install the package: the Go
  # proxy serves a new tag some minutes after it is pushed. scripts/release-verify.sh
  # installs the PUBLISHED module (the /v2 path) from the public proxy in a
  # clean module, with no credentials, retrying for proxy lag, and proves: the
  # binding's generation-2 fingerprint constant is include/v2/chtypes.h's; the
  # command lists, fetches and loads from the mode's registry (dev: staging
  # chtypes/v2-dev; stable: production chtypes/v2) and no other; and the loaded
  # library reports abi 2 and that fingerprint. A dry run runs the same script
  # against the local module, so every check is proven before the tag exists;
  # a stable dry run does so against the stand-in (the script's header).
  post-publish:
    needs: verify
    if: ${{ !failure() && (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && inputs.verify_only)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go/go.mod }
      - name: the verify script's own selftest (the list parser and every channel check)
        run: scripts/release-verify.sh --selftest
      - name: the module installs, speaks include/v2/chtypes.h's fingerprint, and lists, fetches and loads from the mode's registry only (a stable dry run, from the stand-in)
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.verify_only && 'local' || 'registry' }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.verify_only && 'true' || 'false' }}
        run: |
          version="${TAG#go/v}"
          if [ "$MODE" = local ]; then
            # A stable dry run verifies against the stand-in; the script refuses it on any other run.
            if [ "$(scripts/release-channel.sh mode go "$TAG")" = stable ]; then MODE=standin; fi
            scripts/release-verify.sh go "$MODE" "$version" go
          else
            scripts/release-verify.sh go registry "$version"
          fi
