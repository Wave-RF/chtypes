# release-go — a Go module publishes by being tagged; this only proves the
# tag names a module that builds, and that the tag is the subdirectory form
# `go/v*` the module path (github.com/wave-rf/chtypes/go) requires. pkg.go.dev
# and proxy.golang.org pick the tag up on first fetch.
name: release-go
on:
  push:
    tags: ["go/v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go/go.mod }
      - run: cd go && go build ./... && go vet ./...
      # A publish step exiting 0 does not mean anyone can install the package.
      # Measured on ts/v0.1.1 (issue #10): the job went green ~7 minutes before
      # npm served the tarball, and for ~2 of those minutes `latest` resolved to
      # a version that 404'd. This installs the real thing from the public
      # registry, with no credentials, and makes it report its ABI revision.
      - name: it installs from the public registry and speaks ABI revision
        run: scripts/verify-published.sh go "${GITHUB_REF_NAME#go/v}"
