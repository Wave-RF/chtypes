# dependency-audit - a scheduled daily audit of `main` and `v2` with the same
# four scanners, at the same pinned versions, as ci.yml's report-only
# `security` job, then scripts/audit-issues.py keeps ONE labeled issue per
# advisory (create, update, close).
#
# WHY. The `security` job stays report-only on pull requests (a required scan
# would block unrelated pull requests whenever an upstream advisory lands),
# so a finding there is easy to miss. This workflow makes it visible as an
# issue. A finding never fails the run; a broken scan or script does.
#
# Scheduled runs execute from the default branch, so each audited branch is
# checked out explicitly. On a manual run from any other branch the script is
# forced into --dry-run: it prints the planned issue actions and changes nothing.
name: dependency-audit

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the planned issue actions and change nothing (always on off the default branch)"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-audit
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: "audit — four scanners on main and v2, one issue per advisory"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: self
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trees/main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v2
          path: trees/v2
          persist-credentials: false

      - name: selftest - the issue sync logic, before trusting its verdict
        run: python3 -I self/scripts/audit-issues.py --selftest

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: trees/main/go/go.mod
          cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: trees/main/ts/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch

      - name: install scanners (same pinned versions as ci.yml's security job)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          cargo install cargo-audit --locked

      # Each scanner's exit status is NOT the verdict: pip-audit, pnpm audit and
      # cargo audit exit non-zero on a finding. The script judges each output
      # file (parseable, expected shape) and govulncheck's recorded status.
      - name: scan both branches, JSON out
        env:
          OUT: ${{ github.workspace }}/results
        run: |
          set +e
          for br in main v2; do
            mkdir -p "$OUT/$br"
            tree="$GITHUB_WORKSPACE/trees/$br"
            (cd "$tree/go" && "$(go env GOPATH)/bin/govulncheck" -format json ./... >"$OUT/$br/govulncheck.json"; echo $? >"$OUT/$br/govulncheck.rc")
            (cd "$tree/python" && uv export --no-hashes --group dev | grep -v '^-e ' >"$OUT/$br/requirements.txt" \
              && uvx --python 3.12 pip-audit==2.10.1 -r "$OUT/$br/requirements.txt" --format json -o "$OUT/$br/pip-audit.json")
            (cd "$tree/ts" && pnpm install --frozen-lockfile >/dev/null && pnpm audit --json >"$OUT/$br/pnpm-audit.json")
            (cd "$tree/rust" && "$HOME/.cargo/bin/cargo-audit" audit --json >"$OUT/$br/cargo-audit.json")
          done
          exit 0

      - name: keep one issue per advisory
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          ON_DEFAULT: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          dry=()
          if [ "$EVENT" != "schedule" ] && { [ "$INPUT_DRY_RUN" = "true" ] || [ "$ON_DEFAULT" != "true" ]; }; then
            dry=(--dry-run)
          fi
          python3 -I self/scripts/audit-issues.py --results results --repo "$GITHUB_REPOSITORY" "${dry[@]}"
