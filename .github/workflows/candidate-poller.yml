# candidate-poller — watches the artifact producer's abi<N>-candidate
# channel (N = this tree's own CHS_ABI_REVISION) and, when it moves, dispatches
# ci.yml on any open, same-repository pull request whose OWN
# include/chtypes.h is already at revision N.
#
# WHY. chtypes#232 taught the `artifacts` job to read a candidate channel
# instead of the served one once a pull request's header moves ahead of what
# is published — see scripts/abi-channel.sh's own header. That only helps
# once the candidate build the artifact producer eventually publishes has
# actually been fetched and checked: nothing before this workflow re-ran
# `artifacts` on such a pull request when a candidate first appeared, or
# when it was later republished — a contributor had to notice and dispatch
# it by hand. This closes that: a scheduled poll, cheap and read-mostly, that
# only ever triggers ci.yml's OWN workflow_dispatch trigger — it changes
# nothing about what any check evaluates, exactly as a human clicking "Run
# workflow" on that pull request's branch would.
#
# THE DECISION. Pulled out into scripts/candidate-poll-decide.sh (its own
# header has the exact contract) so it is provable without a live candidate
# channel to poll — there is no candidate channel published today; revision
# 7 will be its first real use:
#
#   1. index: has abi<N>-candidate/index.json moved since the last poll that
#      saw it? A 404 (the host is reachable; there is no such release yet)
#      is NOTHING TO DO, never an error — mirrors chtypes#262's fix to
#      scripts/published-lines.sh. Any other non-200 status IS a real
#      reachability failure, and the fetch step below fails the run loudly
#      rather than letting an outage read as a quiet poll.
#   2. pr: is one open, same-repository (never a fork) pull request's OWN
#      head copy of include/chtypes.h at revision N?
#
# Only when BOTH hold does this dispatch — once, per eligible pull request,
# per index move; an unchanged index or no matching pull request is a quiet,
# green run.
#
# STATE. The last-seen index key (generated_at + sha256 of the fetched
# bytes) lives in the Actions cache, never in the repository — same model
# artifacts-readback.yml already uses for its own baseline: restored every
# run with `actions/cache/restore` under a key unique per save
# (`candidate-poller-state-${{ github.run_id }}`) and
# `restore-keys: candidate-poller-state-` so the newest saved entry wins.
# A run that finds no cache entry at all (first run ever, or the entry aged
# out past the 7-day no-access eviction window) SEEDS a fresh baseline and
# dispatches nothing — the same "seed quietly, act on nothing" contract
# artifacts-readback.yml's own `seed` step follows, so deploying this
# workflow next to an ALREADY-published candidate and an already-matching
# pull request does not fire a dispatch nobody asked for on its very first
# run.
#
# PROVENANCE. Which candidate build was tested, and which pull request it
# was dispatched against, is written to the job summary AND emitted as an
# `::notice` workflow command — VERIFIED readable through the Checks API
# with no log access and no authentication at all, against this exact
# repository: `curl -s https://api.github.com/repos/Wave-RF/chtypes/check-runs/<id>/annotations`
# returned a populated annotations array for a public run with no token.
# A job summary has no equivalent stable public read endpoint, so the
# `::notice` (which GitHub Actions attaches to the step's check run as an
# annotation, the same mechanism that already surfaces the runner-image
# deprecation notice measured on this repository's own checks) is the
# channel a cross-repository reader without log access can actually reach;
# the job summary is written too, for anyone reading the run directly.
#
# PERMISSIONS, AND THE PWN-REQUEST RULE. `actions: write` (dispatch
# ci.yml's workflow_dispatch trigger — the built-in GITHUB_TOKEN is allowed
# to do this), `contents: read` (checkout main; read a pull request's
# include/chtypes.h through the contents API), `pull-requests: read` (list
# open pull requests). No new secret. This workflow never checks out,
# builds, sources or executes anything from a pull request's head: main is
# the only ref checked out, and a head's include/chtypes.h arrives only as
# DATA through the contents API, read for its one #define line and never
# otherwise interpreted — the same discipline scripts/policy-merge-check.py's
# own head_file() already follows for docs/support.md. Every pull-request
# field this workflow reads (branch name, head sha, repository) stays inside
# ONE step's own shell variables, read from `gh api` output via env: at the
# step boundary, never spliced into a `run:` block through a `${{ }}`
# GitHub Actions expression — the actual pwn-request vector, which does not
# exist here regardless (this workflow's trigger is schedule/workflow_dispatch,
# never pull_request or pull_request_target, so no head context is ever
# templated into this file to begin with).
#
# WHY NOT a ci.yml workflow_dispatch input that runs only the `artifacts`
# job. Considered: it would avoid re-running the whole matrix per dispatch.
# Not built here — a dispatch fires only when BOTH the index moved AND a
# matching pull request exists, which is rare (once per relink or candidate
# republish, not once per 30-minute poll), so the saving is small, while
# threading a manual-dispatch skip through every one of ci.yml's other jobs
# — several of which the `artifacts` job's own `needs:` requires to have
# actually SUCCEEDED, not merely run — is real surface in a file
# scripts/policy-merge-check.py's REQUIRED_CHECKS pins by job name. Left for
# a follow-up if the cost is ever measured to matter.
#
# CADENCE: every 30 minutes, offset from the hour and half-hour (same
# reasoning as artifacts-readback.yml's :11/:41 and
# support-matrix-refresh.yml's own off-the-hour slot — this repository's
# scheduled workflows deliberately avoid GitHub's shared :00/:30 scheduler
# crowd). `workflow_dispatch` is also wired in, with no input, so this can be
# exercised on demand once it is on the default branch (scheduled workflows
# only run from there).
name: candidate-poller

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: candidate-poller
  # Never cut off mid-way: a half-finished "dispatched, about to save the new
  # baseline" must not skip the save, or the next scheduled run would
  # re-decide 'moved' against the same old baseline and re-dispatch the same
  # pull request a second time.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  poll:
    name: "poll — dispatch ci.yml on any open, same-repo pull request whose header is at the pending ABI revision, when the candidate build moves"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # Selftest first — the house rule every selftest-carrying gate in this
      # repository follows (see ci.yml's own `abi` job for the precedent):
      # a decision nobody has seen fire is not known to work, and there is
      # no live candidate channel today to exercise it against for real.
      - name: "selftest — candidate-poll-decide.sh (index: absent/seeded/unchanged/moved; pr: open+same-repo+matching-revision only)"
        run: scripts/candidate-poll-decide.sh --selftest

      # The same read scripts/abi-channel.sh's own header_revision() does:
      # exactly one #define line, or refuse to guess.
      - name: this tree's own CHS_ABI_REVISION (N) — the revision a matching pull request's head must carry
        id: revision
        run: |
          rev="$(sed -n 's/^#define CHS_ABI_REVISION \([0-9][0-9]*\)$/\1/p' include/chtypes.h)"
          n="$(printf '%s\n' "$rev" | grep -c . || true)"
          if [ "$n" -ne 1 ]; then
            echo "candidate-poller: include/chtypes.h defines CHS_ABI_REVISION $n time(s) (wanted exactly 1) — refusing to guess" >&2
            exit 1
          fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      # Same state model as artifacts-readback.yml's own baseline restore:
      # unique-per-save key, newest-first restore-keys prefix. A miss
      # (cache-matched-key == '') means no prior state at all.
      - name: restore the last-seen candidate-index key from the Actions cache
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .candidate-poller/state.txt
          key: candidate-poller-state-${{ github.run_id }}
          restore-keys: |
            candidate-poller-state-

      # A 404 here is normal (no candidate published for this revision yet)
      # and is NOT an error — chtypes#262's own fix to
      # scripts/published-lines.sh draws exactly this line. Anything else
      # non-200 is a real reachability failure and fails this run loudly, on
      # purpose: an outage here must never read as a quiet poll.
      - name: fetch the candidate index for this revision
        id: fetch
        env:
          CHTYPES_ARTIFACTS_URL: ${{ vars.CHTYPES_ARTIFACTS_URL }}
          REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          url="${CHTYPES_ARTIFACTS_URL:-https://artifacts.wavehouse.dev}/abi${REVISION}-candidate/index.json"
          code="$(curl -sSL --retry 3 --retry-delay 1 -o body.json -w '%{http_code}' "$url")" || code="000"
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            200)
              generated_at="$(python3 -c 'import json; print(json.load(open("body.json")).get("generated_at",""))')"
              sha256="$(sha256sum body.json | cut -d' ' -f1)"
              echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
              echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
              echo "candidate-poller: abi${REVISION}-candidate/index.json is published — generated_at=$generated_at sha256=$sha256"
              ;;
            404)
              echo "candidate-poller: HTTP 404 at $url — no candidate build for revision $REVISION is published yet; nothing to do"
              ;;
            *)
              echo "candidate-poller: HTTP $code fetching $url — a real reachability failure, not 'unpublished'; failing this run so it does not read as a quiet poll" >&2
              exit 1
              ;;
          esac

      - name: decide — has the candidate index moved since the last poll that saw it, or is there nothing to do
        id: decide
        if: steps.fetch.outcome == 'success'
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
          HTTP_CODE: ${{ steps.fetch.outputs.http_code }}
          GENERATED_AT: ${{ steps.fetch.outputs.generated_at }}
          SHA256: ${{ steps.fetch.outputs.sha256 }}
        run: |
          out="$(scripts/candidate-poll-decide.sh index "$HTTP_CODE" "$GENERATED_AT" "$SHA256" .candidate-poller/state.txt)"
          result="$(printf '%s\n' "$out" | sed -n 's/^result=//p')"
          key="$(printf '%s\n' "$out" | sed -n 's/^key=//p')"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          {
            echo "### candidate-poller — revision $REVISION"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          case "$result" in
            absent)
              echo "no candidate build for revision $REVISION is published yet (abi${REVISION}-candidate/index.json: HTTP 404) — nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            seeded)
              mkdir -p .candidate-poller
              printf '%s' "$key" > .candidate-poller/state.txt
              echo "save=1" >> "$GITHUB_OUTPUT"
              echo "no prior baseline (first run, or the Actions-cache entry aged out) — seeded a fresh baseline at generated_at=$GENERATED_AT; nothing dispatched" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            unchanged)
              echo "candidate index unchanged since the last poll (generated_at=$GENERATED_AT) — nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            moved)
              mkdir -p .candidate-poller
              printf '%s' "$key" > .candidate-poller/state.txt
              echo "save=1" >> "$GITHUB_OUTPUT"
              echo "candidate index moved (generated_at=$GENERATED_AT, sha256=$SHA256) — checking open pull requests" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "candidate-poll-decide.sh printed an unrecognized result: $out" >&2
              exit 1
              ;;
          esac

      # The only step that reads pull-request data, and the only one that
      # dispatches. Kept as ONE step so every pull-request-controlled string
      # (branch name, head sha, head repository) stays inside this step's own
      # shell variables end to end — read from `gh api` output through env:
      # at the step boundary, never carried across a step boundary through a
      # `${{ steps....outputs.* }}` expression that a later step's `run:`
      # would have to re-splice.
      - name: dispatch ci.yml on any open, same-repo pull request whose head is at this revision
        id: dispatch
        if: steps.decide.outputs.result == 'moved'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVISION: ${{ steps.revision.outputs.revision }}
          GENERATED_AT: ${{ steps.fetch.outputs.generated_at }}
          SHA256: ${{ steps.fetch.outputs.sha256 }}
        run: |
          checked=0
          dispatched=0

          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | {number, ref: .head.ref, sha: .head.sha, head_repo: (.head.repo.full_name // "")}' \
            | python3 -c '
          import json, sys
          for line in sys.stdin:
              line = line.strip()
              if not line:
                  continue
              d = json.loads(line)
              print("\t".join(str(x) for x in (d["number"], d["ref"], d["sha"], d["head_repo"])))
          ' > candidates.tsv

          while IFS=$'\t' read -r number ref sha head_repo; do
            [ -n "$number" ] || continue
            checked=$((checked + 1))
            same_repo=0
            [ "$head_repo" = "$REPO" ] && same_repo=1

            head_rev=""
            if [ "$same_repo" = 1 ]; then
              head_rev="$(gh api "repos/$REPO/contents/include/chtypes.h?ref=$sha" --jq '.content' 2>/dev/null \
                | base64 -d 2>/dev/null \
                | sed -n 's/^#define CHS_ABI_REVISION \([0-9][0-9]*\)$/\1/p' || true)"
              cnt="$(printf '%s\n' "$head_rev" | grep -c . || true)"
              [ "$cnt" = 1 ] || head_rev=""
            fi

            decision="$(scripts/candidate-poll-decide.sh pr open "$same_repo" "$head_rev" "$REVISION")"
            eligible="$(printf '%s\n' "$decision" | sed -n 's/^eligible=//p')"
            reason="$(printf '%s\n' "$decision" | sed -n 's/^reason=//p')"

            if [ "$eligible" = 1 ]; then
              gh api --method POST "repos/$REPO/actions/workflows/ci.yml/dispatches" -f "ref=$ref" >/dev/null
              dispatched=$((dispatched + 1))
              echo "- dispatched \`ci.yml\` on PR #$number (\`$ref\`) against \`abi${REVISION}-candidate\` generated_at=$GENERATED_AT sha256=${SHA256:0:12}" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=candidate-poller::dispatched ci.yml on PR #$number ($ref) against abi${REVISION}-candidate generated_at=$GENERATED_AT sha256=${SHA256:0:12}"
            else
              echo "- PR #$number (\`$ref\`) not eligible: $reason" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < candidates.tsv

          echo "checked=$checked" >> "$GITHUB_OUTPUT"
          echo "dispatched=$dispatched" >> "$GITHUB_OUTPUT"
          if [ "$dispatched" -eq 0 ]; then
            echo "candidate-poller: checked $checked open pull request(s); none is same-repo with include/chtypes.h at revision $REVISION — nothing dispatched" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Only on 'seeded' or 'moved' (see the `decide` step's own `save=`
      # output) — 'absent' and 'unchanged' leave the stored baseline exactly
      # as it was, same "quiet stays quiet" contract as artifacts-readback.yml.
      - name: save the candidate-index key to the Actions cache
        if: steps.decide.outputs.save == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .candidate-poller/state.txt
          key: candidate-poller-state-${{ github.run_id }}
