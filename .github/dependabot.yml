version: 2

# Four bindings, one repository, so four language ecosystems plus the actions.
# Every job below is grouped into ONE pull request per Monday: the actions are
# SHA-pinned (a 40-hex ref with the version in a trailing comment), and an
# ungrouped run means a separate PR per action, each needing the same review —
# check the SHA, check the version comment, merge. Grouping makes that one
# review instead of five.
#
# There are no composite actions here. `directory: /` reaches
# .github/workflows/ but does NOT descend into .github/actions/*/action.yml,
# so adding one means adding its directory to the github-actions job below.

updates:
  # Go — the module (go/go.mod requires klauspost/compress) and the examples'
  # tour, which replaces the module with ../../go and so carries the same
  # requirement in its own go.mod and go.sum. CI runs the tour with its module
  # files as committed, so a bump to /go alone fails it. `group-by:
  # dependency-name` puts one dependency's bump in both directories into ONE
  # pull request; without it Dependabot opens one per directory.
  - package-ecosystem: gomod
    directories: ["/go", "/examples/go"]
    schedule:
      interval: weekly
      day: monday
    groups:
      go-deps:
        patterns: ["*"]
        group-by: dependency-name
    commit-message:
      prefix: deps

  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
      day: monday
    groups:
      python-deps:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
      day: monday
    groups:
      ts-deps:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
      day: monday
    groups:
      rust-deps:
        patterns: ["*"]
    commit-message:
      prefix: deps

  # GitHub Actions. These run the release workflows that publish to four public
  # registries over OIDC, so an action bump here is a supply-chain change and
  # is reviewed as one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-deps:
        patterns: ["*"]
    commit-message:
      prefix: ci
